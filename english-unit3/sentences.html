olid var(--line)}.overview-row{display:grid;grid-template-columns:35px 240px 1fr 70px;align-items:center;gap:15px;padding:22px 0;border-bottom:1px solid var(--line)}.overview-row:last-child{border:0}.idx{color:#8c9c8e;font:18px Georgia,serif}.overview-row strong{font-size:19px;font-weight:500}.overview-row p{margin:3px 0 0;font-size:12px;color:var(--muted)}.overview-row .example{font:16px/1.7 Georgia,serif}.overview-row button{border:0;background:none;color:var(--accent);font-size:12px;text-align:right;padding:8px 0}.overview-note{font-size:13px;color:var(--muted);margin:22px 0}.qhead{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin:0 0 24px}.qcn{font-size:15px;margin:0 0 20px}.question{font:clamp(23px,3vw,30px)/1.7 Georgia,serif;margin:0 0 25px;overflow-wrap:anywhere}.answer-input{width:220px;max-width:100%;border:0;border-bottom:2px solid #8aa58d;background:transparent;padding:9px 5px;color:var(--accent);font-size:21px;border-radius:0}.input-label{display:block;font-size:12px;color:var(--muted);margin-bottom:8px}.feedback{border-radius:4px;background:#eaf1e8;color:#285f43;margin-top:23px;padding:15px 18px;font-size:13px}.feedback.bad{background:#f5e9e2;color:var(--bad)}.feedback p{margin:5px 0 0}.qnav{display:flex;justify-content:space-between;gap:14px;align-items:center;margin-top:25px}.steps{display:flex;gap:7px}.steps button{width:28px;height:28px;border:1px solid var(--line);background:none;border-radius:50%;font-size:11px}.steps .active{border-color:var(--accent)}.steps .correct{background:var(--accent);color:white}.steps .wrong{color:var(--bad);border-color:#cb9f8e}.tiles{display:flex;flex-wrap:wrap;gap:9px;margin:18px 0}.tile{border:1px solid #cbd5c8;border-radius:4px;padding:10px 14px;background:white;font-size:17px}.picked{background:#edf2e8;min-height:90px;border:1px dashed #c1cfbd;border-radius:5px;padding:13px}.picked .tiles{margin:0}.picked .placeholder{font-size:13px;color:var(--muted);margin:12px 0}.freewrite{margin-top:27px;padding-top:25px;border-top:1px solid var(--line)}.freewrite p{margin:0 0 10px;font-size:14px}.freewrite .en{font:18px Georgia,serif;color:var(--muted)}textarea{width:100%;min-height:104px;resize:vertical;border:1px solid var(--line);background:#fffefa;border-radius:4px;padding:14px;color:var(--ink);font-size:16px}.status{font-size:11px;color:var(--muted)}details{margin-top:16px;color:var(--muted);font-size:12px}details p{font-size:14px;color:var(--ink)}summary{cursor:pointer}.empty{text-align:center;padding:55px 20px}.empty p{color:var(--muted);font-size:14px}.review-list{display:grid;gap:12px}.review-row{border:1px solid var(--line);background:var(--paper);border-radius:5px;padding:20px;display:flex;justify-content:space-between;gap:15px;align-items:center}.review-row p{margin:0;font-size:15px}.review-row small{font-size:12px;color:var(--muted)}footer{display:flex;gap:20px;justify-content:space-between;align-items:center;font-size:11px;color:var(--muted);padding:23px 0 35px}.save-error{background:#f5e9e2;color:var(--bad);padding:10px 14px;font-size:12px}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}@media(max-width:700px){.wrap{padding:0 20px}.top{padding:22px 0;gap:15px;align-items:flex-start}.utilities{gap:10px 17px;justify-content:flex-end;font-size:11px}.hero{padding-top:30px}.number{font-size:48px}.hero p{font-size:12px}h1{font-size:29px}.switch{gap:12px}.switch select{font-size:12px;width:100%;min-width:0}.switch .text{white-space:nowrap}.sheet{padding:25px 21px}.tabs{gap:23px}.tab{font-size:12px}.part{font-size:14px;padding:9px 11px}.formula{gap:6px}.rule{font-size:14px}.quote{padding-left:16px}.quote .en{font-size:22px}.overview{padding:0 20px}.overview-row{grid-template-columns:25px 1fr 55px;gap:10px;padding:20px 0}.overview-row strong{font-size:17px}.overview-row .example{grid-column:2/4;grid-row:2;font-size:15px}.overview-row button{grid-column:3;grid-row:1}.overview-head{font-size:10px}.tile{font-size:15px;padding:8px 11px}.qnav{gap:9px}.qnav .btn{padding:9px 12px}.review-row{padding:17px}.review-row p{font-size:13px}footer{align-items:flex-start;gap:15px;font-size:10px}.freewrite .en{font-size:16px}}@media print{.utilities,.switch,.tabs,.actions,footer{display:none}.wrap{max-width:100%;padding:0}.overview-row{break-inside:avoid}.hero{padding:20px 0}.number{font-size:40px}.overview{border:0}}
</style></head><body><div class="wrap"><header class="top"><div class="identity">英语 · 第三单元<span>HAPPY TOGETHER</span></div><nav class="utilities" aria-label="单元导航"><a href="index.html">返回单元</a><a href="phrase-01.html">词组结构</a></nav></header><section class="hero"><div><h1 id="title">第三单元重点句型</h1><p id="subtitle">先读懂，再写一句自己的话。</p></div><span class="number" id="number" aria-hidden="true">09</span></section><div class="switch"><label class="sr-only" for="lesson-select">切换句型</label><select id="lesson-select" aria-label="切换句型"></select><button class="text" id="overview">全部句型 ↗</button></div><nav class="tabs" role="tablist" aria-label="学习方式" id="tabs"><button class="tab" role="tab" id="tab-learn" data-view="learn" aria-selected="true" aria-controls="content">读懂句型</button><button class="tab" role="tab" id="tab-practice" data-view="practice" aria-selected="false" aria-controls="content">动手练习</button><button class="tab" role="tab" id="tab-review" data-view="review" aria-selected="false" aria-controls="content">回顾错题 <span class="badge" id="wrong-count">0</span></button></nav><main id="content" tabindex="-1"></main><p id="save-error" class="save-error" role="status" hidden></p><footer><span>进度与仿写保存在当前浏览器。朗读使用设备语音。</span><button class="text" id="export">导出作答</button></footer></div><script>const LESSONS = [
{id:'01',name:'and · 把信息连起来',short:'… and …',meaning:'并列：……并且……',formula:['句子 / 同类内容','and','句子 / 同类内容'],rule:'把两项信息放在一起。and 不只连接完整句子，也可以连接两个动作、特点或名词。',source:'课本 p31 · 原文',quote:'Friends play together and friends share with each other.',translation:'朋友们一起玩，也互相分享。',highlight:'and',tip:'I fly and you run. 也在并列介绍两人的活动；有不同点，不代表一定用 but。要看说话时强调什么。',transfer:'We read books and play games together.',transferCN:'我们一起读书、玩游戏。',write:'写出你和朋友一起做的两件事，用 and 连接。',starter:'We often ___ and ___ together.',reference:'We often read books and play games together.',ex:[
{type:'fill',prompt:'We sing ___ dance together.',cn:'我们一起唱歌、跳舞。两个活动都做。',answer:['and'],why:'唱歌和跳舞是两个并列的活动，用 and。'},
{type:'fill',prompt:'My friend is funny ___ kind.',cn:'我的朋友既有趣又友善。两个特点都具备。',answer:['and'],why:'and 也能连接 funny 和 kind 两个形容词。'},
{type:'order',cn:'我们一起读书、玩游戏。',tokens:['We','read books','and','play games','together.'],answer:['We read books and play games together.','We play games and read books together.'],why:'用 and 连接两个活动。两个活动的先后可以交换。'}]},
{id:'02',name:'but · 说出转折',short:'… but …',meaning:'转折：……但是……',formula:['句子','but','句子'],rule:'后面的情况与前面的预期不同，或说话人要强调两者的对比，用 but。',source:'课本 p31 · 原文',quote:'We want to be friends but we can’t.',translation:'我们想成为朋友，但是我们不能。',highlight:'but',tip:'先说两人的不同，再说仍然相处愉快，是本单元常用的表达方法。',transfer:'We have different hobbies, but we are good friends.',transferCN:'我们有不同的爱好，但我们是好朋友。',write:'说出你和朋友的一个不同点，用 but 连接。',starter:'I like ___, but my friend likes ___.',reference:'I like meat, but my friend likes vegetables.',ex:[
{type:'fill',prompt:'We are different, ___ we are good friends.',cn:'我们不一样，但是我们是好朋友。',answer:['but'],why:'“不一样”与“仍然是好朋友”形成转折，用 but。'},
{type:'fill',prompt:'I like milk, ___ my friend doesn’t like it.',cn:'我喜欢牛奶，但是我的朋友不喜欢。',answer:['but'],why:'这里强调喜欢与不喜欢的对比，用 but。'},
{type:'order',cn:'我们不一样，但是我们是好朋友。',tokens:['We are different,','but','we are','good friends.'],answer:['We are different, but we are good friends.'],why:'先说不同，再用 but 引出“是好朋友”。'}]},
{id:'03',name:'because · 说清原因',short:'… because …',meaning:'原因：……因为……',formula:['要解释的情况','because','原因'],rule:'because 后面接原因。先问自己“为什么”，再找到解释这件事的内容。',source:'课本 p31 · 原文',quote:'But we are friends because we are happy together.',translation:'但我们是朋友，因为我们在一起很快乐。',highlight:'because',tip:'原因也可以放在句首：Because we are happy together, we are friends. 本组表达一组因果关系时，because 和 so 不同时使用。',transfer:'I like my friend because she helps me.',transferCN:'我喜欢我的朋友，因为她帮助我。',write:'用一件具体的事，说明你为什么喜欢这位朋友。',starter:'I like my friend because ___.',reference:'I like my friend because she listens to me.',ex:[
{type:'fill',prompt:'I like my friend ___ she helps me.',cn:'我喜欢我的朋友，因为她帮助我。',answer:['because'],why:'“她帮助我”解释喜欢朋友的原因，用 because。'},
{type:'fill',prompt:'Why are you happy? — ___ my friend is here.',cn:'你为什么开心？——因为我的朋友在这里。',answer:['Because'],why:'Why 问原因，可以用 Because 引出回答。'},
{type:'order',cn:'我开心，因为我的朋友在这里。',tokens:['I am happy','because','my friend is here.'],answer:['I am happy because my friend is here.'],why:'because 后面的 my friend is here 是原因。'}]},
{id:'04',name:'want to · 表达想法',short:'want to do',meaning:'想要做某事',formula:['主语','want / wants to','动词原形＋其他'],rule:'want to 后面的动作保持原形。一般现在时中，主语是 he、she 或单个人名时，用 wants to。',source:'课本 p32 · 原文',quote:'I want to go out and try something new.',translation:'我想出去尝试新事物。',highlight:'want to',tip:'I want to play. → She wants to play. 只改变 want，to 后面的 play 保持原形。',transfer:'She wants to play with her friends.',transferCN:'她想和她的朋友们一起玩。',write:'写出你想和朋友一起做的一件事。',starter:'I want to ___ with my friend.',reference:'I want to read books with my friend.',ex:[
{type:'fill',prompt:'I want ___ play with my friend.',cn:'我想和我的朋友一起玩。',answer:['to'],why:'“想做”用 want to do；play 前需要 to。'},
{type:'fill',prompt:'She ___ to read books with me. (want)',cn:'她想和我一起读书。填写 want 的正确形式。',answer:['wants'],why:'主语是 She，一般现在时中用 wants；to 后仍用 read。'},
{type:'order',cn:'他想和图图一起玩。',tokens:['He','wants to','play','with Tutu.'],answer:['He wants to play with Tutu.'],why:'He＋wants to＋动词原形 play。'}]},
{id:'05',name:'ask someone to · 请人做事',short:'ask sb. to do',meaning:'请某人做某事',formula:['主语','ask / asks＋某人','to＋动词原形＋其他'],rule:'先说请谁，再用 to 引出要做的事。sb. 表示“某人”，do 表示动词原形。',source:'课本 p28 · 原文',quote:'Tutu asks Duoduo to join them but Duoduo just walks away.',translation:'兔兔请多多加入他们，但多多径直走开了。',highlight:'asks Duoduo to join',tip:'asks Duoduo to join them：请谁？Duoduo。做什么？join them。换成“请我”时用 ask me to…，不用 ask I to…。',transfer:'I ask my friend to help me.',transferCN:'我请我的朋友帮助我。',write:'写一句你请朋友一起做某事的话。',starter:'I ask my friend to ___.',reference:'I ask my friend to play a game with me.',ex:[
{type:'fill',prompt:'Tutu asks Duoduo ___ join them.',cn:'兔兔请多多加入他们。',answer:['to'],why:'ask sb. to do：某人后面用 to＋动词原形。'},
{type:'fill',prompt:'She ___ me to read with her. (ask)',cn:'她请我和她一起读书。填写 ask 的正确形式。',answer:['asks'],why:'主语是 She，一般现在时中 ask 变为 asks。'},
{type:'order',cn:'我请我的朋友帮助我。',tokens:['I','ask','my friend','to help me.'],answer:['I ask my friend to help me.'],why:'ask 后先放“请谁”，再放 to help me“做什么”。'}]},
{id:'06',name:'enjoy doing · 表达喜欢',short:'enjoy doing',meaning:'喜欢做某事',formula:['主语','enjoy / enjoys','动词-ing＋其他'],rule:'enjoy 后面接动作时，动词变成 -ing 形式，不用 enjoy to do。talk → talking；play → playing。',source:'课本 p29 · 原题保留空格',quote:'Xiaojun and I have different hobbies ___ we enjoy talking to each other.',translation:'小军和我有不同的爱好，___ 我们喜欢互相交谈。',highlight:'enjoy talking',sourceNote:'原题空格填 but，表示爱好不同，但仍喜欢交谈。',tip:'We enjoy talking. → She enjoys talking. 主语改变时，enjoy 可以变为 enjoys；后面的 talking 保持 -ing 形式。',transfer:'She enjoys reading books.',transferCN:'她喜欢读书。',write:'写出你和朋友都喜欢做的一件事。',starter:'We enjoy ___ together.',reference:'We enjoy playing games together.',ex:[
{type:'fill',prompt:'We enjoy ___ to each other. (talk)',cn:'我们喜欢互相交谈。填写 talk 的正确形式。',answer:['talking'],why:'enjoy 后面的动作使用 -ing 形式：talking。'},
{type:'fill',prompt:'She ___ reading books. (enjoy)',cn:'她喜欢读书。填写 enjoy 的正确形式。',answer:['enjoys'],why:'主语 She 对应 enjoys；reading 已是正确的 -ing 形式。'},
{type:'order',cn:'我们喜欢一起玩游戏。',tokens:['We','enjoy','playing games','together.'],answer:['We enjoy playing games together.'],why:'enjoy＋playing，不用 enjoy to play。'}]},
{id:'07',name:'make someone happy · 使人感到……',short:'make sb.＋形容词',meaning:'使某人处于某种状态',formula:['主语','make / makes＋某人','形容词'],rule:'要说“使谁开心、难过或担心”，某人后面用形容词，如 happy、sad、unhappy。',source:'课本 p28 · 原文',quote:'This makes Duoduo unhappy.',translation:'这使多多不开心。',highlight:'makes Duoduo unhappy',tip:'This makes me happy. 中 me 表示“使谁”，happy 表示“什么状态”。me 不用 I，happy 前不加 to 或 be。',transfer:'My friends make me happy.',transferCN:'我的朋友们使我开心。',write:'写出什么事使你开心或难过。',starter:'___ makes me happy / sad.',reference:'Playing with my friend makes me happy.',ex:[
{type:'fill',prompt:'This makes Duoduo ___. (不开心的)',cn:'这使多多不开心。',answer:['unhappy'],why:'make＋某人＋形容词；“不开心的”是 unhappy。'},
{type:'fill',prompt:'Her help ___ me happy. (make)',cn:'她的帮助使我开心。填写 make 的正确形式。',answer:['makes'],why:'Her help 是单数主语，用 makes；后面 happy 表示状态。'},
{type:'order',cn:'我的朋友们使我开心。',tokens:['My friends','make','me','happy.'],answer:['My friends make me happy.'],why:'My friends 是复数主语，用 make；me 后接形容词 happy。'}]},
{id:'08',name:'make someone laugh · 使人做……',short:'make sb. do',meaning:'使某人做某事',formula:['主语','make / makes＋某人','动词原形＋其他'],rule:'要说“使谁做一个动作”，某人后面直接接动词原形，如 laugh，不加 to，也不加 -ing。',source:'课本 p29 · 原题保留空格',quote:'Momo often makes me laugh ___ he is funny.',translation:'默默经常逗我笑，___ 他很有趣。',highlight:'makes me laugh',sourceNote:'原题空格填 because，“他很有趣”说明让我笑的原因。',tip:'make me happy：happy 是形容词，说明状态。make me laugh：laugh 是动词，说明动作。两种结构都要先说“使谁”。',transfer:'His stories make us laugh.',transferCN:'他的故事逗我们笑。',write:'写出谁或什么会逗你笑。',starter:'___ makes me laugh.',reference:'My friend often makes me laugh.',ex:[
{type:'fill',prompt:'Momo often makes me ___. (laugh)',cn:'默默经常逗我笑。填写 laugh 的正确形式。',answer:['laugh'],why:'make sb. do：me 后接动词原形 laugh，不加 to。'},
{type:'fill',prompt:'His stories ___ us laugh. (make)',cn:'他的故事逗我们笑。填写 make 的正确形式。',answer:['make'],why:'His stories 是复数主语，用 make；us 后的 laugh 保持原形。'},

const KEY='english-u3-sentences-v1';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm=s=>String(s??'').normalize('NFKC').toLowerCase().replace(/[’‘]/g,"'").replace(/[.,!?;:，。！？；：]/g,' ').replace(/\s+/g,' ').trim();
const qid=(g,i)=>`${g.id}-${i}`;
const allQuestions=()=>LESSONS.flatMap(g=>g.ex.map((q,i)=>({g,q,i,id:qid(g,i)})));
function grade(q,draft){
 if(q.type==='order'){
  const ids=draft?.order||[];
  if(ids.length!==q.tokens.length||new Set(ids).size!==ids.length||ids.some(i=>!Number.isInteger(i)||i<0||i>=q.tokens.length))return {empty:true,message:'把所有词块放入句子后，再检查。'};
  const text=ids.map(i=>q.tokens[i]).join(' ');
  return {correct:q.answer.some(a=>norm(a)===norm(text)),text};
 }
 const text=String(draft?.value??'').trim();
 if(!text)return {empty:true,message:'先在空格里写出答案。'};
 return {correct:q.answer.some(a=>norm(a)===norm(text)),text};
}
const signature=d=>JSON.stringify(d||{});
let state={drafts:{},results:{},mistakes:{},history:[],writing:{},positions:{}};
let active='all',view='learn',reviewMessage='';
let storageFailed=false;
const byId=id=>document.getElementById(id);
function save(){try{localStorage.setItem(KEY,JSON.stringify(state));storageFailed=false;}catch{storageFailed=true;}if(typeof document!=='undefined'){const e=byId('save-error');if(e){e.hidden=!storageFailed;e.textContent='当前浏览器无法保存进度，请用“导出作答”保留本次内容。';}}}
function loadState(){try{const s=JSON.parse(localStorage.getItem(KEY)||'null');if(s&&typeof s==='object'){for(const k of ['drafts','results','mistakes','writing','positions'])if(s[k]&&typeof s[k]==='object'&&!Array.isArray(s[k]))state[k]=s[k];if(Array.isArray(s.history))state.history=s.history;}}catch{storageFailed=true;}}
function lesson(){return LESSONS.find(g=>g.id===active);}
function currentIndex(){return Math.max(0,Math.min(2,Number(state.positions[active])||0));}
function wrongEntries(){return allQuestions().filter(e=>state.mistakes[e.id]);}
function doneCount(g){return g.ex.filter((q,i)=>state.results[qid(g,i)]?.correct&&state.results[qid(g,i)]?.signature===signature(state.drafts[qid(g,i)])).length;}
function highlight(text,target){const i=text.indexOf(target);return i<0?esc(text):esc(text.slice(0,i))+'<mark>'+esc(target)+'</mark>'+esc(text.slice(i+target.length));}
function change(id,nextView='learn',index){active=LESSONS.some(g=>g.id===id)?id:'all';view=['learn','practice','review'].includes(nextView)?nextView:'learn';reviewMessage='';if(index!==undefined)state.positions[active]=index;save();const u=new URL(location.href);if(active==='all'){u.searchParams.delete('pattern');u.searchParams.delete('view');}else{u.searchParams.set('pattern',active);if(view==='learn')u.searchParams.delete('view');else u.searchParams.set('view',view);}history.replaceState(null,'',u);render();}
function render(){
 const g=lesson();byId('lesson-select').value=active;
 byId('title').textContent=g?g.name:'第三单元重点句型';byId('subtitle').textContent=g?g.meaning:'9组句型 · 教材例句、用法与练习';byId('number').textContent=g?g.id:'09';
 byId('tabs').hidden=!g;byId('overview').hidden=!g;
 byId('wrong-count').textContent=wrongEntries().length;
 document.querySelectorAll('[data-view]').forEach(b=>{b.setAttribute('aria-selected',String(b.dataset.view===view));b.tabIndex=b.dataset.view===view?0:-1;});
 const main=byId('content');if(g){main.setAttribute('role','tabpanel');main.setAttribute('aria-labelledby','tab-'+view);}else{main.removeAttribute('role');main.removeAttribute('aria-labelledby');}
 main.innerHTML=!g?overview():view==='learn'?learn(g):view==='review'?review():practice(g);
 if(storageFailed){byId('save-error').hidden=false;byId('save-error').textContent='当前浏览器无法保存进度，请用“导出作答”保留本次内容。';}
}
function overview(){return `<section class="sheet overview" aria-label="九组句型总览"><div class="overview-head"><span>句型与用法</span><span>每组3道练习＋1句仿写</span></div>${LESSONS.map(g=>`<article class="overview-row"><span class="idx">${g.id}</span><div><strong lang="en">${esc(g.short)}</strong><p>${esc(g.meaning)}</p></div><div class="example" lang="en">${highlight(g.transfer,g.highlight)}</div><button data-open="${g.id}" aria-label="学习第${g.id}组 ${esc(g.short)}">学习 →</button></article>`).join('')}</section><p class="overview-note">先练 and / but / because，再练 want、ask、enjoy，最后比较 make 的两种用法和 Let’s。总览例句为迁移示例；每组学习页附教材原文。</p>`;}
function learn(g){const next=LESSONS[LESSONS.indexOf(g)+1];return `<section class="sheet"><p class="eyebrow">${g.id} / 09 · ${doneCount(g)} / 3 题已答对</p><div class="formula" aria-label="句型结构">${g.formula.map((p,i)=>(i?'<span class="plus" aria-hidden="true">＋</span>':'')+`<span class="part">${esc(p)}</span>`).join('')}</div><p class="rule">${esc(g.rule)}</p><blockquote class="quote"><p class="source">${esc(g.source)}</p><p class="en" lang="en">${highlight(g.quote,g.highlight)}</p><p class="translation">${esc(g.translation)}</p>${g.sourceNote?`<p class="note">${esc(g.sourceNote)}</p>`:''}</blockquote><p class="note">${esc(g.tip)}</p><div class="transfer"><p class="source">迁移示例</p><p class="en" lang="en">${esc(g.transfer)}</p><p class="translation">${esc(g.transferCN)}</p></div><div class="actions"><button class="btn" data-action="start">练这一组 →</button><button class="text" data-speak="${esc(g.sourceNote?g.transfer:g.quote)}">朗读例句</button>${next?`<button class="text spacer" data-open="${next.id}">下一组 →</button>`:'<button class="text spacer" data-open="all">回到总览 →</button>'}</div><p class="status" id="speech-status" role="status"></p></section>`;}
function practice(g){const i=currentIndex(),q=g.ex[i],id=qid(g,i),draft=state.drafts[id]||{},r=state.results[id],same=r&&r.signature===signature(draft);return `<section class="sheet"><div class="qhead"><span>${q.type==='order'?'词块排句':'句型填空'} · ${i+1} / 3</span><span>${doneCount(g)} / 3 题已答对 · 自编练习</span></div><p class="qcn">${esc(q.cn)}</p>${q.type==='fill'?`<p class="question" lang="en">${esc(q.prompt)}</p><form id="answer-form"><label class="input-label" for="answer-input">填写空缺的单词</label><input id="answer-input" class="answer-input" lang="en" value="${esc(draft.value)}" autocomplete="off" autocapitalize="off" spellcheck="false" aria-describedby="feedback"><div class="actions"><button class="btn" type="submit">检查答案</button></div></form>`:`<div class="picked" aria-label="已组成的句子">${draft.order?.length?`<div class="tiles">${draft.order.map((n,j)=>`<button class="tile" data-remove="${j}" title="点击撤回这个词块" aria-label="撤回 ${esc(q.tokens[n])}">${esc(q.tokens[n])}</button>`).join('')}</div>`:'<p class="placeholder">依次点击下方词块，把它们排成一句话。</p>'}</div><div class="tiles" aria-label="可选词块">${q.tokens.map((t,n)=>({t,n})).reverse().map(({t,n})=>`<button class="tile" data-token="${n}" ${(draft.order||[]).includes(n)?'disabled':''}>${esc(t)}</button>`).join('')}</div><div class="actions"><button class="btn" data-action="check">检查答案</button><button class="text" data-action="clear-order">重新排列</button></div>`}<div id="feedback" role="status" aria-live="polite">${same?feedback(q,r):reviewMessage?`<p class="note">${esc(reviewMessage)}</p>`:''}</div><div class="qnav"><button class="btn secondary" data-step="-1" ${i===0?'disabled':''}>上一题</button><div class="steps" aria-label="选择题目">${g.ex.map((x,n)=>{const v=state.results[qid(g,n)],valid=v?.signature===signature(state.drafts[qid(g,n)]);return `<button data-index="${n}" aria-label="第${n+1}题" ${n===i?'aria-current="step"':''} class="${n===i?'active ':''}${valid?(v.correct?'correct':'wrong'):''}">${n+1}</button>`;}).join('')}</div><button class="btn secondary" data-step="1" ${i===2?'disabled':''}>下一题</button></div><div class="freewrite"><p>${esc(g.write)}</p><p class="en" lang="en">${esc(g.starter)}</p><label class="sr-only" for="writing">这一组的自主仿写</label><textarea id="writing" lang="en" placeholder="写一句自己的话……" spellcheck="false">${esc(state.writing[g.id])}</textarea><span class="status" id="writing-status" role="status">${state.writing[g.id]?'仿写已保存，待老师批阅。':'输入后自动保存，交给老师一起修改。'}</span><details><summary>需要时看参考表达</summary><p lang="en">${esc(g.reference)}</p><span>参考表达为自编示例；自己的句子可以不同。</span></details></div></section>`;}
function feedback(q,r){return `<div class="feedback ${r.correct?'':'bad'}"><strong>${r.correct?'✓ 这一题答对了。':'再想一想，检查句型。'}</strong><p>${esc(q.why)}</p>${!r.correct?`<p>参考答案：<span lang="en">${esc(q.answer[0])}</span></p>`:''}</div>`;}
function review(){const entries=wrongEntries();return entries.length?`<div class="review-list">${entries.map(({g,q,i,id})=>`<article class="review-row"><div><small>第${g.id}组 · ${esc(g.short)}</small><p>${esc(q.type==='fill'?q.prompt:q.cn)}</p><small>上次提交：${esc(state.results[id]?.text||'')}</small></div><button class="btn secondary" data-review="${g.id}:${i}">再做一次</button></article>`).join('')}</div><p class="note">这里汇总各组尚未订正的错题，重新答对后移出；作答历史保留在导出记录中。</p>`:`<section class="sheet empty"><p>目前没有待订正的错题。</p><button class="btn secondary" data-action="start">去练这一组 →</button></section>`;}
function check(){const g=lesson(),i=currentIndex(),q=g.ex[i],id=qid(g,i),draft=state.drafts[id]||{},result=grade(q,draft);if(result.empty){reviewMessage=result.message;byId('feedback').innerHTML=`<p class="note">${esc(result.message)}</p>`;return;}const record={...result,signature:signature(draft),at:new Date().toISOString()};state.results[id]=record;if(result.correct)delete state.mistakes[id];else state.mistakes[id]=true;state.history.push({id,...record});reviewMessage='';save();render();}
function speak(text){const e=byId('speech-status');if(!('speechSynthesis' in window)){e.textContent='当前设备暂不支持朗读。';return;}try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='en-GB';u.rate=.82;u.onerror=()=>{if(byId('speech-status'))byId('speech-status').textContent='朗读暂时不可用，可以先读文字。';};speechSynthesis.speak(u);}catch{e.textContent='朗读暂时不可用，可以先读文字。';}}
function exportAnswers(){let lines=['第三单元 Happy together · 句型练习',new Date().toLocaleString('zh-CN')];for(const g of LESSONS){lines.push('',`${g.id} ${g.short}｜${g.meaning}`);g.ex.forEach((q,i)=>{const id=qid(g,i),d=state.drafts[id],v=state.results[id],current=v&&v.signature===signature(d);lines.push(`${i+1}. ${q.prompt||q.cn}`,`当前作答：${q.type==='order'?(d?.order||[]).map(n=>q.tokens[n]).join(' '):d?.value||'未作答'}`,`结果：${current?(v.correct?'答对':'待订正'):'尚未检查'}`);});lines.push(`仿写（待老师批阅）：${state.writing[g.id]||'未填写'}`);}lines.push('','完整检查记录');state.history.forEach(h=>lines.push(`${h.at} | ${h.id} | ${h.text} | ${h.correct?'答对':'答错'}`));const blob=new Blob(['\ufeff'+lines.join('\n')],{type:'text/plain;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='Unit3-sentence-practice.txt';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}
function init(){loadState();byId('lesson-select').innerHTML='<option value="all">全部9组句型 · 总览</option>'+LESSONS.map(g=>`<option value="${g.id}">${g.id} · ${esc(g.name)}</option>`).join('');const fromURL=()=>{const u=new URL(location.href),id=u.searchParams.get('pattern');active=LESSONS.some(g=>g.id===id)?id:'all';view=['learn','practice','review'].includes(u.searchParams.get('view'))?u.searchParams.get('view'):'learn';render();};fromURL();window.addEventListener('popstate',fromURL);byId('lesson-select').addEventListener('change',e=>change(e.target.value));byId('overview').addEventListener('click',()=>change('all'));byId('export').addEventListener('click',exportAnswers);byId('content').addEventListener('submit',e=>{if(e.target.id==='answer-form'){e.preventDefault();check();}});document.addEventListener('input',e=>{if(e.target.id==='answer-input'){state.drafts[qid(lesson(),currentIndex())]={value:e.target.value};reviewMessage='';byId('feedback').innerHTML='';save();}if(e.target.id==='writing'){state.writing[active]=e.target.value;save();byId('writing-status').textContent=storageFailed?'暂未保存，请导出作答。':'仿写已保存，待老师批阅。';}});document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b||b.disabled)return;if(b.dataset.open){change(b.dataset.open);return;}if(b.dataset.view){change(active,b.dataset.view);return;}if(b.dataset.speak){speak(b.dataset.speak);return;}if(b.dataset.review){const [g,i]=b.dataset.review.split(':');change(g,'practice',Number(i));return;}const g=lesson();if(!g)return;if(b.dataset.action==='start'){change(active,'practice');return;}if(b.dataset.action==='check'){check();return;}if(b.dataset.step||b.dataset.index!==undefined){state.positions[active]=b.dataset.index!==undefined?Number(b.dataset.index):Math.max(0,Math.min(2,currentIndex()+Number(b.dataset.step)));reviewMessage='';save();render();return;}const id=qid(g,currentIndex());if(b.dataset.token!==undefined){const d=state.drafts[id]||{order:[]};d.order=d.order||[];const n=Number(b.dataset.token);if(!d.order.includes(n))d.order.push(n);state.drafts[id]=d;reviewMessage='';save();render();}if(b.dataset.remove!==undefined){state.drafts[id].order.splice(Number(b.dataset.remove),1);reviewMessage='';save();render();}if(b.dataset.action==='clear-order'){state.drafts[id]={order:[]};reviewMessage='';save();render();}});byId('tabs').addEventListener('keydown',e=>{if(!['ArrowLeft','ArrowRight','Home','End'].includes(e.key))return;const items=['learn','practice','review'];let n=items.indexOf(view);n=e.key==='Home'?0:e.key==='End'?2:(n+(e.key==='ArrowRight'?1:2))%3;e.preventDefault();change(active,items[n]);byId('tab-'+items[n]).focus();});}
if(typeof document!=='undefined')init();
</script></body></html>
