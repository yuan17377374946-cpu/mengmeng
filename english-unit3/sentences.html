n-top:27px;padding-top:25px;border-top:1px solid var(--line)}.freewrite p{margin:0 0 10px;font-size:14px}.freewrite .en{font:18px Georgia,serif;color:var(--muted)}textarea{width:100%;min-height:104px;resize:vertical;border:1px solid var(--line);background:#fffefa;border-radius:4px;padding:14px;color:var(--ink);font-size:16px}.status{font-size:11px;color:var(--muted)}details{margin-top:16px;color:var(--muted);font-size:12px}details p{font-size:14px;color:var(--ink)}summary{cursor:pointer}.empty{text-align:center;padding:55px 20px}.empty p{color:var(--muted);font-size:14px}.review-list{display:grid;gap:12px}.review-row{border:1px solid var(--line);background:var(--paper);border-radius:5px;padding:20px;display:flex;justify-content:space-between;gap:15px;align-items:center}.review-row p{margin:0;font-size:15px}.review-row small{font-size:12px;color:var(--muted)}footer{display:flex;gap:20px;justify-content:space-between;align-items:center;font-size:11px;color:var(--muted);padding:23px 0 35px}.save-error{background:#f5e9e2;color:var(--bad);padding:10px 14px;font-size:12px}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}@media(max-width:700px){.wrap{padding:0 20px}.top{padding:22px 0;gap:15px;align-items:flex-start}.utilities{gap:10px 17px;justify-content:flex-end;font-size:11px}.hero{padding-top:30px}.number{font-size:48px}.hero p{font-size:12px}h1{font-size:29px}.switch{gap:12px}.switch select{font-size:12px;width:100%;min-width:0}.switch .text{white-space:nowrap}.sheet{padding:25px 21px}.tabs{gap:23px}.tab{font-size:12px}.part{font-size:14px;padding:9px 11px}.formula{gap:6px}.rule{font-size:14px}.quote{padding-left:16px}.quote .en{font-size:22px}.overview{padding:0 20px}.overview-row{grid-template-columns:25px 1fr 55px;gap:10px;padding:20px 0}.overview-row strong{font-size:17px}.overview-row .example{grid-column:2/4;grid-row:2;font-size:15px}.overview-row button{grid-column:3;grid-row:1 .answer-option{display:flex;gap:12px;align-items:center;padding:13px 16px;margin-bottom:10px;border:1px solid var(--line);border-radius:5px;cursor:pointer;font-size:16px}.answer-option:has(input:checked){background:var(--soft);border-color:var(--accent)}.answer-option input{accent-color:var(--accent);width:17px;height:17px;flex-shrink:0}.steps{flex-wrap:wrap}@media(max-width:700px){.answer-option{font-size:15px}.steps{gap:4px}.steps button{width:25px;height:25px}}</style></head><body><div class="wrap"><header class="top"><div class="identity">英语 · 第三单元<span>HAPPY TOGETHER</span></div><nav class="utilities" aria-label="单元导航"><a href="index.html">返回单元</a><a href="phrase-01.html">词组结构</a><a href="questions.html">朋友问答</a></nav></header><section class="hero"><div><h1 id="title">第三单元重点句型</h1><p id="subtitle">先读懂，再写一句自己的话。</p></div><span class="number" id="number" aria-hidden="true">09</span></section><div class="switch"><label class="sr-only" for="lesson-select">切换句型</label><select id="lesson-select" aria-label="切换句型"></select><button class="text" id="overview">全部句型 ↗</button></div><nav class="tabs" role="tablist" aria-label="学习方式" id="tabs"><button class="tab" role="tab" id="tab-learn" data-view="learn" aria-selected="true" aria-controls="content">读懂句型</button><button class="tab" role="tab" id="tab-practice" data-view="practice" aria-selected="false" aria-controls="content">动手练习</button><button class="tab" role="tab" id="tab-review" data-view="review" aria-selected="false" aria-controls="content">回顾错题 <span class="badge" id="wrong-count">0</span></button></nav><main id="content" tabindex="-1"></main><p id="save-error" class="save-error" role="status" hidden></p><footer><span>新版练习进度与仿写保存在当前浏览器。朗读使用设备语音。</span><button class="text" id="export">导出作答</button></footer></div><script>const LESSONS = [
  {
    "id": "01",
    "name": "and · 把信息连起来",
    "short": "… and …",
    "meaning": "并列：……并且……",
    "formula": [
      "句子 / 同类内容",
      "and",
      "句子 / 同类内容"
    ],
    "rule": "把两项信息放在一起。and 不只连接完整句子，也可以连接两个动作、特点或名词。",
    "source": "课本 p31 · 原文",
    "quote": "Friends play together and friends share with each other.",
    "translation": "朋友们一起玩，也互相分享。",
    "highlight": "and",
    "tip": "I fly and you run. 也在并列介绍两人的活动；有不同点，不代表一定用 but。要看说话时强调什么。",
    "transfer": "We read books and play games together.",
    "transferCN": "我们一起读书、玩游戏。",
    "write": "写出你和朋友一起做的两件事，用 and 连接。",
    "starter": "We often ___ and ___ together.",
    "reference": "We often read books and play games together.",
    "ex": [
      {
        "type": "choice",
        "prompt": "Anna draws pictures ___ her brother writes stories.",
        "cn": "两人各做一件事，并列介绍他们的活动。",
        "options": [
          "and",
          "but",
          "because"
        ],
        "answer": 0,
        "why": "两项活动并列，用 and。"
      },
      {
        "type": "choice",
        "prompt": "选择表达“凯特既聪明又友善”的句子。",
        "cn": "根据题意选择一个最合适的答案。",
        "options": [
          "Kate is clever and kind.",
          "Kate is clever because kind.",
          "Kate is clever but kind."
        ],
        "answer": 0,
        "why": "两个特点都具备，用 and；clever：聪明的。"
      },
      {
        "type": "choice",
        "prompt": "你想告诉朋友“我带了铅笔和橡皮”。选出符合意思的句子。",
        "cn": "根据题意选择一个最合适的答案。",
        "options": [
          "I have a pencil but no rubber.",
          "I have a pencil and a rubber.",
          "I have a pencil because I have a rubber."
        ],
        "answer": 1,
        "why": "铅笔和橡皮都带了，用 and 连接。rubber：橡皮。"
      },
      {
        "type": "fill",
        "prompt": "Dad cooks ___ Mum washes the dishes.",
        "cn": "爸爸做饭，妈妈洗碗，并列介绍分工。",
        "answer": [
          "and"
        ],
        "why": "两个活动并列，用 and。"
      },
      {
        "type": "fill",
        "prompt": "Leo is quiet ___ friendly.",
        "cn": "利奥既安静又友好。",
        "answer": [
          "and"
        ],
        "why": "两个特点用 and 连接。"
      },
      {
        "type": "order",
        "cn": "我的姐姐画画、唱歌，两件事都做。",
        "tokens": [
          "My sister",
          "draws pictures",
          "and",
          "sings songs."
        ],
        "answer": [
          "My sister draws pictures and sings songs."
        ],
        "why": "两个动作并列，用 and；My sister 后用 draws、sings。"
      }
    ]
  },
  {
    "id": "02",
    "name": "but · 说出转折",
    "short": "… but …",
    "meaning": "转折：……但是……",
    "formula": [
      "句子",
      "but",
      "句子"
    ],
    "rule": "后面的情况与前面的预期不同，或说话人要强调两者的对比，用 but。",
    "source": "课本 p31 · 原文",
    "quote": "We want to be friends but we can’t.",
    "translation": "我们想成为朋友，但是我们不能。",
    "highlight": "but",
    "tip": "先说两人的不同，再说仍然相处愉快，是本单元常用的表达方法。",
    "transfer": "We have different hobbies, but we are good friends.",
    "transferCN": "我们有不同的爱好，但我们是好朋友。",
    "write": "说出你和朋友的一个不同点，用 but 连接。",
    "starter": "I like ___, but my friend likes ___.",
    "reference": "I like meat, but my friend likes vegetables.",
    "ex": [
      {
        "type": "choice",
        "prompt": "The bag is old, ___ it is still useful.",
        "cn": "书包旧了，但是仍然有用。",
        "options": [
          "and",
          "because",
          "but"
        ],
        "answer": 2,
        "why": "old 与 still useful 形成转折，用 but。useful：有用的。"
      },
      {
        "type": "choice",
        "prompt": "选择表达“外面很冷，但汤姆仍想出去”的句子。",
        "cn": "根据题意选择一个最合适的答案。",
        "options": [
          "It is cold because Tom wants to go out.",
          "It is cold, but Tom still wants to go out.",
          "It is cold but Tom still want to go out."
        ],
        "answer": 1,
        "why": "句意为转折，且单数 Tom 后用 wants。"
      },
      {
        "type": "choice",
        "prompt": "你画画还不熟练，但很喜欢画画。哪句符合你的意思？",
        "cn": "根据题意选择一个最合适的答案。",
        "options": [
          "I am not good at drawing, but I enjoy it.",
          "I am not good at drawing because I enjoy it.",
          "I enjoy drawing because I don’t like it."
        ],
        "answer": 0,
        "why": "“不擅长”与“仍喜欢”形成转折。be good at：擅长。"
      },
      {
        "type": "fill",
        "prompt": "The box is small, ___ it is heavy.",
        "cn": "这个箱子小，但是很重。",
        "answer": [
          "but"
        ],
        "why": "这里强调与预期不同的情况，用 but。"
      },
      {
        "type": "fill",
        "prompt": "Nina is tired, ___ she still helps her mum.",
        "cn": "妮娜累了，但仍帮助妈妈。",
        "answer": [
          "but"
        ],
        "why": "虽然累，仍帮忙，表示转折。"
      },
      {
        "type": "order",
        "cn": "这只猫很小，但是跑得很快。",
        "tokens": [
          "The cat is small,",
          "but",
          "it runs",
          "very fast."
        ],
        "answer": [
          "The cat is small, but it runs very fast."
        ],
        "why": "用 but 连接“小”与“跑得快”的对比。"
      }
    ]
  },
  {
    "id": "03",
    "name": "because · 说清原因",
    "short": "… because …",
    "meaning": "原因：……因为……",
    "formula": [
      "要解释的情况",
      "because",
      "原因"
    ],
    "rule": "because 后面接原因。先问自己“为什么”，再找到解释这件事的内容。",
    "source": "课本 p31 · 原文",
    "quote": "But we are friends because we are happy together.",
    "translation": "但我们是朋友，因为我们在一起很快乐。",
    "highlight": "because",
    "tip": "原因也可以放在句首：Because we are happy together, we are friends. 本组表达一组因果关系时，because 和 so 不同时使用。",
    "transfer": "I like my friend because she helps me.",
    "transferCN": "我喜欢我的朋友，因为她帮助我。",
    "write": "用一件具体的事，说明你为什么喜欢这位朋友。",
    "starter": "I like my friend because ___.",
    "reference": "I like my friend because she listens to me.",
    "ex": [
      {
        "type": "choice",
        "prompt": "Ben takes an umbrella ___ it is raining.",
        "cn": "本带伞，因为下雨了。",
        "options": [
          "but",
          "because",
          "and"
        ],
        "answer": 1,
        "why": "下雨解释带伞的原因。umbrella：伞。"
      },
      {
        "type": "choice",
        "prompt": "选择正确表达“艾米开心，因为今天是她的生日”的句子。",
        "cn": "根据题意选择一个最合适的答案。",
        "options": [
          "Amy is happy because today is her birthday.",
          "Because today is her birthday, so Amy is happy.",
          "Amy is happy because her birthday."
        ],
        "answer": 0,
        "why": "because 后接完整原因；本题一组因果不同时用 because 和 so。"
      },
      {
        "type": "choice",
        "prompt": "Why does Jack drink some water?",
        "cn": "杰克很渴。请选择说明原因的回答。",
        "options": [
          "He is Jack.",
          "He drinks water every day.",
          "Because he is thirsty."
        ],
        "answer": 2,
        "why": "Why 问原因，用 Because he is thirsty.；thirsty：口渴的。"
      },
      {
        "type": "fill",
        "prompt": "I close the window ___ it is cold.",
        "cn": "我关窗，因为天冷。",
        "answer": [
          "because"
        ],
        "why": "天冷是关窗的原因。"
      },
      {
        "type": "fill",
        "prompt": "Mia stays in bed ___ she is ill.",
        "cn": "米娅卧床休息，因为她生病了。",
        "answer": [
          "because"
        ],
        "why": "生病是卧床休息的原因。ill：生病的。"
      },
      {
        "type": "order",
        "cn": "我们待在室内，因为外面很热。",
        "tokens": [
          "We stay inside",
          "because",
          "it is hot",
          "outside."
        ],
        "answer": [
          "We stay inside because it is hot outside."
        ],
        "why": "because 后说明待在室内的原因。inside：在室内。"
      }
    ]
  },
  {
    "id": "04",
    "name": "want to · 表达想法",
    "short": "want to do",
    "meaning": "想要做某事",
    "formula": [
      "主语",
      "want / wants to",
      "动词原形＋其他"
    ],
    "rule": "want to 后面的动作保持原形。一般现在时中，主语是 he、she 或单个人名时，用 wants to。",
    "source": "课本 p32 · 原文",
    "quote": "I want to go out and try something new.",
    "translation": "我想出去尝试新事物。",
    "highlight": "want to",
    "tip": "I want to play. → She wants to play. 只改变 want，to 后面的 play 保持原形。",
    "transfer": "She wants to play with her friends.",
    "transferCN": "她想和她的朋友们一起玩。",
    "write": "写出你想和朋友一起做的一件事。",
    "starter": "I want to ___ with my friend.",
    "reference": "I want to read books with my friend.",
    "ex": [
      {
        "type": "choice",
        "prompt": "Lucy wants ___ a cake for her mum.",
        "cn": "露西想给妈妈做蛋糕。",
        "options": [
          "make",
          "to make",
          "making"
        ],
        "answer": 1,
        "why": "want to 后接动词原形：wants to make。"
      },
      {
        "type": "choice",
        "prompt": "选出没有语法错误的句子。",
        "cn": "根据题意选择一个最合适的答案。",
        "options": [
          "Peter want to ride a bike.",
          "Peter wants riding a bike.",
          "Peter wants to ride a bike."
        ],
        "answer": 2,
        "why": "Peter 是单数主语，用 wants；to 后用 ride。"
      },

const KEY='english-u3-sentences-v2';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm=s=>String(s??'').normalize('NFKC').toLowerCase().replace(/[’‘]/g,"'").replace(/[.,!?;:，。！？；：]/g,' ').replace(/\s+/g,' ').trim();
const qid=(g,i)=>`${g.id}-${i}`;
const allQuestions=()=>LESSONS.flatMap(g=>g.ex.map((q,i)=>({g,q,i,id:qid(g,i)})));
function grade(q,draft){
 if(q.type==='choice'){const n=draft?.choice;if(!Number.isInteger(n)||n<0||n>=q.options.length)return {empty:true,message:'先选择一个答案。'};return {correct:n===q.answer,text:q.options[n]};}
 if(q.type==='order'){
  const ids=draft?.order||[];
  if(ids.length!==q.tokens.length||new Set(ids).size!==ids.length||ids.some(i=>!Number.isInteger(i)||i<0||i>=q.tokens.length))return {empty:true,message:'把所有词块放入句子后，再检查。'};
  const text=ids.map(i=>q.tokens[i]).join(' ');
  return {correct:q.answer.some(a=>norm(a)===norm(text)),text};
 }
 const text=String(draft?.value??'').trim();
 if(!text)return {empty:true,message:'先在空格里写出答案。'};
 return {correct:q.answer.some(a=>norm(a)===norm(text)),text};
}
const signature=d=>JSON.stringify(d||{});
let state={drafts:{},results:{},mistakes:{},history:[],writing:{},positions:{}};
let active='all',view='learn',reviewMessage='';
let storageFailed=false;
const byId=id=>document.getElementById(id);
function save(){try{localStorage.setItem(KEY,JSON.stringify(state));storageFailed=false;}catch{storageFailed=true;}if(typeof document!=='undefined'){const e=byId('save-error');if(e){e.hidden=!storageFailed;e.textContent='当前浏览器无法保存进度，请用“导出作答”保留本次内容。';}}}
function loadState(){try{const s=JSON.parse(localStorage.getItem(KEY)||'null');if(s&&typeof s==='object'){for(const k of ['drafts','results','mistakes','writing','positions'])if(s[k]&&typeof s[k]==='object'&&!Array.isArray(s[k]))state[k]=s[k];if(Array.isArray(s.history))state.history=s.history;}}catch{storageFailed=true;}}
function lesson(){return LESSONS.find(g=>g.id===active);}
function currentIndex(){return Math.max(0,Math.min((lesson()?.ex.length||1)-1,Number(state.positions[active])||0));}
function wrongEntries(){return allQuestions().filter(e=>state.mistakes[e.id]);}
function doneCount(g){return g.ex.filter((q,i)=>state.results[qid(g,i)]?.correct&&state.results[qid(g,i)]?.signature===signature(state.drafts[qid(g,i)])).length;}
function highlight(text,target){const i=text.indexOf(target);return i<0?esc(text):esc(text.slice(0,i))+'<mark>'+esc(target)+'</mark>'+esc(text.slice(i+target.length));}
function change(id,nextView='learn',index){active=LESSONS.some(g=>g.id===id)?id:'all';view=['learn','practice','review'].includes(nextView)?nextView:'learn';reviewMessage='';if(index!==undefined)state.positions[active]=index;save();const u=new URL(location.href);if(active==='all'){u.searchParams.delete('pattern');u.searchParams.delete('view');}else{u.searchParams.set('pattern',active);if(view==='learn')u.searchParams.delete('view');else u.searchParams.set('view',view);}history.replaceState(null,'',u);render();}
function render(){
 const g=lesson();byId('lesson-select').value=active;
 byId('title').textContent=g?g.name:'第三单元重点句型';byId('subtitle').textContent=g?g.meaning:'9组句型 · 教材讲解 · 54道自编练习';byId('number').textContent=g?g.id:'09';
 byId('tabs').hidden=!g;byId('overview').hidden=!g;
 byId('wrong-count').textContent=wrongEntries().length;
 document.querySelectorAll('[data-view]').forEach(b=>{b.setAttribute('aria-selected',String(b.dataset.view===view));b.tabIndex=b.dataset.view===view?0:-1;});
 const main=byId('content');if(g){main.setAttribute('role','tabpanel');main.setAttribute('aria-labelledby','tab-'+view);}else{main.removeAttribute('role');main.removeAttribute('aria-labelledby');}
 main.innerHTML=!g?overview():view==='learn'?learn(g):view==='review'?review():practice(g);
 if(storageFailed){byId('save-error').hidden=false;byId('save-error').textContent='当前浏览器无法保存进度，请用“导出作答”保留本次内容。';}
}
function overview(){return `<section class="sheet overview" aria-label="九组句型总览"><div class="overview-head"><span>句型与用法</span><span>每组6道练习＋1句仿写</span></div>${LESSONS.map(g=>`<article class="overview-row"><span class="idx">${g.id}</span><div><strong lang="en">${esc(g.short)}</strong><p>${esc(g.meaning)}</p></div><div class="example" lang="en">${highlight(g.transfer,g.highlight)}</div><button data-open="${g.id}" aria-label="学习第${g.id}组 ${esc(g.short)}">学习 →</button></article>`).join('')}</section><p class="overview-note">先练 and / but / because，再练 want、ask、enjoy，最后比较 make 的两种用法和 Let’s。共27道选择题、18道填空、9道排句，练习全部为自编新句。讲解页保留教材原文。</p>`;}
function learn(g){const next=LESSONS[LESSONS.indexOf(g)+1];return `<section class="sheet"><p class="eyebrow">${g.id} / 09 · ${doneCount(g)} / ${g.ex.length} 题已答对</p><div class="formula" aria-label="句型结构">${g.formula.map((p,i)=>(i?'<span class="plus" aria-hidden="true">＋</span>':'')+`<span class="part">${esc(p)}</span>`).join('')}</div><p class="rule">${esc(g.rule)}</p><blockquote class="quote"><p class="source">${esc(g.source)}</p><p class="en" lang="en">${highlight(g.quote,g.highlight)}</p><p class="translation">${esc(g.translation)}</p>${g.sourceNote?`<p class="note">${esc(g.sourceNote)}</p>`:''}</blockquote><p class="note">${esc(g.tip)}</p><div class="transfer"><p class="source">迁移示例</p><p class="en" lang="en">${esc(g.transfer)}</p><p class="translation">${esc(g.transferCN)}</p></div><div class="actions"><button class="btn" data-action="start">练这一组 →</button><button class="text" data-speak="${esc(g.sourceNote?g.transfer:g.quote)}">朗读例句</button>${next?`<button class="text spacer" data-open="${next.id}">下一组 →</button>`:'<button class="text spacer" data-open="all">回到总览 →</button>'}</div><p class="status" id="speech-status" role="status"></p></section>`;}
function practice(g){const i=currentIndex(),q=g.ex[i],id=qid(g,i),draft=state.drafts[id]||{},r=state.results[id],same=r&&r.signature===signature(draft);return `<section class="sheet"><div class="qhead"><span>${q.type==='order'?'词块排句':q.type==='choice'?'情境选择':'句型填空'} · ${i+1} / ${g.ex.length}</span><span>${doneCount(g)} / ${g.ex.length} 题已答对 · 自编练习</span></div><p class="qcn">${esc(q.cn)}</p>${q.type==='choice'?`<p class="question" lang="en">${esc(q.prompt)}</p><form id="answer-form"><fieldset style="border:0;padding:0;margin:0"><legend class="sr-only">选择一个答案</legend>${q.options.map((o,n)=>`<label class="answer-option"><input type="radio" name="choice" value="${n}" ${draft.choice===n?'checked':''}><span>${esc(o)}</span></label>`).join('')}</fieldset><div class="actions"><button class="btn" type="submit">检查答案</button></div></form>`:q.type==='fill'?`<p class="question" lang="en">${esc(q.prompt)}</p><form id="answer-form"><label class="input-label" for="answer-input">填写空缺的单词</label><input id="answer-input" class="answer-input" lang="en" value="${esc(draft.value)}" autocomplete="off" autocapitalize="off" spellcheck="false" aria-describedby="feedback"><div class="actions"><button class="btn" type="submit">检查答案</button></div></form>`:`<div class="picked" aria-label="已组成的句子">${draft.order?.length?`<div class="tiles">${draft.order.map((n,j)=>`<button class="tile" data-remove="${j}" title="点击撤回这个词块" aria-label="撤回 ${esc(q.tokens[n])}">${esc(q.tokens[n])}</button>`).join('')}</div>`:'<p class="placeholder">依次点击下方词块，把它们排成一句话。</p>'}</div><div class="tiles" aria-label="可选词块">${q.tokens.map((t,n)=>({t,n})).reverse().map(({t,n})=>`<button class="tile" data-token="${n}" ${(draft.order||[]).includes(n)?'disabled':''}>${esc(t)}</button>`).join('')}</div><div class="actions"><button class="btn" data-action="check">检查答案</button><button class="text" data-action="clear-order">重新排列</button></div>`}<div id="feedback" role="status" aria-live="polite">${same?feedback(q,r):reviewMessage?`<p class="note">${esc(reviewMessage)}</p>`:''}</div><div class="qnav"><button class="btn secondary" data-step="-1" ${i===0?'disabled':''}>上一题</button><div class="steps" aria-label="选择题目">${g.ex.map((x,n)=>{const v=state.results[qid(g,n)],valid=v?.signature===signature(state.drafts[qid(g,n)]);return `<button data-index="${n}" aria-label="第${n+1}题" ${n===i?'aria-current="step"':''} class="${n===i?'active ':''}${valid?(v.correct?'correct':'wrong'):''}">${n+1}</button>`;}).join('')}</div><button class="btn secondary" data-step="1" ${i===g.ex.length-1?'disabled':''}>下一题</button></div><div class="freewrite"><p>${esc(g.write)}</p><p class="en" lang="en">${esc(g.starter)}</p><label class="sr-only" for="writing">这一组的自主仿写</label><textarea id="writing" lang="en" placeholder="写一句自己的话……" spellcheck="false">${esc(state.writing[g.id])}</textarea><span class="status" id="writing-status" role="status">${state.writing[g.id]?'仿写已保存，待老师批阅。':'输入后自动保存，交给老师一起修改。'}</span><details><summary>需要时看参考表达</summary><p lang="en">${esc(g.reference)}</p><span>参考表达为自编示例；自己的句子可以不同。</span></details></div></section>`;}
function feedback(q,r){return `<div class="feedback ${r.correct?'':'bad'}"><strong>${r.correct?'✓ 这一题答对了。':'再想一想，检查句型。'}</strong><p>${esc(q.why)}</p>${!r.correct?`<p>参考答案：<span lang="en">${esc(q.type==='choice'?q.options[q.answer]:q.answer[0])}</span></p>`:''}</div>`;}
function review(){const entries=wrongEntries();return entries.length?`<div class="review-list">${entries.map(({g,q,i,id})=>`<article class="review-row"><div><small>第${g.id}组 · ${esc(g.short)}</small><p>${esc(q.type==='fill'?q.prompt:q.cn)}</p><small>上次提交：${esc(state.results[id]?.text||'')}</small></div><button class="btn secondary" data-review="${g.id}:${i}">再做一次</button></article>`).join('')}</div><p class="note">这里汇总各组尚未订正的错题，重新答对后移出；作答历史保留在导出记录中。</p>`:`<section class="sheet empty"><p>目前没有待订正的错题。</p><button class="btn secondary" data-action="start">去练这一组 →</button></section>`;}
function check(){const g=lesson(),i=currentIndex(),q=g.ex[i],id=qid(g,i),draft=state.drafts[id]||{},result=grade(q,draft);if(result.empty){reviewMessage=result.message;byId('feedback').innerHTML=`<p class="note">${esc(result.message)}</p>`;return;}const record={...result,signature:signature(draft),at:new Date().toISOString()};state.results[id]=record;if(result.correct)delete state.mistakes[id];else state.mistakes[id]=true;state.history.push({id,...record});reviewMessage='';save();render();}
function speak(text){const e=byId('speech-status');if(!('speechSynthesis' in window)){e.textContent='当前设备暂不支持朗读。';return;}try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='en-GB';u.rate=.82;u.onerror=()=>{if(byId('speech-status'))byId('speech-status').textContent='朗读暂时不可用，可以先读文字。';};speechSynthesis.speak(u);}catch{e.textContent='朗读暂时不可用，可以先读文字。';}}
function exportAnswers(){let lines=['第三单元 Happy together · 句型练习',new Date().toLocaleString('zh-CN')];for(const g of LESSONS){lines.push('',`${g.id} ${g.short}｜${g.meaning}`);g.ex.forEach((q,i)=>{const id=qid(g,i),d=state.drafts[id],v=state.results[id],current=v&&v.signature===signature(d);lines.push(`${i+1}. ${q.prompt||q.cn}`,`当前作答：${q.type==='order'?(d?.order||[]).map(n=>q.tokens[n]).join(' '):q.type==='choice'?(q.options[d?.choice]||'未作答'):d?.value||'未作答'}`,`结果：${current?(v.correct?'答对':'待订正'):'尚未检查'}`);});lines.push(`仿写（待老师批阅）：${state.writing[g.id]||'未填写'}`);}lines.push('','完整检查记录');state.history.forEach(h=>lines.push(`${h.at} | ${h.id} | ${h.text} | ${h.correct?'答对':'答错'}`));const blob=new Blob(['\ufeff'+lines.join('\n')],{type:'text/plain;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='Unit3-sentence-practice.txt';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}
function init(){loadState();if(!Object.keys(state.writing).length){try{const old=JSON.parse(localStorage.getItem('english-u3-sentences-v1')||'null');if(old?.writing)state.writing=old.writing;}catch{}}document.addEventListener('change',e=>{if(e.target.name==='choice'){state.drafts[qid(lesson(),currentIndex())]={choice:Number(e.target.value)};byId('feedback').innerHTML='';save();}});byId('lesson-select').innerHTML='<option value="all">全部9组句型 · 总览</option>'+LESSONS.map(g=>`<option value="${g.id}">${g.id} · ${esc(g.name)}</option>`).join('');const fromURL=()=>{const u=new URL(location.href),id=u.searchParams.get('pattern');active=LESSONS.some(g=>g.id===id)?id:'all';view=['learn','practice','review'].includes(u.searchParams.get('view'))?u.searchParams.get('view'):'learn';render();};fromURL();window.addEventListener('popstate',fromURL);byId('lesson-select').addEventListener('change',e=>change(e.target.value));byId('overview').addEventListener('click',()=>change('all'));byId('export').addEventListener('click',exportAnswers);byId('content').addEventListener('submit',e=>{if(e.target.id==='answer-form'){e.preventDefault();check();}});document.addEventListener('input',e=>{if(e.target.id==='answer-input'){state.drafts[qid(lesson(),currentIndex())]={value:e.target.value};reviewMessage='';byId('feedback').innerHTML='';save();}if(e.target.id==='writing'){state.writing[active]=e.target.value;save();byId('writing-status').textContent=storageFailed?'暂未保存，请导出作答。':'仿写已保存，待老师批阅。';}});document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b||b.disabled)return;if(b.dataset.open){change(b.dataset.open);return;}if(b.dataset.view){change(active,b.dataset.view);return;}if(b.dataset.speak){speak(b.dataset.speak);return;}if(b.dataset.review){const [g,i]=b.dataset.review.split(':');change(g,'practice',Number(i));return;}const g=lesson();if(!g)return;if(b.dataset.action==='start'){change(active,'practice');return;}if(b.dataset.action==='check'){check();return;}if(b.dataset.step||b.dataset.index!==undefined){state.positions[active]=b.dataset.index!==undefined?Number(b.dataset.index):Math.max(0,Math.min(g.ex.length-1,currentIndex()+Number(b.dataset.step)));reviewMessage='';save();render();return;}const id=qid(g,currentIndex());if(b.dataset.token!==undefined){const d=state.drafts[id]||{order:[]};d.order=d.order||[];const n=Number(b.dataset.token);if(!d.order.includes(n))d.order.push(n);state.drafts[id]=d;reviewMessage='';save();render();}if(b.dataset.remove!==undefined){state.drafts[id].order.splice(Number(b.dataset.remove),1);reviewMessage='';save();render();}if(b.dataset.action==='clear-order'){state.drafts[id]={order:[]};reviewMessage='';save();render();}});byId('tabs').addEventListener('keydown',e=>{if(!['ArrowLeft','ArrowRight','Home','End'].includes(e.key))return;const items=['learn','practice','review'];let n=items.indexOf(view);n=e.key==='Home'?0:e.key==='End'?2:(n+(e.key==='ArrowRight'?1:2))%3;e.preventDefault();change(active,items[n]);byId('tab-'+items[n]).focus();});}
if(typeof document!=='undefined')init();
</script></body></html>
