function setView(view){stopSpeech();state.view=view;state.summary=false;if(view==='review'){state.reviewOrder=EX.filter(q=>state.mistakes[q.id]).map(q=>q.id);state.reviewIndex=0}save();render()}
function render(){updateHeader();if(state.view==='learn')renderLearn();else if(state.summary)renderSummary();else renderPractice()}
function renderLearn(){const p=PHRASES[state.learnIndex],idx=state.learnIndex;state.seen=Array.from(new Set([...state.seen,p.id]));save();$('#content').innerHTML=`<div class="study-grid"><nav class="phrase-nav" aria-label="选择词组">${PHRASES.map((x,i)=>`<button data-phrase="${i}" class="${i===idx?'active':''}" ${i===idx?'aria-current="step"':''}><span class="idx">${String(i+1).padStart(2,'0')}</span><span lang="en">${e(x.phrase)}</span>${state.seen.includes(x.id)?'<span class="visited" aria-label="已看过">·</span>':''}</button>`).join('')}</nav><article class="sheet study-sheet"><div class="sheet-meta"><span>${String(idx+1).padStart(2,'0')} / ${String(PHRASES.length).padStart(2,'0')}</span><button class="sound" id="speak-phrase">${icon}听词组</button></div><div class="phrase-display" lang="en">${p.parts.map((part,i)=>`<span class="chunk-${i}">${e(part.en)}</span>`).join(' ')}</div><p class="phrase-cn">${e(p.cn)}</p><div class="structure" style="--parts:${p.parts.length}">${p.parts.map((part,i)=>`<div><small>${e(part.label)}</small><strong class="chunk-${i}" lang="en">${e(part.en)}</strong><p>${e(part.meaning)}</p></div>`).join('')}</div><p class="tip">${e(p.tip)}</p><div class="source"><small>${e(p.source)}</small><p lang="en">${highlight(p.sentence,p.focus)}</p>${p.translation?'<p class="translation">'+e(p.translation)+'</p>':''}</div><div class="bottom-nav"><button id="learn-prev" ${idx===0?'disabled':''}>← 上一个</button><span class="center">${e(group.title)}</span><button id="learn-next" ${idx===PHRASES.length-1?'class="primary"':''}>${idx===PHRASES.length-1?'练习这一类 →':'下一个 →'}</button></div></article></div>`;document.querySelectorAll('[data-phrase]').forEach(b=>b.onclick=()=>{stopSpeech();state.learnIndex=+b.dataset.phrase;render()});$('#speak-phrase').onclick=()=>speak(p.phrase);$('#learn-prev').onclick=()=>{stopSpeech();state.learnIndex--;render()};$('#learn-next').onclick=()=>{stopSpeech();if(idx===PHRASES.length-1){state.practiceIndex=0;setView('practice')}else{state.learnIndex++;render()}}}
function currentQueue(){return state.view==='review'?state.reviewOrder.map(id=>EX.find(q=>q.id===id)).filter(Boolean):EX}
function getAnswer(ex){const a=state.answers[ex.id];if(a){if(ex.type==='split'&&!a.parts&&a.verb)return{...a,parts:[a.verb,a.object]};return a}return{parts:Array(ex.phrase.parts.length).fill(''),fill:'',tokens:[]}}
function reference(ex){return ex.type==='split'?ex.phrase.parts.map(x=>x.en).join(' ＋ '):ex.type==='fill'?ex.phrase.phrase:ex.phrase.build}
function resultText(ex,r){if(r.manual)return'老师已确认这一写法。';if(ex.type==='split')return r.ok?'每一部分都找对了。':'对照拆分，再看清每个部分的作用。';if(ex.type==='fill')return r.ok?'表达正确，再把整个词组读一遍。':`本页词组里填写 ${ex.phrase.answer}。`;return r.ok?'句子顺序正确，再找出目标词组。':'暂未匹配参考顺序。对照后重排；其他通顺写法请老师确认。'}
function feedbackHTML(ex){const r=state.results[ex.id];if(!r)return'';return `<div class="feedback ${r.ok?'ok':''}" role="status"><strong>${r.ok?'✓ 正确':'再看一看'}</strong>　${e(resultText(ex,r))}<span class="reference" lang="en">${e(reference(ex))}</span><p>${e(ex.phrase.tip)}</p>${!r.ok&&ex.type==='build'?'<button class="teacher-approve" id="teacher-approve">老师确认当前句子正确</button>':''}</div>`}
function renderPractice(){const queue=currentQueue();if(!queue.length){$('#content').innerHTML='<section class="sheet empty-review"><h2>这一类暂无待订正的题。</h2><p>做错的题会留在这里，改对后移出。其他结构的错题分别记录。</p><button class="primary" id="empty-practice">练习这一类 →</button></section>';$('#empty-practice').onclick=()=>setView('practice');return}let index=state.view==='review'?state.reviewIndex:state.practiceIndex;if(index<0||index>=queue.length){if(state.view==='review')state.reviewIndex=0;else state.practiceIndex=0;index=0}const ex=queue[index],p=ex.phrase,a=getAnswer(ex),r=state.results[ex.id],size=PHRASES.length,stage=Math.floor(ex.index/size);let body='';if(ex.type==='split'){body=`<p class="large-en" lang="en">${e(p.phrase)}</p>${p.parts.map((part,i)=>`<div class="role-row"><span class="role-label">${e(part.label)}</span><div class="choices" role="group" aria-label="选择第${i+1}部分：${e(part.label)}">${shuffled(part.options,ex.index+i*7+1).map(x=>`<button class="choice ${a.parts?.[i]===x?'selected':''}" data-part="${i}" data-value="${e(x)}" aria-pressed="${a.parts?.[i]===x}" lang="en">${e(x)}</button>`).join('')}</div></div>`).join('')}`}else if(ex.type==='fill'){body=`<p class="large-en cloze-line" lang="en">${e(p.cloze).replace('___','<span class="gap">___</span>')}</p><label class="inline-label" for="fill-answer">${e(p.fillNote||'补全本页学习的词组。')}</label><input type="text" class="answer-input" id="fill-answer" spellcheck="false" autocomplete="off" autocapitalize="off" aria-invalid="${r&&!r.ok?'true':'false'}" value="${e(a.fill)}" placeholder="在这里写英文" lang="en">`}else{const chosen=a.tokens||[];body=`<div class="token-answer ${chosen.length?'':'empty'}" role="group" aria-label="已经排好的单词">${chosen.map((i,j)=>`<button class="word" data-remove="${j}" title="移回下面" lang="en">${e(p.buildTokens[i])}</button>`).join('')}</div><div class="word-bank" role="group" aria-label="待排序的单词">${bankOrder(ex).map(i=>`<button class="word bank-word" data-add="${i}" ${chosen.includes(i)?'disabled':''} lang="en">${e(p.buildTokens[i])}</button>`).join('')}</div><div class="quiet-row"><span class="prompt" style="margin:0">点已选单词可以放回；句末标点由系统补充。</span><button class="text" id="clear-words">清空重排</button></div>`}
const prompt=ex.type==='split'?'选出词组中完整的各个部分。':ex.type==='fill'?'把这个词组补完整。':'把单词排成一句话。';$('#content').innerHTML=`<div class="practice-shell"><div class="practice-toolbar">${state.view==='review'?'<span>本类错题回顾</span>':`<div class="stages">${['拆结构','补词组','组成句子'].map((x,i)=>`<button data-stage="${i}" class="${stage===i?'active':''}" aria-current="${stage===i?'step':'false'}">${x}</button>`).join('')}</div>`}<span>${String(index+1).padStart(2,'0')} / ${queue.length}</span></div><div class="progress" role="progressbar" aria-label="本类练习完成进度" aria-valuemin="0" aria-valuemax="${queue.length}" aria-valuenow="${queue.filter(q=>state.results[q.id]).length}"><span style="width:${queue.filter(q=>state.results[q.id]).length/queue.length*100}%"></span></div><article class="sheet practice-sheet"><h2>${prompt}</h2><p class="prompt">${e(p.cn)}${ex.type==='build'?'　·　迁移练习':''}</p>${body}<div id="feedback-area" aria-live="polite">${feedbackHTML(ex)}</div><div class="sheet-actions"><button class="primary" id="check">${r?'重新检查':'检查答案'}</button><span class="hint" id="answer-status">${r?'修改后记得重新检查。':'先自己做，再看讲解。'}</span></div></article><nav class="page-nav" aria-label="题目导航"><button id="practice-prev" ${index===0?'disabled':''}>← 上一题</button><span class="num" id="practice-score">${queue.filter(q=>state.results[q.id]?.ok).length} 题已做对</span><button id="practice-next">${index===queue.length-1?'查看结果 →':'下一题 →'}</button></nav></div>`;
document.querySelectorAll('[data-part]').forEach(b=>b.onclick=()=>{const parts=[...(getAnswer(ex).parts||Array(p.parts.length).fill(''))];parts[+b.dataset.part]=b.dataset.value;recordEdit(ex,{...getAnswer(ex),parts});renderPractice()});document.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>{recordEdit(ex,{...getAnswer(ex),tokens:[...(getAnswer(ex).tokens||[]),+b.dataset.add]});renderPractice()});document.querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>{recordEdit(ex,{...getAnswer(ex),tokens:(getAnswer(ex).tokens||[]).filter((_,i)=>i!==+b.dataset.remove)});renderPractice()});if(ex.type==='fill'){$('#fill-answer').oninput=ev=>{recordEdit(ex,{...getAnswer(ex),fill:ev.target.value});$('#feedback-area').innerHTML='';$('#answer-status').textContent='已保存，写好后检查。';ev.target.setAttribute('aria-invalid','false');$('#practice-score').textContent=queue.filter(q=>state.results[q.id]?.ok).length+' 题已做对'};$('#fill-answer').onkeydown=ev=>{if(ev.key==='Enter'){ev.preventDefault();checkAnswer(ex)}}}if(ex.type==='build')$('#clear-words').onclick=()=>{recordEdit(ex,{...getAnswer(ex),tokens:[]});renderPractice()};$('#check').onclick=()=>checkAnswer(ex);$('#practice-prev').onclick=()=>move(-1);$('#practice-next').onclick=()=>move(1);document.querySelectorAll('[data-stage]').forEach(b=>b.onclick=()=>{state.practiceIndex=+b.dataset.stage*size;save();render()});if($('#teacher-approve'))$('#teacher-approve').onclick=()=>teacherApprove(ex)}
function recordEdit(ex,answer){state.answers[ex.id]=answer;delete state.results[ex.id];save()}
function checkAnswer(ex){const a=getAnswer(ex),r=grade(ex,a);if(!r.complete){toast(ex.type==='split'?'请为每一部分都作出选择。':ex.type==='fill'?'先填上缺少的词。':'请先把全部单词排好。');return}recordResult(ex,a,r.ok,false);render();$('#feedback-area').scrollIntoView({block:'nearest',behavior:'smooth'})}
function recordResult(ex,a,ok,manual){state.results[ex.id]={ok,manual,time:new Date().toISOString()};if(ok)delete state.mistakes[ex.id];else state.mistakes[ex.id]=true;state.history[ex.id]??=[];state.history[ex.id].push({answer:JSON.parse(JSON.stringify(a)),ok,manual,time:new Date().toISOString()});state.history[ex.id]=state.history[ex.id].slice(-10);save()}
function teacherApprove(ex){const a=getAnswer(ex);if(!grade(ex,a).complete){toast('先排好完整句子，再请老师检查。');return}if(confirm('请由老师确认：当前句子的语序、意思和目标词组都正确吗？\n\n'+a.tokens.map(i=>ex.phrase.buildTokens[i]).join(' '))){recordResult(ex,a,true,true);render()}}
function move(delta){const queue=currentQueue(),i=state.view==='review'?state.reviewIndex:state.practiceIndex;if(delta===1&&i===queue.length-1)state.summary=true;else if(state.view==='review')state.reviewIndex=Math.max(0,i+delta);else state.practiceIndex=Math.max(0,i+delta);save();render();$('#content').scrollIntoView({block:'start',behavior:'smooth'})}
function renderSummary(){const queue=currentQueue(),done=queue.filter(q=>state.results[q.id]).length,ok=queue.filter(q=>state.results[q.id]?.ok).length,unanswered=queue.length-done,wrong=queue.filter(q=>state.mistakes[q.id]).length,next=GROUPS[GROUPS.indexOf(group)+1];$('#content').innerHTML=`<div class="practice-shell"><section class="sheet summary"><h2>${unanswered?'这一类还有练习未完成。':wrong?'把没做熟的再练一遍。':'这一类，练好了。'}</h2><div class="big">${ok}<small> / ${queue.length}</small></div><p>${unanswered?`${unanswered}题尚未提交。`:`本轮${done}题已提交。`}${wrong?` 还有${wrong}题需要订正。`:''}</p><div class="row">${unanswered?'<button class="primary" id="continue">继续未完成的题</button>':''}${Object.keys(state.mistakes).length?'<button class="primary" id="review-again">订正错题</button>':''}<button id="back-learn">回看本类词组</button>${next?'<button id="next-group">下一类结构 →</button>':''}<button class="text" id="restart">重练这一类</button></div></section></div>`;if($('#continue'))$('#continue').onclick=()=>{const pos=queue.findIndex(q=>!state.results[q.id]);if(state.view==='review')state.reviewIndex=pos;else state.practiceIndex=pos;state.summary=false;save();render()};if($('#review-again'))$('#review-again').onclick=()=>setView('review');$('#back-learn').onclick=()=>setView('learn');if($('#next-group'))$('#next-group').onclick=()=>changeGroup(next.id);$('#restart').onclick=()=>{if(!confirm('重新开始这一类的练习？仅清除这一类的当前作答、判分和错题，其他结构的进度会保留。'))return;state.answers={};state.results={};state.mistakes={};state.history={};state.practiceIndex=0;setView('practice')}}
function download(name,text,type){const url=URL.createObjectURL(new Blob([text],{type}));const a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),3000)}
function answerText(ex,a){return ex.type==='split'?(a.parts||[a.verb,a.object]).map((x,i)=>ex.phrase.parts[i].label+'：'+(x||'未选')).join('；'):ex.type==='fill'?a.fill||'未填':(a.tokens||[]).map(i=>ex.phrase.buildTokens[i]).join(' ')||'未作答'}
$('#export').onclick=()=>{save();const rows=['第三单元｜词组结构分类｜作答记录','导出时间：'+new Date().toLocaleString('zh-CN'),''];for(const g of GROUPS){const s=root.states[g.id]||blankState();rows.push('【'+g.id+' '+g.title+'】');for(const ex of exercises(g)){const a=s.answers[ex.id],r=s.results[ex.id];if(!a&&!r)continue;rows.push(ex.phrase.cn+'｜'+(ex.type==='split'?'拆结构':ex.type==='fill'?'补词组':'组成句子'),'作答：'+(a?answerText(ex,a):'未作答'),'结果：'+(r?r.ok?'正确'+(r.manual?'（老师确认）':''):'需订正':'未提交'));if(r)rows.push('参考：'+reference(ex));const history=s.history[ex.id]||[];if(history.length>1){rows.push('历次提交：');history.forEach((h,i)=>rows.push((i+1)+'. '+answerText(ex,h.answer)+'｜'+(h.ok?'正确':'需订正')))}rows.push('')}rows.push('')}download('第三单元_词组结构_全部作答.txt',rows.join('\n'),'text/plain;charset=utf-8');toast('全部结构的作答记录已导出。')};
$('#teacher').onclick=()=>{$('#teacher-title').textContent=group.title;$('#teacher-intro').textContent=group.tip+' 本类'+PHRASES.length+'项表达、'+EX.length+'题练习。';$('#teacher-table').innerHTML=PHRASES.map(p=>`<tr><td lang="en">${e(p.phrase)}</td><td><span lang="en">${e(p.parts.map(x=>x.en).join(' ＋ '))}</span><br>${e(p.tip)}</td></tr>`).join('');$('#teacher-dialog').showModal()};$('#close-teacher').onclick=()=>$('#teacher-dialog').close();document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>setView(b.dataset.view));$('.tabs').addEventListener('keydown',ev=>{if(!['ArrowLeft','ArrowRight','Home','End'].includes(ev.key))return;ev.preventDefault();const order=['learn','practice','review'],pos=order.indexOf(state.view),next=ev.key==='Home'?0:ev.key==='End'?2:(pos+(ev.key==='ArrowRight'?1:2))%3;setView(order[next]);$('#tab-'+order[next]).focus()});
$('#group-select').innerHTML=GROUPS.map(g=>`<option value="${g.id}">${g.id}　${e(g.title)}　(${g.phrases.length})</option>`).join('');$('#group-select').onchange=ev=>changeGroup(ev.target.value);render();if(!canSave)$('#save-note').textContent='当前无法自动保存，请及时导出全部作答。';

</script></body></html>
