if(!['learn','practice','review'].includes(state.view))state.view='learn';if(!Number.isInteger(state.learnIndex)||state.learnIndex<0||state.learnIndex>8)state.learnIndex=0;if(!Number.isInteger(state.practiceIndex)||state.practiceIndex<0||state.practiceIndex>26)state.practiceIndex=0;
const EX=Array.from({length:27},(_,i)=>({id:(i<9?'split-':i<18?'fill-':'build-')+PHRASES[i%9].id,index:i,type:i<9?'split':i<18?'fill':'build',phrase:PHRASES[i%9]}));
function toast(s){$('#toast').textContent=s;$('#toast').hidden=false;clearTimeout(toast.timer);toast.timer=setTimeout(()=>$('#toast').hidden=true,3300)}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state));canSave=true}catch{canSave=false}$('#save-note').textContent=canSave?'进度保存在当前浏览器；朗读使用设备语音。':'当前无法自动保存，请及时导出作答。'}
function speak(text){if(!('speechSynthesis'in window)){toast('这台设备暂不支持朗读，可以由老师带读。');return}speechSynthesis.cancel();const s=new SpeechSynthesisUtterance(text);s.lang='en-GB';s.rate=.85;const voices=speechSynthesis.getVoices(),voice=voices.find(v=>v.lang==='en-GB')||voices.find(v=>v.lang.startsWith('en'));if(voice)s.voice=voice;s.onerror=evt=>{if(!['interrupted','canceled'].includes(evt.error))toast('朗读暂不可用，可以由老师带读。')};speechSynthesis.speak(s)}
const icon='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M11 5L5 9H2v6h3l6 4zM15 8a6 6 0 010 8M18 5a10 10 0 010 14"/></svg>';
function shuffledOptions(options,seed){return options.map((v,i)=>({v,k:((seed+17)*(i+3)*7919)%997})).sort((a,b)=>a.k-b.k).map(x=>x.v)}
function bankOrder(ex){return shuffledOptions(ex.phrase.buildTokens.map((_,i)=>i),ex.index+13)}
function labelHighlight(text,focus){const i=text.indexOf(focus);if(i<0)return e(text);return e(text.slice(0,i))+'<mark>'+e(focus)+'</mark>'+e(text.slice(i+focus.length))}
function updateTabs(){document.querySelectorAll('[data-view]').forEach(b=>{const on=b.dataset.view===state.view;b.setAttribute('aria-selected',on);b.tabIndex=on?0:-1});$('#content').setAttribute('aria-labelledby','tab-'+state.view);$('#wrong-count').textContent=Object.keys(state.mistakes).filter(id=>state.mistakes[id]).length;}
function setView(view){speechSynthesisSafeCancel();state.view=view;state.summary=false;if(view==='review'){state.reviewOrder=EX.filter(q=>state.mistakes[q.id]).map(q=>q.id);state.reviewIndex=0}save();render()}
function speechSynthesisSafeCancel(){if('speechSynthesis'in window)speechSynthesis.cancel()}
function render(){updateTabs();if(state.view==='learn')renderLearn();else if(state.summary)renderSummary();else renderPractice()}
function renderLearn(){const p=PHRASES[state.learnIndex],idx=state.learnIndex;state.seen=Array.from(new Set([...state.seen,p.id]));save();$('#content').innerHTML=`<div class="study-grid"><nav class="phrase-nav" aria-label="选择词组">${PHRASES.map((x,i)=>`<button data-phrase="${i}" class="${i===idx?'active':''}" ${i===idx?'aria-current="step"':''}><span class="idx">${String(i+1).padStart(2,'0')}</span><span lang="en">${e(x.phrase)}</span>${state.seen.includes(x.id)?'<span class="visited" aria-label="已看过">·</span>':''}</button>`).join('')}</nav><article class="sheet study-sheet"><div class="sheet-meta"><span>${String(idx+1).padStart(2,'0')} / 09</span><button class="sound" id="speak-phrase">${icon}听词组</button></div><div class="phrase-display" lang="en"><span class="verb">${e(p.verb)}</span> <span class="object">${e(p.object)}</span></div><p class="phrase-cn">${p.cn}</p><div class="structure"><div><small>动词 · 做什么</small><strong class="verb" lang="en">${e(p.verb)}</strong><p>${e(p.action)}</p></div><div><small>宾语 · 谁或什么</small><strong lang="en">${e(p.object)}</strong><p>${e(p.target)}　${p.kind}</p></div></div><p class="tip">${e(p.tip)}</p><div class="source"><small>${e(p.source)}</small><p lang="en">${labelHighlight(p.sentence,p.focus)}</p><p class="translation">${e(p.translation)}</p></div><div class="bottom-nav"><button id="learn-prev" ${idx===0?'disabled':''}>← 上一个</button><span class="center">动词 ＋ 完整的对象</span><button id="learn-next" ${idx===8?'class="primary"':''}>${idx===8?'开始练习 →':'下一个 →'}</button></div></article></div>`;document.querySelectorAll('[data-phrase]').forEach(b=>b.onclick=()=>{state.learnIndex=+b.dataset.phrase;render()});$('#speak-phrase').onclick=()=>speak(p.phrase);$('#learn-prev').onclick=()=>{state.learnIndex--;render()};$('#learn-next').onclick=()=>{if(idx===8){state.practiceIndex=0;setView('practice')}else{state.learnIndex++;render()}}}
function currentQueue(){return state.view==='review'?state.reviewOrder.map(id=>EX.find(q=>q.id===id)).filter(Boolean):EX}
function currentExercise(){const queue=currentQueue();const index=state.view==='review'?state.reviewIndex:state.practiceIndex;return queue[index]}
function getAnswer(ex){return state.answers[ex.id]||{verb:'',object:'',fill:'',tokens:[]}}
function grade(ex,a){const p=ex.phrase;if(ex.type==='split'){if(!a.verb||!a.object)return {complete:false,ok:false};return {complete:true,ok:a.verb===p.verb&&a.object===p.object}}if(ex.type==='fill'){if(!n(a.fill))return {complete:false,ok:false};return {complete:true,ok:n(a.fill)===n(p.answer)}}if((a.tokens||[]).length!==p.buildTokens.length)return{complete:false,ok:false};return{complete:true,ok:n(a.tokens.map(i=>p.buildTokens[i]).join(' '))===n(p.build)}}
function reference(ex){const p=ex.phrase;return ex.type==='split'?`${p.verb} ＋ ${p.object}`:ex.type==='fill'?p.phrase:p.build}
function resultText(ex,r){if(ex.type==='split')return r.ok?'动词和完整宾语都找对了。':`动词是 ${ex.phrase.verb}，完整宾语是 ${ex.phrase.object}。`;if(ex.type==='fill')return r.ok?'词组补对了，再把整个词组读一遍。':`这里填写 ${ex.phrase.answer}。`;return r.ok?'句子顺序正确。再找出句中的目标词组。':'对照下面的句子，先找谁做动作，再检查动作和对象的顺序。'}
function feedbackHTML(ex){const r=state.results[ex.id];if(!r)return'';return `<div class="feedback ${r.ok?'ok':''}" role="status"><strong>${r.ok?'✓ 正确':'再改一改'}</strong>　${e(resultText(ex,r))}<span class="reference" lang="en">${e(reference(ex))}</span><p>${e(ex.phrase.tip)}</p></div>`}
function renderPractice(){const queue=currentQueue();if(!queue.length){$('#content').innerHTML='<section class="sheet empty-review"><h2>目前没有待订正的题。</h2><p>练习中做错的题会留在这里，改对后移出。</p><button class="primary" id="empty-practice">开始练习 →</button></section>';$('#empty-practice').onclick=()=>setView('practice');return}let index=state.view==='review'?state.reviewIndex:state.practiceIndex;if(index<0||index>=queue.length){if(state.view==='review')state.reviewIndex=0;else state.practiceIndex=0;index=0}const ex=queue[index],p=ex.phrase,a=getAnswer(ex),r=state.results[ex.id];const stage=ex.type==='split'?0:ex.type==='fill'?1:2,title=ex.type==='split'?'找出动作和完整的对象。':ex.type==='fill'?'把这个词组补完整。':'把单词排成一句话。';let body='';if(ex.type==='split'){body=`<p class="large-en" lang="en">${e(p.phrase)}</p><div class="role-row"><span class="role-label">动词 · 表示动作</span><div class="choices" role="group" aria-label="选择动词">${shuffledOptions(p.verbOptions,ex.index+1).map(x=>`<button class="choice ${a.verb===x?'selected':''}" data-role="verb" data-value="${e(x)}" aria-pressed="${a.verb===x}" lang="en">${e(x)}</button>`).join('')}</div></div><div class="role-row"><span class="role-label">宾语 · 完整的“谁或什么”</span><div class="choices" role="group" aria-label="选择完整宾语">${shuffledOptions(p.objectOptions,ex.index+9).map(x=>`<button class="choice ${a.object===x?'selected':''}" data-role="object" data-value="${e(x)}" aria-pressed="${a.object===x}" lang="en">${e(x)}</button>`).join('')}</div></div>`}else if(ex.type==='fill'){body=`<p class="large-en cloze-line" lang="en">${e(p.cloze).replace('___','<span class="gap">___</span>')}</p><label class="inline-label" for="fill-answer">${p.fillNote||'填入缺少的词，不用重复写整个词组。'}</label><input type="text" class="answer-input" id="fill-answer" spellcheck="false" autocomplete="off" autocapitalize="off" aria-invalid="${r&&!r.ok?'true':'false'}" value="${e(a.fill)}" placeholder="在这里写英文" lang="en">`}else{const chosen=a.tokens||[];body=`<div class="token-answer ${chosen.length?'':'empty'}" role="group" aria-label="已经排好的单词">${chosen.map((i,j)=>`<button class="word" data-remove="${j}" title="移回下面" lang="en">${e(p.buildTokens[i])}</button>`).join('')}</div><div class="word-bank" role="group" aria-label="待排序的单词">${bankOrder(ex).map(i=>`<button class="word bank-word" data-add="${i}" ${chosen.includes(i)?'disabled':''} lang="en">${e(p.buildTokens[i])}</button>`).join('')}</div><div class="quiet-row"><span class="prompt" style="margin:0">点已选单词可以放回；句末句号由系统补充。</span><button class="text" id="clear-words">清空重排</button></div>`}
$('#content').innerHTML=`<div class="practice-shell"><div class="practice-toolbar">${state.view==='review'?'<span>错题回顾</span>':`<div class="stages">${['拆结构','补词组','组成句子'].map((x,i)=>`<button data-stage="${i}" class="${stage===i?'active':''}" aria-current="${stage===i?'step':'false'}">${x}</button>`).join('')}</div>`}<span>${String(index+1).padStart(2,'0')} / ${queue.length}</span></div><div class="progress" role="progressbar" aria-label="练习完成进度" aria-valuemin="0" aria-valuemax="${queue.length}" aria-valuenow="${queue.filter(q=>state.results[q.id]).length}"><span style="width:${queue.filter(q=>state.results[q.id]).length/queue.length*100}%"></span></div><article class="sheet practice-sheet"><h2>${title}</h2><p class="prompt">${e(p.cn)}${ex.type==='build'?'　·　自编迁移练习':''}</p>${body}<div id="feedback-area" aria-live="polite">${feedbackHTML(ex)}</div><div class="sheet-actions"><button class="primary" id="check">${r?'重新检查':'检查答案'}</button><span class="hint" id="answer-status">${r?'修改后记得重新检查。':'先自己做，再看讲解。'}</span></div></article><nav class="page-nav" aria-label="题目导航"><button id="practice-prev" ${index===0?'disabled':''}>← 上一题</button><span class="num">${queue.filter(q=>state.results[q.id]?.ok).length} 题已做对</span><button id="practice-next">${index===queue.length-1?'查看结果 →':'下一题 →'}</button></nav></div>`;
document.querySelectorAll('[data-role]').forEach(b=>b.onclick=()=>{let val={...getAnswer(ex),[b.dataset.role]:b.dataset.value};recordEdit(ex,val);renderPractice()});document.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>{let val={...getAnswer(ex),tokens:[...(getAnswer(ex).tokens||[]),+b.dataset.add]};recordEdit(ex,val);renderPractice()});document.querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>{let val={...getAnswer(ex),tokens:(getAnswer(ex).tokens||[]).filter((_,i)=>i!==+b.dataset.remove)};recordEdit(ex,val);renderPractice()});if(ex.type==='fill'){$('#fill-answer').oninput=ev=>{recordEdit(ex,{...getAnswer(ex),fill:ev.target.value});$('#feedback-area').innerHTML='';$('#answer-status').textContent='已保存，写好后检查。';ev.target.setAttribute('aria-invalid','false')};$('#fill-answer').onkeydown=ev=>{if(ev.key==='Enter'){ev.preventDefault();checkAnswer(ex)}}}if(ex.type==='build')$('#clear-words').onclick=()=>{recordEdit(ex,{...getAnswer(ex),tokens:[]});renderPractice()};$('#check').onclick=()=>checkAnswer(ex);$('#practice-prev').onclick=()=>move(-1);$('#practice-next').onclick=()=>move(1);document.querySelectorAll('[data-stage]').forEach(b=>b.onclick=()=>{state.practiceIndex=+b.dataset.stage*9;save();render()});}
function recordEdit(ex,answer){state.answers[ex.id]=answer;delete state.results[ex.id];save()}
function checkAnswer(ex){const a=getAnswer(ex),r=grade(ex,a);if(!r.complete){toast(ex.type==='split'?'先选动词，再选完整的宾语。':ex.type==='fill'?'先填上缺少的词。':'请先把全部单词排好。');return}state.results[ex.id]={ok:r.ok,time:new Date().toISOString()};if(r.ok)delete state.mistakes[ex.id];else state.mistakes[ex.id]=true;state.history[ex.id]??=[];state.history[ex.id].push({answer:JSON.parse(JSON.stringify(a)),ok:r.ok,time:new Date().toISOString()});state.history[ex.id]=state.history[ex.id].slice(-10);save();render();$('#feedback-area').scrollIntoView({block:'nearest',behavior:'smooth'})}
function move(delta){const q=currentQueue(),i=state.view==='review'?state.reviewIndex:state.practiceIndex;if(delta===1&&i===q.length-1)state.summary=true;else if(state.view==='review')state.reviewIndex=Math.max(0,i+delta);else state.practiceIndex=Math.max(0,i+delta);save();render();$('#content').scrollIntoView({block:'start',behavior:'smooth'})}
function renderSummary(){const queue=currentQueue(),done=queue.filter(q=>state.results[q.id]).length,ok=queue.filter(q=>state.results[q.id]?.ok).length,unanswered=queue.length-done,wrong=queue.filter(q=>state.mistakes[q.id]).length;$('#content').innerHTML=`<div class="practice-shell"><section class="sheet summary"><h2>${unanswered?'还有练习等你完成。':wrong?'把没做熟的再练一遍。':'这一部分，练好了。'}</h2><div class="big">${ok}<small> / ${queue.length}</small></div><p>${unanswered?`${unanswered}题尚未提交。`:`本轮${done}题已提交。`}${wrong?` 还有${wrong}题需要订正。`:''}</p><div class="row">${unanswered?'<button class="primary" id="continue">继续未完成的题</button>':''}${Object.keys(state.mistakes).length?'<button class="primary" id="review-again">订正错题</button>':''}<button id="back-learn">回看词组</button><button class="text" id="restart">重新练习本模块</button></div></section></div>`;if($('#continue'))$('#continue').onclick=()=>{const pos=queue.findIndex(q=>!state.results[q.id]);if(state.view==='review')state.reviewIndex=pos;else state.practiceIndex=pos;state.summary=false;save();render()};if($('#review-again'))$('#review-again').onclick=()=>setView('review');$('#back-learn').onclick=()=>setView('learn');$('#restart').onclick=()=>{if(!confirm('重新开始这27题？这会清除本模块的当前作答、判分和错题。其他课程的记录会保留。'))return;state.answers={};state.results={};state.mistakes={};state.history={};state.practiceIndex=0;setView('practice')}}
function download(name,text,type){const url=URL.createObjectURL(new Blob([text],{type}));const a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),3000)}
$('#export').onclick=()=>{let rows=['第三单元｜词组结构01｜动词＋名词／代词','导出时间：'+new Date().toLocaleString('zh-CN'),''];EX.forEach((ex,i)=>{const a=getAnswer(ex),r=state.results[ex.id];let written=ex.type==='split'?`动词：${a.verb||'未选'}；宾语：${a.object||'未选'}`:ex.type==='fill'?a.fill||'未填':(a.tokens||[]).map(j=>ex.phrase.buildTokens[j]).join(' ')||'未作答';rows.push(`${i+1}. ${ex.phrase.cn}｜${ex.type==='split'?'拆结构':ex.type==='fill'?'补词组':'组成句子'}`,'作答：'+written,'结果：'+(r?r.ok?'正确':'需订正':'未提交'));if(r)rows.push('参考：'+reference(ex));rows.push('')});download('词组结构01_作答记录.txt',rows.join('\n'),'text/plain;charset=utf-8');toast('作答记录已导出。')};
$('#teacher').onclick=()=>{$('#teacher-table').innerHTML=PHRASES.map(p=>`<tr><td lang="en">${e(p.verb)}</td><td lang="en">${e(p.object)}</td><td>${e(p.tip)}</td></tr>`).join('');$('#teacher-dialog').showModal()};$('#close-teacher').onclick=()=>$('#teacher-dialog').close();document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>setView(b.dataset.view));$('.tabs').addEventListener('keydown',ev=>{if(!['ArrowLeft','ArrowRight','Home','End'].includes(ev.key))return;ev.preventDefault();const order=['learn','practice','review'],pos=order.indexOf(state.view);const next=ev.key==='Home'?0:ev.key==='End'?2:(pos+(ev.key==='ArrowRight'?1:2))%3;setView(order[next]);$('#tab-'+order[next]).focus()});
render();if(!canSave)$('#save-note').textContent='当前无法自动保存，请及时导出作答。';
</script></body></html>
