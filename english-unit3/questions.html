eewrite{margin-top:27px;padding-top:25px;border-top:1px solid var(--line)}.freewrite p{margin:0 0 10px;font-size:14px}.freewrite .en{font:18px Georgia,serif;color:var(--muted)}textarea{width:100%;min-height:104px;resize:vertical;border:1px solid var(--line);background:#fffefa;border-radius:4px;padding:14px;color:var(--ink);font-size:16px}.status{font-size:11px;color:var(--muted)}details{margin-top:16px;color:var(--muted);font-size:12px}details p{font-size:14px;color:var(--ink)}summary{cursor:pointer}.empty{text-align:center;padding:55px 20px}.empty p{color:var(--muted);font-size:14px}.review-list{display:grid;gap:12px}.review-row{border:1px solid var(--line);background:var(--paper);border-radius:5px;padding:20px;display:flex;justify-content:space-between;gap:15px;align-items:center}.review-row p{margin:0;font-size:15px}.review-row small{font-size:12px;color:var(--muted)}footer{display:flex;gap:20px;justify-content:space-between;align-items:center;font-size:11px;color:var(--muted);padding:23px 0 35px}.save-error{background:#f5e9e2;color:var(--bad);padding:10px 14px;font-size:12px}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}@media(max-width:700px){.wrap{padding:0 20px}.top{padding:22px 0;gap:15px;align-items:flex-start}.utilities{gap:10px 17px;justify-content:flex-end;font-size:11px}.hero{padding-top:30px}.number{font-size:48px}.hero p{font-size:12px}h1{font-size:29px}.switch{gap:12px}.switch select{font-size:12px;width:100%;min-width:0}.switch .text{white-space:nowrap}.sheet{padding:25px 21px}.tabs{gap:23px}.tab{font-size:12px}.part{font-size:14px;padding:9px 11px}.formula{gap:6px}.rule{font-size:14px}.quote{padding-left:16px}.quote .en{font-size:22px}.overview{padding:0 20px}.overview-row{grid-template-columns:25px 1fr 55px;gap:10px;padding:20px 0}.overview-row strong{font-size:17px}.overview-row .example{grid-column:2/4;grid-row:2;font-size:15px}.overview-row button{grid-column .answer-option{display:flex;align-items:center;gap:12px;padding:13px 16px;border:1px solid var(--line);border-radius:5px;margin-bottom:10px;cursor:pointer;font-size:16px}.answer-option:has(input:checked){background:var(--soft);border-color:var(--accent)}.answer-option input{accent-color:var(--accent);width:17px;height:17px;flex-shrink:0}.overview-row{grid-template-columns:35px 220px 1fr 70px}@media(max-width:700px){.overview-row{grid-template-columns:25px 1fr 55px}.answer-option{font-size:15px}}</style></head><body><div class="wrap"><header class="top"><div class="identity">英语 · 第三单元<span>HAPPY TOGETHER</span></div><nav class="utilities" aria-label="单元导航"><a href="index.html">返回单元</a><a href="phrase-01.html">词组结构</a><a href="sentences.html">重点句型</a></nav></header><section class="hero"><div><h1 id="title">关于朋友，怎样问与答</h1><p id="subtitle">先读懂，再写一句自己的话。</p></div><span class="number" id="number" aria-hidden="true">04</span></section><div class="switch"><label class="sr-only" for="lesson-select">切换问答</label><select id="lesson-select" aria-label="切换问答"></select><button class="text" id="overview">全部问答 ↗</button></div><nav class="tabs" role="tablist" aria-label="学习方式" id="tabs"><button class="tab" role="tab" id="tab-learn" data-view="learn" aria-selected="true" aria-controls="content">看懂问答</button><button class="tab" role="tab" id="tab-practice" data-view="practice" aria-selected="false" aria-controls="content">动手练习</button><button class="tab" role="tab" id="tab-review" data-view="review" aria-selected="false" aria-controls="content">回顾错题 <span class="badge" id="wrong-count">0</span></button></nav><main id="content" tabindex="-1"></main><p id="save-error" class="save-error" role="status" hidden></p><footer><span>进度与仿写保存在当前浏览器。朗读使用设备语音。</span><button class="text" id="export">导出作答</button></footer></div><script>const TOPICS=[
{id:'01',title:'Who · 朋友是谁',question:'Who is your best friend?',cn:'谁是你最好的朋友？',key:'Who',target:'人物',rule:'Who 问“谁”。先说朋友的名字，也可以用 He / She is… 回答。',frame:'My best friend is ___.',example:'My best friend is Lily.',translation:'我最好的朋友是莉莉。',tip:'单数问句用 is。介绍多位朋友时可以说：Who are your best friends? — Lily and Ben are my best friends.',own:'用真实的名字介绍你最好的朋友。',questions:[
{prompt:'Who is your best friend?',hint:'先看 Who，这个问题要找哪种信息？',options:['朋友的名字','朋友的特点','喜欢朋友的原因'],answer:0,why:'Who 问人物，回答朋友是谁。'},
{prompt:'Who is your best friend?',hint:'选择直接回答这个问题的一句话。',options:['She is funny.','My best friend is Lily.','We read together.'],answer:1,why:'My best friend is Lily. 直接说明朋友是谁；funny 说特点，read together 说活动。'},
{prompt:'Lily and Ben are my best friends.',hint:'这句话回答的是哪个问题？',options:['Why do you like your friends?','What do you do together?','Who are your best friends?'],answer:2,why:'答案给出两个人名，问“谁”，并用复数 are 和 friends。'}]},
{id:'02',title:'What … like · 朋友是什么样的人',question:'What is your friend like?',cn:'你的朋友是什么样的人？',key:'What is your friend like',target:'性格、特点',rule:'What is … like? 用来了解一个人是什么样的。这里练习用 funny、kind、musical 等词介绍朋友的特点。',frame:'He / She is ___.',example:'She is funny and kind.',translation:'她有趣又友善。',tip:'What is she like? 问“她是什么样的人”；What does she like? 问“她喜欢什么”。不要只看到 like 就回答爱好。',own:'用一到两个特点介绍你的朋友。',questions:[
{prompt:'What is your friend like?',hint:'这个问题希望你介绍什么？',options:['朋友喜欢的食物','朋友的性格或特点','朋友的名字'],answer:1,why:'What is … like? 询问朋友是什么样的人，本组用性格或特点回答。'},
{prompt:'What is your friend like?',hint:'选择合适的回答。',options:['She likes apples.','Her name is Lily.','She is funny and kind.'],answer:2,why:'She is funny and kind. 介绍特点；She likes apples. 回答她喜欢什么。'},
{prompt:'What does your friend like?',hint:'注意这里是 does，不是 is。选择合适的回答。',options:['She likes reading books.','She is kind.','She is my best friend.'],answer:0,why:'What does … like? 问喜欢什么，可以回答 She likes reading books.。'}]},
{id:'03',title:'What … do · 一起做什么',question:'What do you do together?',cn:'你们一起做什么？',key:'What do you do',target:'共同活动',rule:'这里的 What … do? 问做什么事。用 We＋动作回答，想介绍两个活动时，可以用 and 连接。',frame:'We ___ together.',example:'We read books and play games together.',translation:'我们一起读书、玩游戏。',tip:'We 后面说动作：We play games. 不写成 We are play games.；表示“和朋友一起”，还可以用 with my friend。',own:'写出你和朋友一起做的一到两件事。',questions:[
{prompt:'What do you do together?',hint:'这个问题要找哪种信息？',options:['一起做的活动','朋友的性格','成为朋友的原因'],answer:0,why:'问 do 什么，要回答活动，例如 read books 或 play games。'},
{prompt:'What do you do together?',hint:'选择直接回答问题的句子。',options:['We are happy.','We read books together.','She is musical.'],answer:1,why:'We read books together. 说出共同活动。happy 是状态，musical 是特点。'},
{prompt:'我们一起唱歌、跳舞。',hint:'选出正确的英语回答。',options:['We are sing and dance together.','We sings and dances together.','We sing and dance together.'],answer:2,why:'We 后直接用 sing 和 dance；一般现在时这里不加 are，也不加 s。'}]},
{id:'04',title:'Why · 为什么喜欢她',question:'Why do you like your friend?',cn:'你为什么喜欢你的朋友？',key:'Why',target:'原因',rule:'Why 问“为什么”。用 Because＋原因回答，也可以说完整的 I like my friend because…。',frame:'I like my friend because ___.',example:'I like my friend because she helps me.',translation:'我喜欢我的朋友，因为她帮助我。',tip:'原因要具体。She helps me.、She listens to me. 都能说明为什么喜欢朋友。单数主语 she 后注意 helps、listens。',own:'用朋友做过的一件事，说明你喜欢这位朋友的原因。',questions:[
{prompt:'Why do you like your friend?',hint:'Why 提醒我们找什么？',options:['名字','共同活动的时间','原因'],answer:2,why:'Why 问原因，用 because 引出解释。'},
{prompt:'Why do you like your friend?',hint:'选择直接说明原因的回答。',options:['Because she helps me.','Her name is Lily.','We play games.'],answer:0,why:'Because she helps me. 用具体的事情说明喜欢朋友的原因。'},
{prompt:'I like my friend ___ she listens to me.',hint:'我喜欢我的朋友，因为她听我说话。',options:['but','because','and'],answer:1,why:'she listens to me 解释喜欢朋友的原因，用 because。'}]}
];

const KEY='english-u3-question-answer-v1';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let state={drafts:{},results:{},writing:{},positions:{},history:[]},active='all',view='learn';
const $=id=>document.getElementById(id),topic=()=>TOPICS.find(g=>g.id===active),idFor=(g,i)=>g.id+'-'+i;
function grade(q,choice){return Number.isInteger(choice)&&choice>=0&&choice<q.options.length?{correct:choice===q.answer}:{empty:true};}
function wrong(){return TOPICS.flatMap(g=>g.questions.map((q,i)=>({g,q,i,id:idFor(g,i)}))).filter(x=>state.results[x.id]&&!state.results[x.id].correct);}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state));$('save-error').hidden=true;return true;}catch{$('save-error').hidden=false;$('save-error').textContent='浏览器暂时无法保存，请导出本次作答。';return false;}}
function pos(){return Math.min(2,Math.max(0,Number(state.positions[active])||0));}
function count(g){return g.questions.filter((q,i)=>state.results[idFor(g,i)]?.correct&&state.results[idFor(g,i)]?.choice===state.drafts[idFor(g,i)]).length;}
function open(id,v='learn',i){active=TOPICS.some(g=>g.id===id)?id:'all';view=v;if(i!==undefined)state.positions[active]=i;save();const u=new URL(location.href);if(active==='all'){u.searchParams.delete('topic');u.searchParams.delete('view');}else{u.searchParams.set('topic',active);u.searchParams.set('view',view);}history.replaceState(null,'',u);render();}
function render(){const g=topic();$('title').textContent=g?g.title:'关于朋友，怎样问与答';$('subtitle').textContent=g?g.cn:'4组问答 · 看懂问题，再说自己的答案';$('number').textContent=g?g.id:'04';$('lesson-select').value=active;$('tabs').hidden=!g;$('overview').hidden=!g;$('wrong-count').textContent=wrong().length;document.querySelectorAll('[data-view]').forEach(b=>{b.setAttribute('aria-selected',String(b.dataset.view===view));});$('content').innerHTML=!g?overview():view==='learn'?learn(g):view==='review'?review():practice(g);}
function overview(){return `<section class="sheet overview"><div class="overview-head"><span>先看问法，再找回答的信息</span><span>本页为单元主题自编练习</span></div>${TOPICS.map(g=>`<article class="overview-row"><span class="idx">${g.id}</span><div><strong>${esc(g.target)}</strong><p>${esc(g.cn)}</p></div><div class="example" lang="en">${esc(g.question)}</div><button data-open="${g.id}" aria-label="学习第${g.id}组">学习 →</button></article>`).join('')}</section><p class="overview-note">每组先读问答示例，再做3道辨认与选答练习，最后口头回答并写下来。自己的答案会自动保存，交给老师一起修改。</p>`;}
function learn(g){return `<section class="sheet"><p class="eyebrow">${g.id} / 04 · 自编问答示例</p><p class="question" lang="en">${esc(g.question)}</p><div class="formula"><span class="part">找问句线索</span><span class="plus">→</span><span class="part">${esc(g.key)}</span><span class="plus">→</span><span class="part">回答${esc(g.target)}</span></div><p class="rule">${esc(g.rule)}</p><blockquote class="quote"><p class="source">可以这样回答</p><p class="en" lang="en">${esc(g.example)}</p><p class="translation">${esc(g.translation)}</p></blockquote><p class="note">${esc(g.tip)}</p><div class="transfer"><p class="source">换成自己的内容</p><p class="en" lang="en">${esc(g.frame)}</p></div><div class="actions"><button class="btn" data-action="start">练这一组 →</button><button class="text" data-action="speak">朗读问答</button>${g.id!=='04'?`<button class="text spacer" data-open="${String(Number(g.id)+1).padStart(2,'0')}">下一组 →</button>`:'<button class="text spacer" data-open="all">回到总览 →</button>'}</div><p id="speech-status" class="status" role="status"></p></section>`;}
function practice(g){const i=pos(),q=g.questions[i],id=idFor(g,i),choice=state.drafts[id],r=state.results[id],same=r&&r.choice===choice;return `<section class="sheet"><div class="qhead"><span>辨认与选答 · ${i+1} / 3</span><span>${count(g)} / 3 题已答对</span></div><p class="qcn">${esc(q.hint)}</p><p class="question" lang="en">${esc(q.prompt)}</p><form id="answer-form"><fieldset style="border:0;padding:0;margin:0"><legend class="sr-only">选择答案</legend>${q.options.map((o,n)=>`<label class="answer-option"><input type="radio" name="answer" value="${n}" ${choice===n?'checked':''}><span>${esc(o)}</span></label>`).join('')}</fieldset><div class="actions"><button type="submit" class="btn">检查答案</button></div></form><div id="feedback" role="status" aria-live="polite">${same?`<div class="feedback ${r.correct?'':'bad'}"><strong>${r.correct?'✓ 答对了。':'再看一看问句。'}</strong><p>${esc(q.why)}</p>${!r.correct?`<p>参考答案：${esc(q.options[q.answer])}</p>`:''}</div>`:''}</div><div class="qnav"><button class="btn secondary" data-step="-1" ${i===0?'disabled':''}>上一题</button><div class="steps">${g.questions.map((x,n)=>`<button aria-label="第${n+1}题" data-index="${n}" class="${n===i?'active':''}">${n+1}</button>`).join('')}</div><button class="btn secondary" data-step="1" ${i===2?'disabled':''}>下一题</button></div><div class="freewrite"><p>${esc(g.own)} 先说一遍，再写下来。</p><p class="en" lang="en">${esc(g.question)}</p><label for="writing" class="input-label">我的回答</label><textarea id="writing" lang="en" placeholder="${esc(g.frame)}" spellcheck="false">${esc(state.writing[g.id])}</textarea><span class="status" id="writing-status" role="status">${state.writing[g.id]?'回答已保存，待老师批阅。':'输入后自动保存；自由回答由老师检查。'}</span><details><summary>需要时看回答支架</summary><p lang="en">${esc(g.frame)}</p><p>参考示例：${esc(g.example)}</p><span>可以写不同的内容，不必和示例一样。</span></details></div></section>`;}
function review(){const entries=wrong();return entries.length?`<div class="review-list">${entries.map(({g,q,i})=>`<article class="review-row"><div><small>${esc(g.title)}</small><p>${esc(q.prompt)}</p><small>${esc(q.hint)}</small></div><button class="btn secondary" data-review="${g.id}:${i}">再做一次</button></article>`).join('')}</div><p class="note">各组尚未订正的错题都在这里，重新答对后移出。</p>`:'<section class="sheet empty"><p>目前没有待订正的错题。</p><button class="btn secondary" data-action="start">去练这一组 →</button></section>';}
function check(){const g=topic(),i=pos(),q=g.questions[i],id=idFor(g,i),choice=state.drafts[id],r=grade(q,choice);if(r.empty){$('feedback').innerHTML='<p class="note">先选择一个答案，再检查。</p>';return;}const record={choice,correct:r.correct,at:new Date().toISOString()};state.results[id]=record;state.history.push({id,...record});save();render();}
function exportWork(){const lines=['第三单元 · 关于朋友的问与答',new Date().toLocaleString('zh-CN')];for(const g of TOPICS){lines.push('',g.title);g.questions.forEach((q,i)=>{const id=idFor(g,i),c=state.drafts[id],r=state.results[id];lines.push(q.prompt+' / '+q.hint,'当前选择：'+(q.options[c]||'未选择'),'结果：'+(r&&r.choice===c?(r.correct?'答对':'待订正'):'未检查'));});lines.push('自主回答（待老师批阅）：'+(state.writing[g.id]||'未填写'));}lines.push('','检查历史',...state.history.map(h=>`${h.at} | ${h.id} | 选项${h.choice+1} | ${h.correct?'答对':'答错'}`));const u=URL.createObjectURL(new Blob(['\ufeff'+lines.join('\n')],{type:'text/plain;charset=utf-8'})),a=document.createElement('a');a.href=u;a.download='Unit3-friend-questions.txt';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000);}
function init(){try{const s=JSON.parse(localStorage.getItem(KEY)||'null');if(s&&typeof s==='object'){for(const k of ['drafts','results','writing','positions'])if(s[k]&&typeof s[k]==='object')state[k]=s[k];if(Array.isArray(s.history))state.history=s.history;}}catch{}$('lesson-select').innerHTML='<option value="all">全部4组问答 · 总览</option>'+TOPICS.map(g=>`<option value="${g.id}">${g.id} · ${esc(g.title)}</option>`).join('');function fromURL(){const u=new URL(location.href);active=TOPICS.some(g=>g.id===u.searchParams.get('topic'))?u.searchParams.get('topic'):'all';view=['learn','practice','review'].includes(u.searchParams.get('view'))?u.searchParams.get('view'):'learn';render();}fromURL();window.addEventListener('popstate',fromURL);$('lesson-select').onchange=e=>open(e.target.value);$('overview').onclick=()=>open('all');$('export').onclick=exportWork;document.addEventListener('change',e=>{if(e.target.name==='answer'){state.drafts[idFor(topic(),pos())]=Number(e.target.value);save();$('feedback').innerHTML='';}});document.addEventListener('input',e=>{if(e.target.id==='writing'){state.writing[active]=e.target.value;const ok=save();$('writing-status').textContent=ok?'回答已保存，待老师批阅。':'暂未保存，请导出本次作答。';}});$('content').addEventListener('submit',e=>{e.preventDefault();check();});document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b||b.disabled)return;if(b.dataset.open){open(b.dataset.open);return;}if(b.dataset.view){open(active,b.dataset.view);return;}if(b.dataset.review){const [g,i]=b.dataset.review.split(':');open(g,'practice',Number(i));return;}if(b.dataset.step||b.dataset.index!==undefined){state.positions[active]=b.dataset.index!==undefined?Number(b.dataset.index):pos()+Number(b.dataset.step);save();render();return;}if(b.dataset.action==='start')open(active,'practice');if(b.dataset.action==='speak'){if(!('speechSynthesis'in window)){$('speech-status').textContent='当前设备暂不支持朗读。';return;}speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(topic().question+' '+topic().example);u.lang='en-GB';u.rate=.8;u.onerror=()=>{if($('speech-status'))$('speech-status').textContent='朗读暂时不可用，可以先读文字。';};speechSynthesis.speak(u);}});}
if(typeof document!=='undefined')init();
</script></body></html>
