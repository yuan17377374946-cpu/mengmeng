if(name==='boat')return svg('<path class="line" d="M55 80H555 M55 73V87 M330 73V87 M555 73V87"/><text x="152" y="53">已行？</text><text x="406" y="53">剩余？</text><text x="40" y="115">重庆</text><text x="308" y="115">游轮</text><text x="540" y="115">宜昌</text><text x="238" y="146">全程648 km</text>');
if(name==='segments')return svg('<path class="line" d="M40 40H570 M40 33V47 M160 33V47 M570 33V47 M40 102H570 M40 95V109 M440 95V109 M570 95V109 M40 164H570 M40 157V171 M430 157V171 M570 157V171"/><text x="87" y="30">15</text><text x="350" y="30">n</text><text x="282" y="65">总长？</text><text x="242" y="90">总长 n</text><text x="230" y="128">？</text><text x="492" y="128">20</text><text x="240" y="152">总长73</text><text x="215" y="193">n</text><text x="492" y="193">？</text>',210);
if(name==='tables')return svg([1,2,3].map((n,j)=>{const x=35+j*190,w=n*40;let r=`<rect x="${x}" y="55" width="${w}" height="36" rx="3" class="fill"/>`;for(let t=0;t<n;t++){r+=`<circle cx="${x+20+t*40}" cy="40" r="6" fill="#83aaa0"/><circle cx="${x+20+t*40}" cy="106" r="6" fill="#83aaa0"/>`;if(t)r+=`<path class="line" d="M${x+t*40} 55v36"/>`}return r+`<circle cx="${x-12}" cy="73" r="6" fill="#83aaa0"/><circle cx="${x+w+12}" cy="73" r="6" fill="#83aaa0"/><text x="${x+w/2-25}" y="140">${n}张 / ${2*n+2}人</text>`}).join(''));
if(name==='cubes')return svg([1,2,3].map((n,j)=>{let s='';for(let i=0;i<n;i++){let x=120+j*170,y=145-i*34;s+=`<rect class="fill" x="${x}" y="${y-34}" width="45" height="34"/>`}return s+`<text x="${120+j*170}" y="176">${n}个</text>`}).join('')+'<path d="M75 148H560" stroke="#b9aa8f" stroke-width="5"/>',195);
if(name==='dots')return '<div class="dotgroup">'+[1,2,3].map(n=>{let dots='';for(let r=0;r<n+1;r++)for(let c=0;c<n+2;c++)dots+=`<span class="dot ${c<=r?'black':''}"></span>`;return `<div><div class="dotcol" style="grid-template-columns:repeat(${n+2},auto)">${dots}</div><div class="dotcaption">第${n}组</div></div>`}).join('')+'</div>';
if(name==='polygon'){const pts=[[290,10],[375,65],[342,155],[238,155],[205,65]];return svg(`<polygon points="${pts.map(p=>p.join(',')).join(' ')}" fill="#e9f1e2" stroke="#63836b"/><path d="M290 10L342 155 M290 10L238 155" stroke="#62836a" stroke-dasharray="4"/><text x="395" y="90">五边形：从一个顶点画2条</text>`,175)}return''}
function render(){activeField=null;const list=filtered();state.view.index=Math.max(0,Math.min(state.view.index,list.length-1));currentQ=list[state.view.index];$('#categoryTitle').textContent=String(state.view.cat+1).padStart(2,'0')+' / '+CATS[state.view.cat].title;$('#categoryTip').textContent=CATS[state.view.cat].tip;$('#filters').querySelectorAll('button').forEach(b=>b.classList.toggle('active',b.dataset.filter===state.view.filter));stats();$('#jump').innerHTML=list.map((q,i)=>`<button class="${i===state.view.index?'current ':''}${submitted(q)?'done':''}" data-index="${i}" title="${esc(q.title)}" ${i===state.view.index?'aria-current="step"':''}>${i+1}</button>`).join('');if(!currentQ){$('#question').innerHTML=`<div class="empty"><h3>${state.view.filter==='wrong'?'本类暂无待订正的题':'这一类没有符合筛选条件的题'}</h3><p class="muted">${state.view.filter==='wrong'?'提交后需要订正的题会出现在这里。':'可以切换筛选，或试试其他题型。'}</p><button id="showAll">查看本类全部练习</button></div>`;$('#showAll').onclick=()=>{state.view.filter='all';render();persist()};return}const q=currentQ,values=state.responses[q.id]||[],checks=state.checks[q.id]||[],show=teacher||!!state.checks[q.id];$('#question').innerHTML=`<article class="card"><div class="card-top"><div class="tagline"><span class="tag ${q.variant?'variant':''}">${q.variant?'原创变式':'教材练习'}</span><span>${esc(q.src)}</span><span>本类 ${state.view.index+1} / ${list.length}</span></div><h3>${esc(q.title)}</h3><p class="stem">${esc(q.stem)}</p>${q.diagram?'<div class="diagram">'+diagram(q.diagram)+'</div>':''}</div><div class="qbody"><div class="prompt">01 / 写下你的答案 <span class="muted" style="font-weight:400;letter-spacing:0">　不必重复填写单位</span></div><div class="fields">${q.fields.map((f,i)=>{const c=checks[i]||{};return `<label class="field ${f.kind==='manual'?'wide':''}"><span class="label">${esc(f.label)}</span>${f.kind==='manual'?`<textarea class="answer ${c.status||''}" data-i="${i}" aria-describedby="fb${i}" placeholder="用自己的话说清楚……">${esc(values[i]||'')}</textarea>`:`<input class="answer ${c.status||''}" data-i="${i}" type="text" inputmode="text" autocomplete="off" spellcheck="false" aria-describedby="fb${i}" value="${esc(values[i]||'')}" placeholder="在这里填写">`}<span id="fb${i}" class="feedback ${c.status||''}">${esc(c.msg||'')}</span></label>`}).join('')}</div><div class="symbols"><span>点击插入</span>${['a','b','n','²','×','÷','(',')','−'].map(x=>`<button type="button" data-symbol="${x}">${x}</button>`).join('')}<span class="keyhint">也可以输入 a^2、3*a、m/10</span></div><details class="guidance"><summary>需要一点提示</summary><p>${esc(q.hint)}</p></details><div class="scratch"><div class="prompt" style="margin-top:23px">02 / 写过程，或画一画</div><label for="notes" class="muted" style="font-size:12px">可以写：已知什么 → 要求什么 → 数量关系 → 列式计算 → 检查</label><textarea id="notes" class="notes" placeholder="我先求……，因为……">${esc(state.notes[q.id]||'')}</textarea><button class="scratch-toggle" id="toggleInk">打开手写草稿板${state.ink[q.id]?.length?' · 已有笔迹':''}</button><div class="canvas-panel" id="inkPanel" hidden><div class="canvas-tools"><button id="penOn" class="pen">开启手写</button><span>可用触控笔、手指或鼠标；开启后草稿区不滚动</span><button id="undoInk">撤销一笔</button><button id="clearInk">清空草稿</button></div><canvas id="canvas" aria-label="手写草稿区，请使用触控笔、手指或鼠标绘制。也可使用上方文字过程输入框。"></canvas></div></div>${show?`<div class="review ${teacher?'teacher':''}"><h4>${teacher?'老师版 · 参考答案与讲解':'提交后的核对与订正'}</h4><ul>${q.fields.map((f,i)=>`<li>${esc(f.label)}：<strong>${esc(f.answer)}</strong></li>`).join('')}</ul><p>${esc(q.explain)}</p>${q.manual||q.fields.some(f=>f.kind==='manual')?'<p class="muted" style="margin-top:9px">本题需要老师进一步核对写法或解释。自动核对的等值结果不能替代过程批改。</p>':''}${teacher?'<div class="teacher-marks"><button class="small" data-grade="correct">老师确认：已掌握</button><button class="small" data-grade="wrong">老师确认：需再练</button><button class="small" data-grade="wait">老师确认：待讲解</button></div><p id="gradeMsg" class="muted" style="margin-top:8px">'+gradeText(q)+'</p>':''}</div>`:''}</div><div class="card-bottom"><button class="primary" id="submit">${show?'重新提交核对':'提交本题'}</button><button id="retry">保留作答，重新订正</button><div class="navright"><button id="prev" ${state.view.index===0?'disabled':''}>← 上一题</button><button id="next">${state.view.index===list.length-1?'下一类 →':'下一题 →'}</button></div><div id="submitMessage" class="message" role="status"></div></div></article>`;
bindQuestion(q);}
function gradeText(q){return state.teacherGrades[q.id]==='correct'?'老师记录：已掌握':state.teacherGrades[q.id]==='wrong'?'老师记录：需再练':state.teacherGrades[q.id]==='wait'?'老师记录：待讲解':'老师尚未记录掌握情况'}
function bindQuestion(q){document.querySelectorAll('.answer').forEach(input=>{input.onfocus=()=>activeField=input;input.oninput=()=>{const i=+input.dataset.i;state.responses[q.id]??=[];state.responses[q.id][i]=input.value;if(state.checks[q.id]?.[i]){state.checks[q.id][i]={status:'pending',msg:'已修改，记得重新提交核对。'};input.className='answer';const fb=$('#fb'+i);fb.className='feedback';fb.textContent='已修改，记得重新提交核对。'}persist();stats()}});document.querySelectorAll('[data-symbol]').forEach(b=>{b.onmousedown=e=>e.preventDefault();b.onclick=()=>{const el=activeField;if(!el){toast('先点击要填写的答案框。');return}const from=el.selectionStart??el.value.length,to=el.selectionEnd??from;el.setRangeText(b.dataset.symbol,from,to,'end');el.dispatchEvent(new Event('input'));el.focus()}});$('#notes').oninput=e=>{state.notes[q.id]=e.target.value;persist()};$('#submit').onclick=()=>submit(q);$('#retry').onclick=()=>{delete state.checks[q.id];delete state.teacherGrades[q.id];persist();render();toast('保留了你的作答，可以修改后重新提交。')};$('#prev').onclick=()=>navigate(-1);$('#next').onclick=()=>navigate(1);$('#toggleInk').onclick=()=>{const p=$('#inkPanel');p.hidden=!p.hidden;$('#toggleInk').textContent=p.hidden?'打开手写草稿板':'收起手写草稿板';if(!p.hidden)initCanvas(q)};document.querySelectorAll('[data-grade]').forEach(b=>b.onclick=()=>{state.teacherGrades[q.id]=b.dataset.grade;persist();$('#gradeMsg').textContent=gradeText(q);toast('老师批改已保存')});}
function navigate(delta){const list=filtered();if(delta>0&&state.view.index===list.length-1){if(state.view.cat<CATS.length-1){state.view.cat++;state.view.index=0}else{toast('已到最后一类，可以查看待订正或导出作答。');return}}else state.view.index+=delta;persist();render();$('#categoryTitle').scrollIntoView({behavior:'smooth',block:'start'})}
function submit(q){const v=state.responses[q.id]||[];const results=q.fields.map((f,i)=>checkValue(v[i]||'',f));state.checks[q.id]=results;state.attempts[q.id]??=[];state.attempts[q.id].push({time:new Date().toISOString(),answers:[...v],results});state.attempts[q.id]=state.attempts[q.id].slice(-15);persist();render();const blanks=results.filter(r=>r.status==='blank').length,wrongs=results.filter(r=>r.status==='wrong').length,wait=results.filter(r=>r.status==='wait').length;$('#submitMessage').textContent=blanks?`还有${blanks}空没写，可以补齐后重新提交。`:wrongs?`有${wrongs}空需要订正。看一看解析，再自己改一遍。`:wait?`已提交，${wait}空需要老师核对；手写和过程也请老师一起看。`:'这题填写的答案都核对正确了！再向老师说说你的思路。';$('#submitMessage').scrollIntoView({behavior:'smooth',block:'nearest'})}
let canvasResize=null;
function initCanvas(q){const canvas=$('#canvas'),ctx=canvas.getContext('2d');let writing=false,stroke=null,enabled=false;const strokes=state.ink[q.id]??=[];function redraw(){const dpr=window.devicePixelRatio||1;canvas.width=canvas.clientWidth*dpr;canvas.height=280*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);ctx.lineCap='round';ctx.lineJoin='round';ctx.strokeStyle='#234c43';ctx.lineWidth=2.5;for(const s of strokes){if(!s.length)continue;ctx.beginPath();ctx.moveTo(s[0][0]*canvas.clientWidth,s[0][1]*280);for(const p of s)ctx.lineTo(p[0]*canvas.clientWidth,p[1]*280);if(s.length===1)ctx.lineTo(s[0][0]*canvas.clientWidth+.5,s[0][1]*280+.5);ctx.stroke()}}function point(e){const r=canvas.getBoundingClientRect();return[Math.max(0,Math.min(1,(e.clientX-r.left)/r.width)),Math.max(0,Math.min(1,(e.clientY-r.top)/r.height))]};$('#penOn').onclick=()=>{enabled=!enabled;canvas.classList.toggle('draw-on',enabled);$('#penOn').classList.toggle('on',enabled);$('#penOn').textContent=enabled?'手写已开启':'开启手写'};canvas.onpointerdown=e=>{if(!enabled)return;e.preventDefault();canvas.setPointerCapture(e.pointerId);writing=true;stroke=[point(e)];strokes.push(stroke);redraw()};canvas.onpointermove=e=>{if(!writing)return;e.preventDefault();stroke.push(point(e));if(stroke.length>4000)stroke.splice(1,1);redraw()};function finish(){if(writing){writing=false;persist()}}canvas.onpointerup=finish;canvas.onpointercancel=finish;$('#undoInk').onclick=()=>{strokes.pop();redraw();persist()};$('#clearInk').onclick=()=>dialog('清空这一题的手写草稿？','<p>文字过程和答案会保留。</p>',[['保留'],['清空草稿',()=>{strokes.length=0;redraw();persist()},true]]);if(canvasResize)canvasResize.disconnect();canvasResize=new ResizeObserver(redraw);canvasResize.observe(canvas);redraw()}
$('#catnav').onclick=e=>{const b=e.target.closest('[data-cat]');if(!b)return;state.view.cat=+b.dataset.cat;state.view.index=0;persist();render()};$('#jump').onclick=e=>{const b=e.target.closest('[data-index]');if(b){state.view.index=+b.dataset.index;persist();render()}};$('#filters').onclick=e=>{const b=e.target.closest('[data-filter]');if(b){state.view.filter=b.dataset.filter;state.view.index=0;persist();render()}};
$('#teacherBtn').onclick=()=>dialog(teacher?'回到学生版？':'切换到老师版？','<p>老师版会直接显示每题参考答案、讲解思路和掌握情况标记。学生独立练习时，请使用学生版。</p>',[['取消'],[teacher?'回到学生版':'显示老师版',()=>{teacher=!teacher;$('#teacherBanner').hidden=!teacher;$('#teacherBtn').textContent=teacher?'回学生版':'老师版';render()},true]]);$('#backStudent').onclick=()=>{teacher=false;$('#teacherBanner').hidden=true;$('#teacherBtn').textContent='老师版';render()};
function download(name,content,type){const url=URL.createObjectURL(new Blob([content],{type}));const a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),5000)}
$('#exportBtn').onclick=()=>dialog('导出梦梦的作答','<p>备份文件包含答案、过程、手写笔迹和提交记录，换设备后可导入。文字报告方便老师查看和整理错题。</p>',[['取消'],['文字批改报告',exportReport],['导出可恢复备份',()=>{download('梦梦_字母表示数_作答备份_'+new Date().toISOString().slice(0,10)+'.json',JSON.stringify({format:'mengmeng-algebra',version:1,exportedAt:new Date().toISOString(),state},null,2),'application/json');toast('作答备份已导出')},true]]);
function exportReport(){const rows=['梦梦｜用字母表示数和数量关系｜作答报告','导出时间：'+new Date().toLocaleString('zh-CN'),'手写笔迹请使用JSON备份或网页查看。',''];CATS.forEach((cat,i)=>{rows.push('【'+cat.title+'】');QS.filter(q=>q.cat===i).forEach(q=>{const ans=state.responses[q.id]||[];if(!ans.some(Boolean)&&!state.notes[q.id]&&!state.ink[q.id]?.length)return;rows.push(q.title+'｜'+q.src,q.stem);q.fields.forEach((f,j)=>{const status=state.checks[q.id]?.[j];rows.push(f.label,'学生答案：'+(ans[j]||'未填'),'批改：'+(status?.msg||'未提交'));if(state.checks[q.id])rows.push('参考答案：'+f.answer)});rows.push('文字过程：'+(state.notes[q.id]||'未填'),'手写笔迹：'+(state.ink[q.id]?.length||0)+'笔',gradeText(q));if(state.checks[q.id])rows.push('讲解：'+q.explain);const ats=state.attempts[q.id]||[];if(ats.length){rows.push('历次提交：');ats.forEach((a,k)=>rows.push((k+1)+'. '+new Date(a.time).toLocaleString('zh-CN')+'｜'+a.answers.join('；')+'｜'+a.results.map(r=>r.msg).join('；')))}rows.push('')});rows.push('')});download('梦梦_字母表示数_批改报告.txt',rows.join('\n'),'text/plain;charset=utf-8');toast('文字报告已导出')}
$('#importBtn').onclick=()=>$('#fileInput').click();$('#fileInput').onchange=async e=>{const file=e.target.files[0];e.target.value='';if(!file)return;if(file.size>12*1024*1024){toast('备份文件过大，请检查是否选对了文件。');return}try{const data=JSON.parse(await file.text());if(data.format!=='mengmeng-algebra'||data.version!==1||!data.state?.responses)throw Error('请选择本网页导出的作答备份');const incoming=validateImport(data.state);dialog('导入备份，替换当前作答？','<p>导入会替换当前浏览器中这一章的作答。建议先导出当前记录保留一份。</p>',[['取消'],['导入并替换',()=>{state=incoming;persist();render();toast('作答和草稿已恢复。')},true]])}catch(err){toast(err.message||'备份格式有误')}};
function validateImport(s){const out={responses:{},notes:{},ink:{},checks:{},attempts:{},teacherGrades:{},view:{cat:0,index:0,filter:'all'}};for(const q of QS){if(Array.isArray(s.responses[q.id]))out.responses[q.id]=q.fields.map((_,i)=>String(s.responses[q.id][i]||'').slice(0,8000));if(typeof s.notes?.[q.id]==='string')out.notes[q.id]=s.notes[q.id].slice(0,20000);if(Array.isArray(s.ink?.[q.id]))out.ink[q.id]=s.ink[q.id].slice(0,400).map(st=>Array.isArray(st)?st.slice(0,4000).filter(p=>Array.isArray(p)&&p.length===2&&p.every(n=>Number.isFinite(n)&&n>=0&&n<=1)):[]);if(Array.isArray(s.checks?.[q.id]))out.checks[q.id]=q.fields.map((f,i)=>checkValue(out.responses[q.id]?.[i]||'',f));if(['correct','wrong','wait'].includes(s.teacherGrades?.[q.id]))out.teacherGrades[q.id]=s.teacherGrades[q.id];if(Array.isArray(s.attempts?.[q.id]))out.attempts[q.id]=s.attempts[q.id].slice(-15).filter(a=>a&&typeof a.time==='string'&&Array.isArray(a.answers)&&Array.isArray(a.results)).map(a=>({time:a.time,answers:a.answers.slice(0,q.fields.length).map(x=>String(x).slice(0,8000)),results:a.results.slice(0,q.fields.length).map(r=>({status:String(r?.status||''),msg:String(r?.msg||'').slice(0,300)}))}))}return out}
$('#printBtn').onclick=()=>dialog('打印练习','<p>学生版不显示答案；老师版显示参考答案和讲解。可打印当前题型，也可打印全章。</p><p>打印时每题留有书写位置。草稿板笔迹通过“导出作答”备份保存。</p>',[['取消'],['学生版·当前题型',()=>printSheet(false,false)],['学生版·全章',()=>printSheet(false,true)],['老师版·全章',()=>printSheet(true,true)]]);
function printSheet(key,all){const list=all?QS:QS.filter(q=>q.cat===state.view.cat);let last=-1;$('#printArea').innerHTML=`<h1>梦梦｜用字母表示数和数量关系</h1><p>${key?'教师版（含参考答案）':'学生版'}　姓名：________　日期：________</p>`+list.map((q,i)=>{let h='';if(q.cat!==last){h=`<h2>${CATS[q.cat].title}</h2>`;last=q.cat}return h+`<article><p><strong>${i+1}. ${esc(q.title)}</strong> <span class="print-src">${esc(q.src)}</span></p><p class="print-stem">${esc(q.stem)}</p>${q.diagram?'<div class="diagram print-diagram">'+diagram(q.diagram)+'</div>':''}${q.fields.map(f=>`<div class="print-field">${esc(f.label)}${key?'：<strong>'+esc(f.answer)+'</strong>':'<div class="print-answer"></div>'}</div>`).join('')}${key?'<div class="print-solution">讲解：'+esc(q.explain)+'</div>':'<p>数量关系与列式：</p><div class="print-answer"></div><div class="print-answer"></div>'}</article>`}).join('');window.print()}
if(!Number.isInteger(state.view.cat)||state.view.cat<0||state.view.cat>=CATS.length)state.view.cat=0;if(!['all','original','variant','wrong'].includes(state.view.filter))state.view.filter='all';render();if(!storageOK)$('#saveStatus').textContent='当前浏览器无法保存，请及时导出作答。';
</script></body></html>
