-size:11px}.nav button.done:after{content:' ✓';color:#73ac72}.extra{border-top:1px solid var(--line);margin-top:10px;padding-top:10px;display:grid;gap:5px}.extra button{font-size:13px}.stats{font-size:12px;color:var(--muted);margin:13px 7px 2px}.card{background:white;border:1px solid var(--line);border-radius:18px;padding:26px;min-width:0;box-shadow:0 3px 16px #28453605}.card h2{font-size:25px;line-height:1.5;margin:4px 0 8px}.muted,.source{font-size:12px;color:var(--muted)}.lead{margin:5px 0 17px;color:#526f5c}.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:17px 0 12px}.steps button{font-size:12px;padding:8px}.teach{padding:15px 18px;background:#edf3e6;border-left:3px solid #82a77c;border-radius:3px 12px 12px 3px;margin-bottom:18px}.teach h3{font-size:16px;margin:0 0 4px}.teach p{margin:0;font-size:15px}.lab{display:grid;grid-template-columns:minmax(0,1fr) 190px;gap:15px}.board{background:#fcfdf8;border:1px solid var(--line);border-radius:12px;overflow:hidden;min-width:0}.board svg{display:block;width:100%;height:auto}.controls{background:#f7f9f2;border:1px solid var(--line);border-radius:12px;padding:13px;font-size:13px;display:grid;align-content:start;gap:13px}.controls label{display:block;font-weight:600}.controls select{width:100%;font-size:13px}.controls p{font-size:12px;margin:0;color:var(--muted)}.readout{background:#f0f5eb;padding:12px 15px;border-radius:10px;margin:12px 0;font-size:15px;min-height:53px}.readout .formula{font-size:20px;font-weight:650;letter-spacing:.3px;color:var(--green)}.legend{padding:3px 12px 10px;font-size:12px;color:var(--muted)}.play{display:flex;gap:8px;align-items:center;margin:12px 0;font-size:12px;flex-wrap:wrap}.play button{font-size:13px}.pitfall{border:1px solid #e6d8bc;border-radius:10px;padding:12px 15px;background:#fffaf0;color:#89622c;font-size:14px;margin-top:17px}.example{font-size:14px;background:#f6f8f3;padding:12px 15px;border-radius:10px;margin-top:12px}.next{display:flex;align-items:center;justify-content:space-between;gap:9px;flex-wrap:wrap;margin-top:20px}.next button{font-size:13px}.mark{font-size:13px;display:flex;align-items:center;gap:6px}input[type=checkbox]{width:17px;height:17px;accent-color:var(--green)}.quiz{border:1px solid var(--line);border-radius:12px;padding:18px;margin-top:20px}.quiz h3{margin:0 0 9px;font-size:17px}.prompt{font-size:17px;margin:9px 0 15px}.options{display:grid;gap:8px}.option{text-align:left;font-size:14px}.option.selected{background:#eaf3e8;border-color:var(--green)}.answer{display:flex;gap:9px;flex-wrap:wrap;align-items:center}.answer input{width:240px}.answer small{font-size:12px;color:var(--muted)}.qactions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.qactions button{font-size:13px}.feedback{padding:11px 14px;font-size:14px;border-radius:9px;margin-top:11px}.good{background:#e8f3e5;color:#315e32}.retry{background:#fff2dd;color:#8c5b25}.solution{padding:13px 15px;border:1px solid #e6d7b7;border-radius:10px;background:#fffaf0;font-size:14px;margin-top:11px}.hint{font-size:14px;color:#587655;margin-top:10px}.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:center;font-size:13px;margin:17px 0}.filters select{font-size:13px}.dots{display:flex;gap:6px;flex-wrap:wrap;margin:16px 0}.dots button{font-size:11px;padding:4px 8px;min-height:32px}.dots button.pass{background:#edf5e7;color:#38623a;border-color:#a9c9a0}.dots button.wrong{background:#fff1dc;color:#946329}.empty{padding:40px 10px;text-align:center;color:var(--muted)}.record{border:1px solid var(--line);border-radius:10px;padding:14px;display:flex;justify-content:space-between;gap:15px;margin-top:10px;font-size:14px}.record button{font-size:12px;white-space:nowrap}.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:18px 0}.summary>div{padding:18px;background:#f0f5eb;border:1px solid var(--line);border-radius:12px;font-size:12px;color:var(--muted)}.summary strong{display:block;font-size:28px;color:var(--green)}.footer{font-size:12 </style></head><body><div class="wrap"><header><div><div class="eyebrow">LETTERS & NUMBERS / 五年级上册</div><h1>用字母表示数和数量关系</h1><p>第五单元 · 从看懂图，到自己写出关系 · 课本第55—71页</p></div><div class="tools"><button onclick="go('quiz')">全章练习</button><button onclick="go('review')">学习记录</button><button onclick="exportRecord()">导出记录</button></div></header><p id="notice" class="notice" role="status"></p><div class="layout"><aside class="side"><h2>20个主题，跟着课本学</h2><nav id="nav" class="nav" aria-label="单元目录"></nav><div class="extra"><button id="quizNav" onclick="go('quiz')">分层练习</button><button id="reviewNav" onclick="go('review')">错题与学习记录</button><button id="sheetNav" onclick="go('sheet')">知识速查</button></div><p id="stats" class="stats"></p></aside><main id="main"></main></div><p class="footer">依据已上传的新版人教版五年级上册课本第55—71页制作。图示为教学重绘；题目分别标注课本拆练、改编或原创变式。学习记录仅保存在当前浏览器，切换设备不会自动同步。</p></div><script>
const LESSONS = [
 {id:'age',title:'字母可以表示哪些数',pages:'55—56',lab:'age',goal:'把一个个算式，变成适用于一组情况的关系。',steps:[['先说清字母指什么','用 a 表示小红的年龄，用 b 表示爸爸的年龄。爸爸比小红大25岁。“a”代表年龄这个数，并不是小红名字的缩写。'],['两个人一起长大','小红1岁时爸爸26岁，2岁时爸爸27岁。a 变了，b 跟着变，但 b−a 始终等于25，所以 b=a+25。拖动年龄看看。'],['既表示一个量，也表示关系','a+25 表示爸爸的年龄；b=a+25 把两人的年龄关系写成了等式。只知道 a 还没有具体值，也能正确表示爸爸的年龄。'],['字母的取值要看情境','这里按整岁研究，a 取符合实际的非负整数。人的实际年龄不能随便取200岁；换成长度时，字母又可以表示合适的小数。']],trap:'同一道题里，同一个字母的含义要保持一致。不同字母可以取相同的数，也可以取不同的数。',example:'当 a=11 时，b=a+25=11+25=36（岁）。'},
 {id:'relation',title:'多、少、剩下：先找谁是谁',pages:'56、60—62、69—70',lab:'relation',goal:'用线段图确定减法的顺序，读懂式子的实际意义。',steps:[['先把已知量放在线段上','把小明售出的件数记为 m。小华比他多4件，就把 m 和多出来的4接在一起，得到 m+4。'],['“一共”是整体','小林和小明一共售出16件，小林售出的件数是16−m。这里16是总数，不能写成 m−16。'],['同一个减法，所求可能不同','“原来有 n，拿走5”得到 n−5；“一共16，其中 m”得到16−m。不要看到“少”就照着文字顺序相减。'],['先乘，再求剩余','1200克果汁倒出3小杯，每杯 a 克。倒出的是3a克，剩下1200−3a克。要把3杯的总量一起减去。']],trap:'a−b 和 b−a 通常不同；“甲比乙多4”要先确认字母表示的是甲还是乙。',example:'设 m=7，则小华售出7+4=11件；小林售出16−7=9件。'},
 {id:'multiple',title:'几个相同的量：倍数关系',pages:'57—58、60—61、70',lab:'multiple',goal:'把“几份、几倍”对应到乘法，反过来能求一份。',steps:[['一份有多少','每盒有 m 支笔，6盒就有 m+m+m+m+m+m=6×m。6是份数，m是一份量。'],['写成更简洁的式子','6×m 可以简写成6m。它表示6与m相乘，不是“6后面接一个m”，也不是6+m。'],['结果变化，倍数不变','把每盒支数调大，总支数也会调大。总数 n=6m；如果已知 n，要平均分成6份，m=n÷6。'],['表达式要带回情境读','6m 可以表示6盒笔的总支数，也可以表示速度为每小时 m 千米时6小时的路程。式子相同，意义和单位要看题设。']],trap:'“椅子数是足球数的3倍”，椅子有 d 把时，足球是 d÷3 个，不是3d个。',example:'n=210时，m=n÷6=210÷6=35。'},
 {id:'notation',title:'省略乘号，哪些能省',pages:'57—58、61',lab:'notation',goal:'读懂6a、ab、a²，并保留必要的运算符号。',steps:[['数与字母相乘','a×8 通常写成8a，数字写在字母前面。1×a 通常写成 a。小数也一样，0.5×a=0.5a。'],['字母与字母相乘','a×b 可以写成 a·b 或 ab。两个 a 相乘写成 a²，读作“a的平方”。'],['括号外也可以省乘号','4×(a+b) 写成4(a+b)，表示整个 a+b 的4倍。括号不能随意丢掉。'],['加减除不能照样省略','a+3、a−3、a÷3 中的运算符不能直接删去。3×5不能写成35，因为35是一个两位数。']],trap:'a×a=a²；a+a=2a。省略乘号不会把乘法变成加法。',example:'a×x=ax，b×8=8b，b×1=b，x×x=x²。'},
 {id:'square',title:'2a 与 a² 到底差在哪',pages:'58、67、70',lab:'square',goal:'用两排小方格和正方形看见“两个a”与“a个a”。',steps:[['2a：两个 a 相加','2a=a+a。若每排有 a 个方格，两排共有2a个。这里固定的是排数2。'],['a²：两个 a 相乘','a²=a×a。一个正方形每行 a 个、共有 a 行，方格总数就是 a²。'],['代数值，分别按含义算','a=3时，2a=6，a²=9。a=5时分别是10和25。拖动 a，对照两幅图。'],['偶尔相等，不代表总相等','a=2时，2a和a²都等于4；a=0时也相等。但不能据此说这两个式子相同。比较式子要看整个取值范围。']],trap:'a²不是 a×2，也不是 a+2。求平方要把同一个数乘两次。',example:'当 x=8时，x²=64，4x=32；x=0或4时，x²与4x相等。'},
 {id:'formula',title:'用字母写周长、面积和公式',pages:'58、61',lab:'formula',goal:'把字母和图上的长度一一对应，分清周长与面积。',steps:[['先定义字母','用 a 表示长方形的长，用 b 表示宽，用 C 表示周长，用 S 表示面积。字母并不是永远只能表示这一种量，要看本题约定。'],['沿边走一圈是周长','长、宽各有两条，所以 C=2(a+b)=2a+2b。a+b 只算了一条长和一条宽。'],['铺满里面是面积','长方形 S=ab；正方形边长为 a 时，C=4a，S=a²。周长用长度单位，面积用平方单位。'],['常用关系也能用字母写','路程 s=vt；速度 v=s÷t（t≠0）；时间 t=s÷v（v≠0）。总价 c=an，其中 a 为单价、n为数量。']],trap:'把长和宽一起乘2才能得到周长：2(a+b)不是2a+b。单位也要跟着所求的量变。',example:'a=6厘米、b=4厘米时，C=20厘米，S=24平方厘米。'},
 {id:'substitute',title:'代入求值：字母换数后再算',pages:'56—59、65、70',lab:'substitute',goal:'写清替换过程，遵守原来式子的运算顺序。',steps:[['保留原式','先写所求式子，再把每个字母替换成给定的数。例如3a+2，a=4时，写成3×4+2。'],['把隐藏的乘号写回来','4x+y 中的4x是4×x；a²是a×a。代入时把这些乘法展开，会更不容易误读。'],['按顺序计算','先算括号、再算乘除、最后算加减。3(a+b) 代入后仍先算括号，不能只把3乘给 a。'],['合理检查结果','如果总价是2.5n元，n取件数，应为合适的非负整数。结果与式子的意义、单位要对应。']],trap:'a=4时，3a+2不是34+2。代入求值不是把数字拼接在一起。',example:'a=2、b=3时，3(a+b)=3×(2+3)=15。'},
 {id:'laws',title:'运算律与合并相同的量',pages:'58、62、64、70',lab:'laws',goal:'用图理解分配律，知道为什么3x+5x能写成8x。',steps:[['交换与结合','a+b=b+a，ab=ba；(a+b)+c=a+(b+c)，(ab)c=a(bc)。交换律适用于加法和乘法，不能照搬给减法、除法。'],['把大长方形分成两块','两块宽分别为 a、b，高都为 c。面积可以先合并宽再乘高：(a+b)c，也能分开算 ac+bc。'],['把几份相同的量放在一起','3x+5x=(3+5)x=8x。11x−9x=2x，b+7b=8b，因为一个 b 就是1b。'],['不同的量不能硬合','3a+5b中，a和b没有被说明相同，不能写成8a或8ab。即使某一次碰巧 a=b，也不能当成通用规则。']],trap:'4(x+3)=4x+12；别漏乘括号里的第二项。减法交换顺序通常会改变结果。',example:'当 a=3、b=2、c=4时，(a+b)c=5×4=20，ac+bc=12+8=20。'},
 {id:'balance',title:'等式两边，为什么要一起变',pages:'59、70',lab:'balance',goal:'用天平理解同加、同减、同乘、同除。',steps:[['等号表示相等','a=b表示左右两边的值相同。天平平衡，可以帮助我们看见这个“相等”。'],['两边同时加减同一个数','如果 a=b，那么 a+c=b+c，a−c=b−c。只给一边加、另一边不动，通常会破坏相等关系。'],['两边同时乘除同一个数','如果 a=b，那么 ac=bc；a÷c=b÷c 的前提是 c≠0。0不能作除数。两边乘0仍相等，但会丢失原来的数量信息。'],['每一步都保住相等','求未知数时，不凭空删掉一项；要在两边做同样的运算。观察天平，再看下面等式如何变化。']],trap:'“两边都操作”还不够，必须是相同的运算、相同的数；除数还不能为0。',example:'17+8=25，两边都加3：17+8+3=25+3，仍然相等。'},
 {id:'unknown',title:'求未知数：沿着关系反过来',pages:'59、63、65、71',lab:'unknown',goal:'在两边做同样的运算，让未知数单独留下。',steps:[['先把已知结果代入','若 b=a+20，b=37，则 a+20=37。我们要找的是“什么数加20得到37”。'],['消去加上的数','两边同时减20：a+20−20=37−20，所以 a=17。若 a−20=37，两边应同时加20，得到 a=57。'],['消去相乘的倍数','若6m=9，两边同时除以6，m=1.5。若 m÷6=9，两边同时乘6，m=54。'],['代回去验证','求得结果后放回原关系：6×1.5=9。多步问题倒着逐步还原，例如1.8c+32=86，先减32，再除1.8。']],trap:'a−20=37的答案不是17；已知结果和某一部分时，别把正向运算原样再做一遍。',example:'n=2+2m，n=52时，2m=50，m=25。'},
 {id:'tables',title:'拼桌子：变化的部分＋固定的部分',pages:'63、70',lab:'tables',goal:'用摆图找一般规律，并用表格和具体数检验。',steps:[['先看怎么拼、哪里能坐','课本例4中，桌子排成一行，每张上下各坐1人，最左和最右各坐1人。拼接处不能坐。'],['把人数拆成两部分','上下两排，每排 m 人，共2m人；两端固定2人，所以 n=2m+2。桌子增加，只有2m这部分增加。'],['换一种桌子，规律也会换','复习题中，单张桌子坐6人，拼接时每次少2个座位。上下每张各2人，两端各1人，人数变成4m+2。'],['反过来求桌子数','例4中52人恰好坐满：(52−2)÷2=25张。若4m+2要坐下37人，算出8.75后至少需要9张，还要检验容量。']],trap:'不能把 m 张连拼桌子按4m或6m计算，因为拼接处的座位被占用了。',example:'课本例4：m=15，n=2×15+2=32人。'},
 {id:'route',title:'两段行程：括号怎样表示总时间',pages:'64—65、71',lab:'route',goal:'把线段图、总时间和分配律连起来。',steps:[['给每一段标出时间','题设列车每小时行驶320千米，甲到乙用 a 小时、乙到丙用 b 小时，两段都按同一个速度计算。'],['合起来算','总时间是 a+b 小时。总路程 s=320(a+b)，括号让两个时间先合起来。'],['分开算也可以','甲乙段320a千米，乙丙段320b千米，总路程320a+320b。它和320(a+b)相等，正好用到分配律。'],['已知全程，反求一段时间','s=2240、a=3时，全程时间2240÷320=7小时，b=7−3=4小时。注意时间与速度的单位要配套。']],trap:'320a+b把第二段的小时数直接加到千米数上，既漏乘速度，单位也不相同。',example:'a=2、b=3时，s=320×(2+3)=1600千米。'},
 {id:'meet',title:'相向而行：每段时间合走多少',pages:'65—66',lab:'meet',goal:'从分别计算两人路程，走向速度和×共同时间。',steps:[['先找共同的时间','两车从两端同时出发，相向而行，到相遇时行驶了相同的 x 小时。这里“同时出发、相遇”很关键。'],['先分别求路程','题设甲车每小时200千米、乙车每小时320千米。它们各走200x、320x千米，合起来是200x+320x。'],['用速度和简写','每小时两车一共走200+320=520千米，所以合走路程是520x。它与分别计算再相加完全一致。'],['区别“合走”与“多走”','合走用(200+320)x；乙比甲多走用(320−200)x=120x。两问所用的数量关系不同。']],trap:'用速度和的前提是两者按题设一起运动同样长的时间；时间不同要分别计算。',example:'x=2时，两车合走1040千米，乙比甲多走240千米。'},
 {id:'sequence',title:'从数表、点阵找第 n 个',pages:'65—66',lab:'sequence',goal:'把序号 n 与对应的数分开，先解释规律再写式子。',steps:[['n表示位置','序列2、4、6、8……中，n表示第几个，数值是2n。第5个数是10，并不是5。'],['奇数比对应偶数少1','1、3、5、7……第 n 个是2n−1；1、4、9、16……是正方形点阵，第 n 个是 n²。'],['用小序号检验','把 n=1、2、3代回式子，看能否对应已画出的图。只看一组图，可能会猜错规律。'],['反求序号','第 n 行有2n个圆片，最后一行100个，则2n=100，n=50。这里求的是行数，而不是所有行圆片的总数。']],trap:'“第 n 个”与“前 n 个一共”是不同的问题。知道第50行100个，并不能说前50行一共100个。',example:'奇数列第8个数2×8−1=15，平方数列第8个数8²=64。'},
 {id:'cubes',title:'叠方块：露在外面的面',pages:'66',lab:'cubes',goal:'看见被挡住的面，解释每加一个为什么只多4个面。',steps:[['题目约定怎样摆','n个小正方体竖直叠成一柱，放在地面上。相贴的面和最下面接地的面，都不算露在外面的面。'],['按位置分类','每个方块都有4个侧面露在外面，共4n个；整柱只有最上面的1个顶面露在外面。'],['写成一般关系','露面的个数 F=4n+1。n=1时5个，n=2时9个，n=3时13个，每增加一个方块增加4个面。'],['摆法一换，要重新数','若一柱悬空，底面也露出，才是4n+2。若改成其他摆法，不能直接套竖直叠放的结论。']],trap:'不能直接写6n；接触处上下两个面都被挡住，最底下还有一个接地面。图上暂时看不到的背面，仍可能是外露面。',example:'n=7时，F=4×7+1=29个面。'},
 {id:'chips',title:'黑白棋子：拼出长方形',pages:'67',lab:'chips',goal:'把逐层相加转化成“长方形总数的一半”。',steps:[['先确认第1组是什么','课本第1组黑棋为1+2=3枚，棋盘是2行3列。第2组黑棋1+2+3=6枚，棋盘是3行4列。'],['第 n 组的行列数','第 n 组有 n+1 行、n+2 列，总数是(n+1)(n+2)。这里不是 n 行，不要漏掉序号的偏移。'],['黑棋正好占一半','黑棋每行从1枚逐渐增加到n+1枚，白棋能与它拼成完整长方形。黑棋数=(n+1)(n+2)÷2。'],['连接连续整数求和','1+2+…+k=k(k+1)÷2。两份阶梯拼成 k 行、k+1 列的长方形，因此最后要除以2。']],trap:'课本“第15组”有16行，不是15行；若把式子写成 n(n+1)÷2，会整体少算一行。',example:'第15组：总棋子16×17=272枚，黑棋272÷2=136枚。'},
 {id:'polygon',title:'对角线：哪些不能连，哪些数重了',pages:'67',lab:'polygon',goal:'先从一个顶点数，再考虑所有顶点的重复计数。',steps:[['什么叫对角线','连接多边形两个不相邻顶点的线段叫对角线。边本身不算对角线。'],['从一个顶点出发','n个顶点，不能连自己，也不能把相邻两个顶点的边算进去，剩下 n−3 个可连顶点。'],['数全部要除以2','n个顶点各数 n−3 条，得到 n(n−3)，但同一条线从两个端点各数了一次，所以总数 n(n−3)÷2。'],['先在图上验证','四边形从一个顶点画1条，共2条；五边形从一个顶点画2条，共5条。切换显示方式，看看每条线的两个端点。']],trap:'一个顶点的对角线数 n−3 与整个图的对角线总数 n(n−3)÷2不能混用；n为不小于3的整数。',example:'六边形：一个顶点可画3条，全部共有6×3÷2=9条。'},
 {id:'hundred',title:'探秘百数表：用字母解释发现',pages:'68',lab:'hundred',goal:'移动“田”字框，发现并解释不随位置改变的关系。',steps:[['先看横向和纵向','百数表每行10个数。右边相邻数比左边大1，下边相邻数比上边大10。跨行换行处不要当作水平相邻。'],['用左上角的数表示其余三格','左上角为 a，右上角 a+1，左下角 a+10，右下角 a+11。移动框，位置变了，关系不变。'],['对角和为什么相等','一组对角和 a+(a+11)=2a+11；另一组(a+1)+(a+10)=2a+11，所以一定相等。'],['区分四格总和','四格之和 a+(a+1)+(a+10)+(a+11)=4a+22，是对角和的2倍。a不能取最右一列或最下一行。']],trap:'“右边大1”只适用于同一行的相邻格，不能把10和11圈成一行里的相邻两格。',example:'左上角23时，四格是23、24、33、34，两条对角和都等于57。'},
 {id:'temperature',title:'两步数量关系：温度换算',pages:'71',lab:'temperature',goal:'用输入输出顺序理解式子，反求时按相反顺序。',steps:[['先约定字母和单位','用 c 表示摄氏温度数值，用 f 表示华氏温度数值，题设关系为 f=1.8c+32。它们的数值不同，单位也不同。'],['正向先乘、后加','输入摄氏温度，先乘1.8，再加32，得到华氏温度。c=20时，f=1.8×20+32=68。'],['逆向先减、后除','已知 f=86，则先86−32=54，再54÷1.8=30，得到30℃。先做除法会改变关系。'],['用已知对应点检查','c=0时f=32；c=100时f=212。两种刻度的0点不同，所以不能只用一个倍数互换。']],trap:'1.8c+32不是1.8(c+32)；反求时必须先减32，不能先除1.8。',example:'86℉对应(86−32)÷1.8=30℃。'},
 {id:'partition',title:'面积拼图：四块为什么能合成一块',pages:'62、71',lab:'partition',goal:'用面积验证分配律，把字母和不同的图形部件对应起来。',steps:[['先看外边的长度','大正方形每条边都是 a+b，所以整体面积是(a+b)²，也就是(a+b)(a+b)。'],['看里面的四块','两块正方形分别是 a×a、b×b，面积a²、b²；另两块长方形的长宽都是 a和b，面积各为ab。'],['两种数法得到同一面积','所以(a+b)²=a²+2ab+b²。不要漏掉两个长方形。先看图理解，不要求死背展开式。'],['改变 a、b检查','a=3、b=2时，整个面积25，四块9+6+6+4=25。拖动边长，看两个长方形怎样一起变化。']],trap:'(a+b)²通常不等于 a²+b²；两个ab不是没有面积的边线，它们是实实在在的两块长方形。',example:'a=4、b=1时，总面积25，其中两块长方形合起来占8。'}
];
const QUESTIONS=[];
function q(l,type,prompt,answer,hint,solution,more={}){QUESTIONS.push({id:'q'+String(QUESTIONS.length+1).padStart(2,'0'),l,type,prompt,answer,hint,solution,kind:'原创变式',...more});}
function num(l,p,a,h,s,u='',m={}){q(l,'number',p,a,h,s,{unit:u,...m});}
function expr(l,p,a,h,s,m={}){q(l,'expr',p,a,h,s,m);}
function choice(l,p,opts,h,s,m={}){q(l,'choice',p,0,h,s,{options:opts,...m});}

const Algebra=(()=>{
 const fmt=n=>Number.isFinite(n)?String(Number(n.toFixed(8))):'—';
 function normalize(s){return String(s).trim().replace(/[０-９Ａ-Ｚａ-ｚ（）＋－．／＊]/g,c=>String.fromCharCode(c.charCodeAt(0)-65248)).replace(/\s+/g,'').replace(/[×·⋅]/g,'*').replace(/[÷]/g,'/').replace(/[−–]/g,'-').replace(/²/g,'^2').toLowerCase();}
 const clean=p=>{for(const k in p){if(!Number.isFinite(p[k])||Math.abs(p[k])>1e12)throw Error('数值过大');if(Math.abs(p[k])<1e-10)delete p[k];}if(Object.keys(p).length>100)throw Error('式子过长');return p;};
 function plus(p,r,s=1){const o={...p};for(const k in r)o[k]=(o[k]||0)+s*r[k];return clean(o);}
 function mul(p,r){const o={};for(const a in p)for(const b in r){const k=(a+b).split('').sort().join('');if(k.length>8)throw Error('次数过高');o[k]=(o[k]||0)+p[a]*r[b];}return clean(o);}
 function parse(input){
  const s=normalize(input);if(!s||s.length>160)throw Error('请填写一个简短的式子');if(/[^0-9a-z+*/^().-]/.test(s))throw Error('请只写所求式子，不带等号、单位或文字');if(/[a-z]\d/.test(s))throw Error('数字系数请写在字母前，如2a；平方写a²或a^2');
  const ts=s.match(/(?:\d+(?:\.\d+)?|\.\d+)|[a-z]|[+*/^().-]/g)||[];if(ts.join('')!==s)throw Error('式子的格式还不完整');let pos=0,depth=0;
  function atom(){if(++depth>30)throw Error('括号太多');let p,t=ts[pos++];if(t==='('){p=add();if(ts[pos++]!==')')throw Error('请把括号写完整');}else if(t&&/^[a-z]$/.test(t))p={[t]:1};else if(t&&/^(?:\d|\.)/.test(t))p={'':Number(t)};else throw Error('这里缺少数或字母');depth--;return clean(p);}
  function power(){let p=atom();if(ts[pos]==='^'){pos++;if(ts[pos++]!=='2')throw Error('本页平方请写^2或²');p=mul(p,p);}return p;}
  function unary(){if(ts[pos]==='+'){pos++;return unary();}if(ts[pos]==='-'){pos++;return mul({'':-1},unary());}return power();}
  function product(){let p=unary();while(pos<ts.length){let t=ts[pos];if(t==='*'||t==='/'){pos++;let r=unary();if(t==='*')p=mul(p,r);else{if(Object.keys(r).some(k=>k!==''))throw Error('本练习请把除数写成具体的数');const v=r['']||0;if(v===0)throw Error('0不能作除数');p=mul(p,{'':1/v});}}else if(t==='('||/^[a-z]$/.test(t||'')||/^(?:\d|\.)/.test(t||'')){p=mul(p,unary());}else break;}return p;}
  function add(){let p=product();while(ts[pos]==='+'||ts[pos]==='-'){const sign=ts[pos++]==='+'?1:-1;p=plus(p,product(),sign);}return p;}
  const p=add();if(pos!==ts.length)throw Error('请检查运算符和括号');return clean(p);
 }
 function equivalent(a,b){const p=parse(a),r=parse(b);return Object.keys({...p,...r}).every(k=>Math.abs((p[k]||0)-(r[k]||0))<1e-8);}
 function grade(item,input){
  if(item.type==='choice')return {correct:typeof input==='number'&&input===item.answer,error:input===null||input===undefined?'请先选择一项。':''};
  if(item.type==='number'){const s=normalize(input??'');if(!/^[+-]?(?:\d+(?:\.\d+)?|\.\d+)$/.test(s))return {correct:false,error:'请填写数值，单位已写在输入框旁。'};return {correct:Math.abs(Number(s)-item.answer)<1e-8};}
  try{const correct=equivalent(input,item.answer);if(correct&&item.canonical&&normalize(input)!==normalize(item.answer))return {correct:false,error:'数量关系对了。这一题还要求按通常简写格式填写：数字在前、省略乘号，平方用²或^2。'};if(correct&&item.expanded&&/[()]/.test(normalize(input)))return {correct:false,error:'数值关系对了；请按题目要求展开，填写不含括号的式子。'};return {correct};}catch(e){return {correct:false,error:e.message+'。'};}
 }
 function value(expression,values){const p=parse(expression);return Object.entries(p).reduce((s,[key,c])=>s+c*key.split('').reduce((v,k)=>v*values[k],1),0);}
 function polygon(n){const pts=Array.from({length:n},(_,i)=>{const t=-Math.PI/2+2*Math.PI*i/n;return [340+105*Math.cos(t),180+105*Math.sin(t)];});const edges=[];for(let i=0;i<n;i++)for(let j=i+1;j<n;j++)if(j-i!==1&&!(i===0&&j===n-1))edges.push([i,j]);return {pts,edges};}
 return {fmt,normalize,parse,equivalent,grade,value,polygon};
})();

 if(id==='hundred'){const row=p.row,col=p.col,A=(row-1)*10+col;top='移动田字框，保持横差1、竖差10';for(let r=0;r<10;r++)for(let c=0;c<10;c++){const highlight=r>=row-1&&r<=row&&c>=col-1&&c<=col;body+=rect(38+c*26,52+r*26,26,26,highlight?'#efd6a6':'#f1f5e9','#c6d1bf',0)+txt(51+c*26,70+r*26,String(r*10+c+1),11);}body+=txt(480,93,`${A}    ${A+1}`,28)+txt(480,145,`${A+10}    ${A+11}`,28)+line(420,103,535,134,COLOR.blue,2)+line(535,103,420,134,COLOR.gold,2)+txt(480,202,`${A}+${A+11}=${2*A+11}`,22,COLOR.blue)+txt(480,243,`${A+1}+${A+10}=${2*A+11}`,22,COLOR.gold);caption=`a=${A}；两个对角和都为2a+11=${2*A+11}；四格总和4a+22=${4*A+22}。`;}
 if(id==='temperature'){const f=1.8*c+32,y=275-c*1.8;top='相同温度，对应两套不同的数字刻度';body=rect(100,75,40,220,'#edf3e6')+rect(500,75,40,220,'#edf3e6')+rect(105,y,30,285-y,'#9cbfda')+rect(505,y,30,285-y,'#e4c17e')+txt(120,62,`${c}℃`,27,COLOR.blue)+txt(520,62,`${F(f)}℉`,27,COLOR.gold)+txt(330,160,`×1.8，再+32`,24)+txt(330,207,`${c} → ${F(f)}`,24)+line(145,y,495,y,'#9bb2a1',1,'5 5');caption=`f=1.8c+32=1.8×${c}+32=${F(f)}（℉）`;bottom='两根柱表示同一个温度的位置，数字刻度不同；图示范围为0—100℃。';}
 if(id==='partition'){const sum=a+b,k=240/sum,x=215,y=65;top='两块正方形＋两块长方形，拼成大正方形';body=rect(x,y,a*k,a*k,'#b9d2df')+rect(x+a*k,y,b*k,a*k,'#efd6a5')+rect(x,y+a*k,a*k,b*k,'#efd6a5')+rect(x+a*k,y+a*k,b*k,b*k,'#bccfac')+txt(x+a*k/2,y+a*k/2+6,'a²',17)+txt(x+a*k+b*k/2,y+a*k/2+6,'ab',16)+txt(x+a*k/2,y+a*k+b*k/2+6,'ab',16)+txt(x+a*k+b*k/2,y+a*k+b*k/2+6,'b²',16)+txt(x+a*k/2,y-10,`a=${a}`,17)+txt(x+a*k+b*k/2,y-10,`b=${b}`,17)+txt(x+sum*k+13,y+a*k/2,`a`,17,COLOR.ink,'start')+txt(x+sum*k+13,y+a*k+b*k/2,`b`,17,COLOR.ink,'start');caption=`(a+b)²=(${a}+${b})²=${sum*sum}；a²+2ab+b²=${a*a}+${2*a*b}+${b*b}=${sum*sum}。`;bottom='金色两块的面积各为ab；合起来为2ab。';}
 return {svg:panel(top,body,bottom),caption};
}
function updateLab(){const result=drawScene(state.lesson,params());$('board').innerHTML=result.svg;$('readout').innerHTML=`<span class="formula">${esc(result.caption)}</span>`;}
function quizHTML(q,inline=false){
 const r=answer(q),l=LESSONS.find(l=>l.id===q.l);
 const result=r.checked?`<div class="feedback ${r.correct?'good':'retry'}" role="status">${r.correct?'✓ 这一题答对了。':esc(r.error||'还需要调整。先看提示，重新想一想数量关系。')}</div>`:'';
 const letters=q.type==='expr'?[...new Set(String(q.answer).match(/[a-z]/g)||[])]:[];
 const pad=q.type==='expr'?`<div class="keypad" aria-label="式子输入辅助">${[...letters,'+','−','×','÷','(',')','²'].map(t=>`<button type="button" onclick="insertToken('${q.id}','${t}')" aria-label="插入 ${t}">${t}</button>`).join('')}</div><p class="norm">只填式子，不带等号和单位。支持 ×、÷、括号、a² / a^2；乘号可省。普通列式接受等价写法，要求简写或展开的题目按题意填写。</p>`:'';
 const input=q.type==='choice'?`<div class="options">${q.options.map((o,i)=>`<button class="option ${r.value===i?'selected':''}" aria-pressed="${r.value===i}" onclick="choose('${q.id}',${i},${inline})">${String.fromCharCode(65+i)}. ${o}</button>`).join('')}</div>`:`<div class="answer"><label for="ans-${q.id}" class="muted">${q.type==='expr'?'所求式子':'数值'}</label><input id="ans-${q.id}" type="text" inputmode="${q.type==='number'?'decimal':'text'}" autocomplete="off" maxlength="160" value="${esc(r.value??'')}" oninput="editAnswer('${q.id}',this.value)" onkeydown="if(event.key==='Enter')checkAnswer('${q.id}',${inline})" placeholder="${q.type==='expr'?'例如 2a+3 或 a^2':'填写数值'}"><small>${q.unit||''}</small></div>${pad}`;
 return `<section class="quiz"><div class="source"><span class="tag">${q.kind}</span>${q.id.toUpperCase()} · 对应课本第${l.pages}页</div><h3>${inline?'随手试一道':'自己写一写、算一算'}</h3><p class="prompt">${q.prompt}</p>${input}<div class="qactions"><button class="primary" onclick="checkAnswer('${q.id}',${inline})">检查答案</button><button onclick="hintAnswer('${q.id}',${inline})">${r.hint?'收起提示':'给一点提示'}</button><button onclick="showAnswer('${q.id}',${inline})">${r.show?'收起解析':'查看解析'}</button></div>${r.hint?`<p class="hint">提示：${q.hint}</p>`:''}${result}${r.show?`<div class="solution"><strong>参考答案：${esc(answerText(q))}${q.unit?' '+q.unit:''}</strong><br>${q.solution}<br><span class="muted">看过答案后，请遮住解析再独立做一次。</span></div>`:''}</section>`;
}
function insertToken(id,token){const input=$('ans-'+id);if(!input)return;const value=input.value,start=Number.isInteger(input.selectionStart)?input.selectionStart:value.length,end=Number.isInteger(input.selectionEnd)?input.selectionEnd:start;const next=value.slice(0,start)+token+value.slice(end);if(next.length>160)return;input.value=next;editAnswer(id,next);input.focus();input.setSelectionRange(start+token.length,start+token.length);}
function answerText(q){return q.type==='choice'?q.options[q.answer]:String(q.answer).replace(/\^2/g,'²').replace(/\//g,'÷');}
function qById(id){return QUESTIONS.find(q=>q.id===id);}
function editAnswer(id,v){const r=answer(qById(id));r.value=v;r.checked=false;r.correct=false;r.error='';save();renderNav();const area=$('ans-'+id)?.closest('.quiz');if(area){const f=area.querySelector('.feedback');if(f)f.remove();}}
function rerenderQuestion(id,inline){if(inline){const area=$('quick');if(area)area.innerHTML=quizHTML(qById(id),true);}else renderPractice();renderNav();save();}
function choose(id,v,inline){const r=answer(qById(id));r.value=v;r.checked=false;r.correct=false;r.error='';rerenderQuestion(id,inline);}
function checkAnswer(id,inline){const q=qById(id),r=answer(q),result=Algebra.grade(q,r.value);r.checked=true;r.correct=result.correct;r.error=result.error||'';r.wrong=!result.correct;r.attempts=(Number(r.attempts)||0)+1;rerenderQuestion(id,inline);}
function hintAnswer(id,inline){const r=answer(qById(id));r.hint=!r.hint;r.hinted=true;rerenderQuestion(id,inline);}
function showAnswer(id,inline){const r=answer(qById(id));r.show=!r.show;r.viewed=true;rerenderQuestion(id,inline);}
function filtered(){return QUESTIONS.filter(q=>(state.topic==='all'||q.l===state.topic)&&(!state.onlyWrong||wrong(q)));}
function setFilter(topic,only){state.topic=topic;state.onlyWrong=only;const a=filtered();if(a.length&&!a.some(q=>q.id===state.qid))state.qid=a[0].id;save();renderPractice();}
function openQuestion(id){stop();state.view='quiz';state.topic='all';state.onlyWrong=false;state.qid=id;save();render();}
function selectQuestion(id){state.qid=id;save();renderPractice();}
function moveQuestion(d){const a=filtered(),i=a.findIndex(q=>q.id===state.qid);if(a[i+d])selectQuestion(a[i+d].id);}
function renderPractice(){const a=filtered();if(a.length&&!a.some(q=>q.id===state.qid))state.qid=a[0].id;const q=a.find(q=>q.id===state.qid),idx=a.indexOf(q);$('main').innerHTML=`<article class="card"><div class="source">基础理解 → 独立列式 → 综合与拓展</div><h2>把关系写出来</h2><p class="lead">共${QUESTIONS.length}题。做完后读一遍：式子里的每一项，对应题目中的哪一个量？</p><div class="filters"><label for="topic">选择主题</label><select id="topic" onchange="setFilter(this.value,state.onlyWrong)"><option value="all">全部主题</option>${LESSONS.map(l=>`<option value="${l.id}" ${state.topic===l.id?'selected':''}>${l.title}</option>`).join('')}</select><label><input type="checkbox" ${state.onlyWrong?'checked':''} onchange="setFilter(state.topic,this.checked)">只看待订正</label><span>当前${a.length}题</span></div>${q?`<div class="dots">${a.map((item,i)=>{const r=answer(item);return `<button aria-label="第${i+1}题 ${item.id}" class="${item.id===q.id?'active ':''}${r.checked&&r.correct?'pass':wrong(item)?'wrong':''}" onclick="selectQuestion('${item.id}')">${i+1}</button>`;}).join('')}</div><div class="source">当前 ${idx+1}/${a.length} · ${LESSONS.find(l=>l.id===q.l).title}</div>${quizHTML(q)}<div class="next"><button onclick="moveQuestion(-1)" ${idx===0?'disabled':''}>上一题</button><button onclick="openLesson('${q.l}')">回看讲解和图示</button><button class="primary" onclick="moveQuestion(1)" ${idx===a.length-1?'disabled':''}>下一题</button></div>`:'<div class="empty">这个范围内没有待订正题。可以切回全部题目，或换一个主题。</div>'}</article>`;}
function renderReview(){const pass=QUESTIONS.filter(q=>answer(q).checked&&answer(q).correct),bad=QUESTIONS.filter(wrong),seen=QUESTIONS.filter(q=>answer(q).viewed);$('main').innerHTML=`<article class="card"><div class="source">自评和答题结果分别记录</div><h2>学习记录</h2><div class="summary"><div><strong>${LESSONS.filter(l=>state.done[l.id]).length}/20</strong>自己勾选“能讲明白”</div><div><strong>${pass.length}/${QUESTIONS.length}</strong>最近一次已答对</div><div><strong>${bad.length}</strong>仍待订正</div></div><p class="muted">查看过解析：${seen.length}题。看过答案与独立答对分别记录；自评不等于已经通过检测。</p><h3>待订正的题</h3>${bad.length?bad.map(q=>`<div class="record"><div><span class="tag">${q.id.toUpperCase()}</span>${q.prompt}<br><span class="muted">已检查${answer(q).attempts||0}次${answer(q).viewed?' · 看过解析':''}${answer(q).hinted?' · 用过提示':''}</span></div><button onclick="openQuestion('${q.id}')">再做一次</button></div>`).join(''):'<p class="empty">目前没有待订正题，继续做题检验理解。</p>'}<h3>把不明白的地方写下来</h3><label class="muted" for="notes">例如：我还分不清什么时候先减、什么时候先除。</label><textarea id="notes" maxlength="10000" oninput="state.notes=this.value;save()">${esc(state.notes)}</textarea><div class="qactions"><button onclick="exportRecord()">导出学习记录</button><button onclick="go('quiz')">继续练习</button></div></article>`;}
function renderSheet(){$('main').innerHTML=`<article class="card"><div class="source">课本第55—71页 · 随时回来查</div><h2>把这些关系串起来</h2><p class="lead">先说字母表示什么，再说式子每一部分表示什么，最后代入检验。</p><table class="formula-table"><tr><th>含义</th><th>字母关系</th><th>提醒</th></tr><tr><td>比a多c / 比a少c</td><td>a+c / a−c</td><td>已知的是哪个量？</td></tr><tr><td>总数T，取走n份，每份a</td><td>T−na</td><td>先求取走总量</td></tr><tr><td>总价 / 路程</td><td>c=an / s=vt</td><td>单位须对应</td></tr><tr><td>长方形周长 / 面积</td><td>C=2(a+b) / S=ab</td><td>周长与面积单位不同</td></tr><tr><td>正方形周长 / 面积</td><td>C=4a / S=a²</td><td>a²不是2a</td></tr><tr><td>相同的量相加</td><td>3x+5x=8x</td><td>3a+5b不能这样合</td></tr><tr><td>分配律</td><td>(a+b)c=ac+bc</td><td>c要乘给两项</td></tr><tr><td>相向合走</td><td>(v₁+v₂)t</td><td>共同时间相同</td></tr><tr><td>例4拼桌</td><td>n=2m+2</td><td>复习题另一摆法为4m+2</td></tr><tr><td>竖叠方块接地</td><td>F=4n+1</td><td>接地和相贴面不算</td></tr><tr><td>课本第n组棋子</td><td>总数(n+1)(n+2)<br>黑棋(n+1)(n+2)÷2</td><td>第1组是2行3列</td></tr><tr><td>n边形对角线</td><td>一顶点n−3<br>全部n(n−3)÷2</td><td>全数时每条数了两次</td></tr><tr><td>温度换算</td><td>f=1.8c+32<br>c=(f−32)÷1.8</td><td>反向顺序也要反过来</td></tr></table><div class="teach"><h3>等式的性质</h3><p>若a=b，则a+c=b+c，a−c=b−c，ac=bc；当c≠0时，a÷c=b÷c。</p></div><p class="pitfall">每道应用题都问自己：字母指什么？先求什么量？这个值能不能在情境里成立？代入一个简单数，图、式子和题意能对应吗？</p><button onclick="window.print()">打印当前速查页</button></article>`;}
function exportRecord(){const lines=['第五单元｜用字母表示数和数量关系','导出时间：'+new Date().toLocaleString('zh-CN'),'', '一、自评会讲的主题（自己勾选）',...LESSONS.filter(l=>state.done[l.id]).map(l=>l.title),'','二、答题记录'];for(const q of QUESTIONS){const r=answer(q);if(!r.attempts&&!r.viewed&&!r.hinted&&!String(r.value??''))continue;lines.push(q.id.toUpperCase()+' '+q.prompt,'作答：'+(q.type==='choice'?(Number.isInteger(r.value)?q.options[r.value]:'未选'):r.value||'未填'),'状态：'+(r.checked&&r.correct?'最近一次答对':r.wrong?'仍待订正':'尚未检查')+'；检查'+(r.attempts||0)+'次'+(r.viewed?'；看过解析':'')+(r.hinted?'；用过提示':''),'参考答案：'+answerText(q)+(q.unit||''),'解析：'+q.solution,'');}lines.push('三、学习笔记',state.notes||'暂无');const b=new Blob([lines.join('\n')],{type:'text/plain;charset=utf-8'}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download='第五单元_学习记录.txt';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),1000);}
render();
