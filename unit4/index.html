p:wrap}.controlrow button{font-size:12px;padding:7px 11px}.primary{background:var(--green);border-color:var(--green);color:white}.primary:hover{background:#194c48;color:white}.playback{display:grid;grid-template-columns:auto auto 1fr;gap:10px;align-items:center;margin:15px 0 5px}.playback button{font-size:13px;padding:8px 11px}.playback label{font-size:12px;color:var(--muted)}.caption{font-size:14px;background:#f1f6f0;color:#456154;border-radius:10px;padding:11px 14px;min-height:47px;margin:10px 0}.pitfall{font-size:14px;padding:13px 15px;border:1px solid #e6d7bf;background:#fff9ef;border-radius:11px;margin-top:18px;color:#865d31}.nextbar{display:flex;justify-content:space-between;gap:8px;align-items:center;margin-top:20px}.nextbar button{font-size:13px}.learnmark{font-size:13px;display:flex;gap:7px;align-items:center}.footer{font-size:12px;color:var(--muted);margin-top:16px}.notice{font-size:13px;color:#98602a}.notice:empty{display:none}.quizbox{border:1px solid var(--line);border-radius:12px;padding:18px;margin-top:20px}.quizbox h3{font-size:16px;margin:0 0 10px}.qprompt{font-size:17px;line-height:1.9;margin:8px 0 14px}.options{display:grid;gap:8px}.option{text-align:left;font-size:14px;line-height:1.6}.option.selected{border-color:var(--green);background:#eaf3ed}.answerrow{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.answerrow input{width:170px;max-width:100%}.answerrow span{font-size:13px;color:var(--muted)}.qactions{display:flex;gap:8px;flex-wrap:wrap;margin-top:13px}.qactions button{font-size:13px}.feedback{padding:12px 14px;border-radius:10px;font-size:14px;margin:12px 0 0}.feedback:empty{display:none}.good{background:#eaf4e9;color:#285c38}.retry{background:#fff1df;color:#8e5d27}.solution{margin-top:12px;background:#fffaf0;border:1px solid #e8dabf;border-radius:10px;padding:14px;font-size:14px}.draw-layout{display:grid;grid-template-columns:minmax(0,1fr) 200px;gap:18px}.drawtools{display:grid;gap:10px;align-self:start}#drawboard.zoomed{overflow-x:a </style></head><body><div class="wrap"><header><div><div class="eyebrow">MATH IN MOTION / 五年级上册</div><h1>会动的数学课堂</h1><p>第四单元 · 图形的运动 · 对照课本第39—54页</p></div><div class="tools"><button onclick="go('draw')">方格作图</button><button onclick="go('quiz')">全章练习</button><button onclick="exportRecord()">导出学习记录</button></div></header><p id="storageNotice" class="notice" role="status"></p><div class="layout"><aside class="sidebar"><h2>跟着课本一步一步学</h2><nav class="navlist" id="nav" aria-label="单元目录"></nav><div class="navgroup" id="activities"></div><div class="stats" id="stats"></div></aside><main id="main"></main></div><p class="footer">依据已上传的新版人教版数学课本第39—54页制作。动画为教学重绘；方格作图和全章练习为对应知识点的原创练习，并非逐题复刻。记录保存在当前浏览器，不会自动跨设备同步。</p></div><script>
const LESSONS=[
{id:'overview',title:'先认识三种变化',page:'P39、P52',scene:'overview',intro:'同一个图形，可以搬动、翻折，也可以绕着一个点转动。先观察变化方式，再判断名称。',steps:[['先看原图','蓝色虚线是原图。记住它的形状、大小和朝向。'],['选择一种变化','试试“平移、轴对称、旋转”，拖动下面的进度条，或者点播放。'],['看完成后的图形','三种变化都保持图形的形状和大小。平移不转向；轴对称像照镜子；旋转绕一个中心转。'],['说出判断依据','不要只看它最后到了哪里。要说清它怎样从原位置到达新位置。']],pitfall:'图形换了位置，不一定是平移，还要看方向有没有转动、是不是翻折。',quiz:'q01'},
{id:'axis',title:'轴对称：等距与垂直',page:'P39',scene:'axis',intro:'沿一条直线对折，直线两旁的部分能够完全重合，就是轴对称。对应点有哪些规律？',steps:[['找对称轴','橙色虚线是对称轴。在原图上选一个关键点A，找它在另一侧的对应点A′。'],['数垂直距离','从A向对称轴垂直数格；A′也要在另一侧离轴同样远。数的是到轴的距离，不是到图形边缘的距离。'],['观察翻折','点播放，看纸片沿轴翻折的示意。侧立时投影会变窄；比较翻折前与完成后的图形，大小没有改变。'],['检查对应点','A和A′的连线与对称轴垂直，两个点到轴的距离相等。轴上的点与自己的对应点重合。']],pitfall:'只做到“离轴一样远”还不够，对应点还必须沿垂直于对称轴的方向对应。',quiz:'q02'},
{id:'complete',title:'补全轴对称图形',page:'P40、P44、P54',scene:'complete',intro:'先找关键点，再找每个点的对应点，最后依次连线。斜着的对称轴也遵守同样的规则。',steps:[['找关键点','关注折线的拐点和落在对称轴上的点。按A、B、C……的顺序记住它们。'],['逐点找另一半','对应点位于轴的另一侧，垂直距离相等。轴上的点不需要移动。可切换竖轴、横轴和斜轴观察。'],['依次连线','点的位置找对后，要按原来的连接顺序连起来，不能任意交叉连接。'],['对折检验','对照原图想象翻折，两边应完全重合。到“方格作图”中独立补全。']],pitfall:'斜轴题不能仍然只按同一横行数格。要沿与斜轴垂直的方向找对应点。',quiz:'q03'},
{id:'translate',title:'平移：同向、同距离',page:'P41',scene:'translate',intro:'平移像把图形整块搬家，每个点沿同一个方向移动相同距离。',steps:[['选一对对应点','蓝色是原图，绿色是移动后的图。先盯住A和A′。'],['数移动了几格','数A到A′之间经过的小格，不是数图形之间空着的格数。可改变方向和格数。'],['检查其他点','B、C等点都必须沿同一个方向移动相同格数。不能只移动一个顶点。'],['比较前后','平移后形状、大小和朝向不变；对应线段相互平行且长度相等。']],pitfall:'图形间的空隙不是移动距离；要选同一个顶点的前后位置来数格。',quiz:'q04'},
{id:'translate-draw',title:'画平移图与连续平移',page:'P41—42、P53',scene:'translate-draw',intro:'画平移图时，先移动几个关键点，再按原来的顺序连线。两次平移要按顺序逐步完成。',steps:[['先读方向与距离','本图演示先向右平移6格，再向下平移3格。先用手指出两次方向。'],['完成第一次移动','先找到A向右6格的位置，再移动其他顶点。第一次移动完成后得到橙色虚线图。'],['从新图开始第二次','第二次要从第一次的结果出发，继续向下3格，而不是又回到原图开始。'],['检查每个顶点','每个对应点最终都向右6格、向下3格，图形不能变形。']],pitfall:'“先右移，再下移”是沿两段路径移动，不能把6＋3直接当作某个方向的9格。',quiz:'q05'},
{id:'area',title:'平移割补：曲边变长方形',page:'P43 例5重绘',scene:'area',intro:'课本这个图形一边凸、一边凹。把凸出的部分剪下来，平移到同样大小的凹口，面积就容易求了。',steps:[['看凸出与凹进部分','两块半圆的大小相同。先比较原图与凹口，想一想能不能正好补上。'],['剪下并平移','橙色部分从左侧移到右侧。动画中的搬运过程不用于计算面积，比较搬运前和最终无重叠的拼合结果。'],['拼成规则图形','完成后得到长6格、宽4格的长方形。每小格边长1厘米。'],['列式并解释','面积＝6×4＝24平方厘米。没有增加或丢掉材料，也没有在最终拼合处重叠，所以面积不变。']],pitfall:'这里先用割补把形状变简单，不需要先学圆面积公式。',quiz:'q06'},
{id:'perimeter',title:'平移边线：阶梯图的周长',page:'P45 第6题方法变式',scene:'perimeter',intro:'把阶梯上的横边和竖边分别整理，观察总长度。这里移动的是边线，用来比较周长。',steps:[['把边分成横边与竖边','先看闭合边界。阶梯上的横边一共跨过8格，竖边一共落下5格。'],['分别整理边线','把横边向上对齐，把竖边向右对齐。每一小段边线都只平移，长度不变。'],['看总长度','所有横边总长为8＋8，所有竖边总长为5＋5。每格边长1厘米。'],['区别周长与面积','周长＝（8＋5）×2＝26厘米。边线整理后围出的长方形面积，并不等于原阶梯图面积。']],pitfall:'本例阶梯沿一个方向逐级前进，没有回头边；不能把所有带缺口的图形都直接按外框长方形算周长。',quiz:'q07'},
{id:'clock',title:'旋转：方向与角度',page:'P46',scene:'clock',intro:'钟面是认识旋转方向和角度的好工具。指针绕中心O转动，中心始终不动。',steps:[['先确定旋转中心','指针绕钟面中心O转，不能把针尖当作旋转中心。'],['判断顺、逆时针','顺时针与钟面数字增大的方向一致；逆时针反过来。切换方向，看针尖经过的路线。'],['把大格换成角度','钟面一周360°，12个相等大格，每大格30°。可以选择30°、60°、90°或更大的角度。'],['说完整一句话','例如：指针从12出发，绕点O按顺时针方向旋转90°，指向3。中心、方向、角度都要说。']],pitfall:'12到3顺时针是90°，逆时针则要转270°。只看起点与终点，方向不同角度也可能不同。',quiz:'q08'},
{id:'rotate',title:'画旋转后的图形',page:'P46—47、P49',scene:'rotate',intro:'旋转图形也要先找关键点。每个点都绕同一个中心，按同一方向转过相同角度。',steps:[['确定三个要素','先确定旋转中心、方向、角度。可在下面切换中心O或A，比较结果。'],['先转一条关键边','先看从中心出发的一条线段。旋转90°后，两条对应位置的线段互相垂直，长度相等。'],['再转其他点并连线','其他顶点也绕同一中心转相同角度。对应点与中心的距离保持不变，再按原顺序连线。'],['检查中心是否固定','旋转中心不动，图形形状和大小不变。换中心，即使方向、角度相同，也通常会得到不同位置。']],pitfall:'不能只把图形转个朝向，却把旋转中心一起搬走。',quiz:'q09'},
{id:'combine',title:'拼图：两种运动怎样配合',page:'P48、P50、P53',scene:'combine',intro:'拼图常常既要改变位置，又要改变朝向。平移和旋转可以配合，但操作顺序、中心和距离要说明白。',steps:[['分清需要改什么','平移改变位置；旋转可以改变朝向。先选一种操作顺序。'],['看第一步的结果','本例平移固定为向右3格，旋转固定为绕图上的O顺时针90°。先观察第一步得到的虚线图。'],['接着完成第二步','第二步从第一步的结果继续。试着切换顺序，比较最终位置。'],['理解顺序的影响','本例固定同一个O、同一个右移距离时，交换顺序结果不同。两种顺序都能用于实际拼图，但参数可能要重新确定。']],pitfall:'不能把“可以先平移再旋转”理解为“不改任何条件就能任意交换顺序”。',quiz:'q10'},
{id:'design',title:'设计自己的花纹',page:'P51、P53',scene:'design',intro:'选择一个基本图形，用平移、轴对称或旋转生成花纹。观察每一个副本来自哪一次运动。',steps:[['选一个基本图形','基本图形用深绿色描边。其他颜色是由它经过运动得到的副本。'],['确定运动规则','选择平移花边、对称花纹或旋转图案。先预测接下来会出现在哪里。'],['播放并观察','旋转图案中的每个副本都由同一个基本图形绕同一个中心得到。可改变副本总数、配色和基本图形。'],['保存并说明设计','可以下载SVG图案。向老师说明：用了什么运动，中心或对称轴在哪里，怎样得到其他部分。']],pitfall:'花纹看起来相似，不代表过程相同。设计后还要能说出具体的运动规则。',quiz:'q11'},

const Geometry=(()=>{
 const tidy=v=>Math.abs(v-Math.round(v))<1e-9?Math.round(v):v;
 const point=p=>p.map(tidy);
 const axes={vertical:{a:1,b:0,c:-8},horizontal:{a:0,b:1,c:-6},diagonal:{a:1,b:1,c:-12}};
 function axisInfo(axis){return typeof axis==='string'?axes[axis]:axis;}
 function project(p,axis){const {a,b,c}=axisInfo(axis),k=(a*p[0]+b*p[1]+c)/(a*a+b*b);return point([p[0]-a*k,p[1]-b*k]);}
 function reflect(p,axis){const h=project(p,axis);return point([2*h[0]-p[0],2*h[1]-p[1]]);}
 function translate(p,d){return point([p[0]+d[0],p[1]+d[1]]);}
 function rotate(p,o,degrees){const a=degrees*Math.PI/180,x=p[0]-o[0],y=p[1]-o[1];return point([o[0]+x*Math.cos(a)-y*Math.sin(a),o[1]+x*Math.sin(a)+y*Math.cos(a)]);}
 function mix(a,b,t){return[a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t];}

function renderBoard(){if(state.view!=='lesson')return;const model=sceneModel(lesson().scene);lastSVG=wrapSVG(model.body,lesson().title+'。'+model.caption,model.gridOn);el('board').innerHTML=lastSVG;el('caption').textContent=model.caption;el('pct').textContent=Math.round(t*100)+'%';el('timeline').value=Math.round(t*100);}

function quizHTML(q,inline=false){const r=qr(q.id);return '<section class="quizbox"><h3>'+(inline?'停一下，自己想一题':'独立练习')+' <span class="small">'+q.topic+'</span></h3><p class="qprompt">'+esc(q.text)+'</p>'+(q.options?'<div class="options">'+q.options.map((s,i)=>'<button class="option '+(r.answer===i?'selected':'')+'" onclick="chooseAnswer(\''+q.id+'\','+i+')" aria-pressed="'+(r.answer===i)+'">'+String.fromCharCode(65+i)+'．'+s+'</button>').join('')+'</div>':'<div class="answerrow"><label class="small" for="q-'+q.id+'">我的答案</label><input id="q-'+q.id+'" type="text" inputmode="decimal" value="'+esc(r.answer??'')+'" oninput="writeAnswer(\''+q.id+'\',this.value)" onkeydown="if(event.key===\'Enter\')checkQuiz(\''+q.id+'\')"><span>'+q.unit+'</span></div>')+'<div class="qactions"><button class="primary" onclick="checkQuiz(\''+q.id+'\')">核对答案</button><button onclick="revealQuiz(\''+q.id+'\')">'+(r.open?'收起解析':'查看解析')+'</button></div><div id="feedback-'+q.id+'" class="feedback '+(r.correct?'good':'retry')+'" role="status" aria-live="polite">'+(r.checked?(r.correct?'核对通过。'+(r.viewed?'这题看过解析，建议稍后独立再做。':'再用自己的话讲讲理由。'):'再想一想，检查题目中的条件和问法。'):'')+'</div>'+(r.open?'<div class="solution"><strong>答案：</strong>'+(q.options?q.options[q.answer]:q.value+q.unit)+'<br>'+q.why+'</div>':'')+'</section>';}
function redrawQuiz(){stop();if(state.view==='lesson')renderLesson();else renderQuiz();renderNav();}
function chooseAnswer(id,index){const r=qr(id);r.answer=index;r.correct=false;r.checked=false;save();redrawQuiz();}
function writeAnswer(id,value){const r=qr(id);r.answer=value;r.correct=false;r.checked=false;save();const f=el('feedback-'+id);if(f)f.textContent='';renderNav();}
function numberValue(v){const s=String(v??'').normalize('NFKC').trim();return /^[+-]?(?:\d+(?:\.\d*)?|\.\d+)$/.test(s)?Number(s):NaN;}
function checkQuiz(id){const q=QUIZZES.find(x=>x.id===id),r=qr(id);r.correct=q.options?r.answer===q.answer:Number.isFinite(numberValue(r.answer))&&Math.abs(numberValue(r.answer)-q.value)<1e-8;r.checked=true;save();redrawQuiz();}
function revealQuiz(id){const r=qr(id);r.open=!r.open;if(r.open)r.viewed=true;save();redrawQuiz();}
function quizIndices(){return QUIZZES.map((q,i)=>i).filter(i=>(state.quizFilter==='all'||QUIZZES[i].topic===state.quizFilter)&&(!state.quizOnlyWrong||qr(QUIZZES[i].id).checked&&!qr(QUIZZES[i].id).correct));}
function renderQuiz(){const ids=quizIndices();if(!ids.includes(state.quizIndex))state.quizIndex=ids[0]??-1;const q=QUIZZES[state.quizIndex],topics=[...new Set(QUIZZES.map(q=>q.topic))],pos=ids.indexOf(state.quizIndex);el('main').innerHTML='<article class="card"><div class="source">独立练习 · 原创题目</div><h2>全章练习</h2><p class="intro">先独立判断或计算，再核对。动画看懂后，试试能不能把规律用到新的问法里。</p><div class="topicselect"><label for="quizTopic">按知识点筛选</label><select id="quizTopic" onchange="filterQuiz(this.value)">'+options([['all','全部知识点'],...topics.map(x=>[x,x])],state.quizFilter)+'</select><label class="checks"><input type="checkbox" '+(state.quizOnlyWrong?'checked':'')+' onchange="filterWrong(this.checked)">只看待订正题</label></div><div class="tasklist">'+ids.map((i,p)=>'<button class="'+(i===state.quizIndex?'active ':'')+(qr(QUIZZES[i].id).correct?'passed':'')+'" onclick="selectQuiz('+i+')">'+(i+1)+'</button>').join('')+'</div>'+(q?'<div class="qcounter">第'+(state.quizIndex+1)+'题 · 当前筛选 '+(pos+1)+'/'+ids.length+'</div>'+quizHTML(q)+'<div class="nextbar"><button onclick="moveQuiz(-1)" '+(pos<=0?'disabled':'')+'>← 上一题</button><button onclick="moveQuiz(1)" '+(pos===ids.length-1?'disabled':'')+'>下一题 →</button></div>':'<div class="empty">当前筛选没有题目。可以取消“只看待订正题”继续练习。</div>')+'</article>';}
function filterQuiz(v){state.quizFilter=v;renderQuiz();save();}
function filterWrong(v){state.quizOnlyWrong=v;renderQuiz();save();}
function selectQuiz(i){state.quizIndex=i;renderQuiz();save();}
function moveQuiz(d){const ids=quizIndices(),p=ids.indexOf(state.quizIndex);if(ids[p+d]!==undefined)selectQuiz(ids[p+d]);}

function renderDraw(){const task=DRAW_TASKS[state.task],r=dr();activePoint=Math.max(0,Math.min(2,activePoint));el('main').innerHTML='<article class="card"><div class="source">方格作图 · 原创方法变式 · '+task.page+'</div><h2>自己画出来，才算会用</h2><p class="intro">按A′、B′、C′的顺序，点网格交点放置顶点；也可以先选点名，再改位置。每小格边长为1个单位。</p><div class="tasklist">'+DRAW_TASKS.map((d,i)=>'<button class="'+(i===state.task?'active ':'')+(state.draw[d.id]?.correct?'passed':'')+'" onclick="selectTask('+i+')">'+(i+1)+'</button>').join('')+'</div><h3>'+task.title+'</h3><p class="instruction">'+task.instruction+'</p><div class="draw-layout"><div><div class="board '+(state.drawZoom?'zoomed':'')+'" id="drawboard"></div><p class="small">蓝色虚线：原图；绿色：你放的顶点。键盘操作：先聚焦方格纸，用方向键移动十字光标，按回车落点。</p></div><div class="drawtools"><div><div class="pointbuttons">'+task.labels.map((n,i)=>'<button class="'+(i===activePoint?'active':'')+'" onclick="selectPoint('+i+')">'+n+'′'+(r.points[i]?' ✓':'')+'</button>').join('')+'</div><p class="small">当前放置：'+task.labels[activePoint]+'′</p></div><button class="primary" onclick="checkDraw()">核对作图</button><label class="checks"><input type="checkbox" '+(state.drawZoom?'checked':'')+' onchange="setDrawZoom(this.checked)">放大方格纸，可左右滑动</label><button onclick="undoPoint()">撤回最后一个顶点</button><button onclick="clearDrawing()">清空本题顶点</button><button onclick="hintDraw()">'+(r.hints?'再看一步提示':'先看一点提示')+'</button><button onclick="revealDrawing()">'+(r.open?'收起参考图':'查看参考图与方法')+'</button></div></div><div class="feedback '+(r.correct?'good':'retry')+'" role="status">'+drawFeedback(task,r)+'</div>'+(r.hints?'<div class="solution">'+drawHint(task,r.hints)+'</div>':'')+(r.open?'<div class="solution"><strong>参考方法：</strong>'+drawExplanation(task)+'<br>橙色虚线是参考结果。先核对每个点，再按原图顺序连接。</div>':'')+'<div class="nextbar"><button onclick="selectTask('+(state.task-1)+')" '+(state.task===0?'disabled':'')+'>← 上一题</button><span class="qcounter">'+(state.task+1)+' / '+DRAW_TASKS.length+'</span><button onclick="selectTask('+(state.task+1)+')" '+(state.task===DRAW_TASKS.length-1?'disabled':'')+'>下一题 →</button></div></article>';renderDrawBoard();}
function renderDrawBoard(focus=false){const task=DRAW_TASKS[state.task],r=dr(),expected=G.expected(task);let body='';if(task.axis)body+=axisLine(task.axis);body+=poly(task.points,COLORS.blue,false,true);task.points.forEach((p,i)=>body+=dot(p,task.labels[i]+(task.center&&G.same(p,task.center)?'=O':''),COLORS.blue));if(task.center&&!task.points.some(p=>G.same(p,task.center)))body+=dot(task.center,'O',COLORS.orange);if(r.hints&&task.axis){const h=G.project(task.points[0],task.axis);body+=line(task.points[0],h,COLORS.orange,2,true)+dot(h,'',COLORS.orange);}if(r.open||r.hints>=2)body+=poly(expected,COLORS.orange,false,true)+expected.map((p,i)=>dot(p,task.labels[i]+'′参考',COLORS.orange)).join('');const placed=r.points.filter(p=>Array.isArray(p));if(placed.length===3)body+=poly(r.points);else if(placed.length===2)body+=line(placed[0],placed[1],COLORS.green,2);r.points.forEach((p,i)=>{if(Array.isArray(p))body+=dot(p,task.labels[i]+'′',COLORS.green);});body+=line([cursor[0]-.22,cursor[1]],[cursor[0]+.22,cursor[1]],'#3d5750',1.4)+line([cursor[0],cursor[1]-.22],[cursor[0],cursor[1]+.22],'#3d5750',1.4);el('drawboard').innerHTML=wrapSVG(body,'可操作方格纸。'+task.instruction,true,true);if(focus)focusBoard();}
function focusBoard(){const svg=el('drawboard').querySelector('svg');if(svg&&svg.focus)svg.focus();}
function setDrawZoom(v){state.drawZoom=v;save();renderDraw();}
function selectTask(i){if(i<0||i>=DRAW_TASKS.length)return;stop();state.task=i;state.view='draw';activePoint=0;cursor=[8,6];render();save();}
function selectPoint(i){activePoint=i;renderDraw();}
function placePoint(p,focus=false){const r=dr();r.points[activePoint]=[Math.max(0,Math.min(16,Math.round(p[0]))),Math.max(0,Math.min(12,Math.round(p[1])))];r.correct=false;r.checked=false;r.bad=[];if(activePoint<2)activePoint++;save();renderDraw();renderNav();if(focus)focusBoard();}
function boardClick(event){const rect=event.currentTarget.getBoundingClientRect(),x=(event.clientX-rect.left)/rect.width*W,y=(event.clientY-rect.top)/rect.height*H;if(x<MX-8||x>sx(16)+8||y<MY-8||y>sy(12)+8)return;cursor=[Math.round((x-MX)/S),Math.round((y-MY)/S)];placePoint(cursor);}
function boardKey(event){const d={ArrowLeft:[-1,0],ArrowRight:[1,0],ArrowUp:[0,-1],ArrowDown:[0,1]}[event.key];if(d){event.preventDefault();cursor=[Math.max(0,Math.min(16,cursor[0]+d[0])),Math.max(0,Math.min(12,cursor[1]+d[1]))];renderDrawBoard(true);}else if(event.key==='Enter'||event.key===' '){event.preventDefault();placePoint(cursor,true);}}
function undoPoint(){const r=dr();for(let i=2;i>=0;i--)if(r.points[i]){r.points[i]=null;activePoint=i;break;}r.checked=false;r.correct=false;save();renderDraw();renderNav();}
function clearDrawing(){const r=dr();r.points=[null,null,null];r.checked=false;r.correct=false;activePoint=0;save();renderDraw();renderNav();}
function checkDraw(){const task=DRAW_TASKS[state.task],r=dr(),ans=G.expected(task);r.bad=ans.map((p,i)=>!G.same(p,r.points[i])?i:-1).filter(i=>i>=0);r.correct=r.bad.length===0;r.checked=true;save();renderDraw();renderNav();}
function drawFeedback(task,r){if(!r.checked)return '';return r.correct?'三个对应点都正确。'+(r.viewed||r.hints?'这题使用了提示或参考图，建议之后独立再画一次。':'再说明：各点的位置是怎样找出来的？'):'请检查 '+r.bad.map(i=>task.labels[i]+'′').join('、')+'。注意对应点顺序、对称轴或旋转中心。';}
function drawHint(task,n){return n>=2?'橙色虚线已显示参考位置，请逐点比较。之后可以清空顶点，独立再试一次。':task.type.includes('reflect')?'先从A向对称轴作垂线，量清到轴距离。若还有平移，要在对称结果上继续移动。':task.type==='rotate'?'先圈出旋转中心。把中心到A的线段按规定方向转动，长度保持不变。':'先只盯住A，按题目方向数移动格数。其他点也必须移动同样的距离。';}
function drawExplanation(task){if(task.type==='reflect')return'先找各顶点到轴的垂直距离，在另一侧找等距对应点。';if(task.type==='reflect-translate')return'先逐点作轴对称，再从各对应点向左4格、向下2格。';if(task.type==='rotate')return'绕指定O'+(task.angle>0?'顺时针':'逆时针')+'旋转'+Math.abs(task.angle)+'°，各点到O的距离不变，中心上的点不动。';return'每一个顶点都按同一个移动规则移动：'+(task.delta[0]?'向'+(task.delta[0]>0?'右':'左')+Math.abs(task.delta[0])+'格':'')+(task.delta[0]&&task.delta[1]?'，再':'')+(task.delta[1]?'向'+(task.delta[1]>0?'下':'上')+Math.abs(task.delta[1])+'格':'')+'。';}
function hintDraw(){const r=dr();r.hints=Math.min(2,(r.hints||0)+1);save();renderDraw();}
function revealDrawing(){const r=dr();r.open=!r.open;if(r.open)r.viewed=true;save();renderDraw();}

function renderRecord(){const qwrong=QUIZZES.filter(q=>qr(q.id).checked&&!qr(q.id).correct),dwrong=DRAW_TASKS.filter(d=>state.draw[d.id]?.checked&&!state.draw[d.id].correct);el('main').innerHTML='<article class="card"><div class="source">学习复盘</div><h2>把还不熟的地方找出来</h2><p class="intro">“看懂动画”“能独立作图”“能解释理由”是不同的进步。课程勾选是自评，练习通过只说明当前答案核对正确。</p><table class="summarytable"><tr><th>变化</th><th>抓住什么</th><th>哪些量不变</th></tr><tr><td>轴对称</td><td>对应点连线垂直于轴，到轴等距</td><td>形状、大小；轴上的点不动</td></tr><tr><td>平移</td><td>每个点同方向、同距离</td><td>形状、大小、朝向</td></tr><tr><td>旋转</td><td>同一中心、方向、角度</td><td>形状、大小；点到中心距离不变</td></tr></table><h3>当前待订正</h3><div class="record-list">'+qwrong.map(q=>'<div class="record-row"><span>练习：'+esc(q.text)+'</span><button onclick="openQuiz(\''+q.id+'\')">再做一次</button></div>').join('')+dwrong.map(d=>'<div class="record-row"><span>作图：'+d.title+'</span><button onclick="selectTask('+DRAW_TASKS.indexOf(d)+')">再画一次</button></div>').join('')+(!qwrong.length&&!dwrong.length?'<p class="small">目前没有待订正记录。尚未作答的题目仍可从目录进入。</p>':'')+'</div><h3>我的疑问与收获</h3><textarea placeholder="例如：旋转中心变了，我还容易找错点……" oninput="state.notes=this.value;save()">'+esc(state.notes||'')+'</textarea><div class="qactions"><button onclick="exportRecord()">导出全部学习记录</button><button onclick="go(\'draw\')">进入方格作图</button></div></article>';}
function openQuiz(id){state.view='quiz';state.quizFilter='all';state.quizOnlyWrong=false;state.quizIndex=QUIZZES.findIndex(q=>q.id===id);render();save();}
function downloadBlob(text,type,name){const url=URL.createObjectURL(new Blob([text],{type})),a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);}
function downloadDesign(){downloadBlob(lastSVG,'image/svg+xml;charset=utf-8','图形的运动_我的图案.svg');}
function exportRecord(){let s='第四单元 图形的运动｜学习记录\n导出时间：'+new Date().toLocaleString('zh-CN',{timeZone:'Asia/Shanghai'})+'（北京时间）\n\n课程自评\n'+LESSONS.map(l=>l.title+'：'+(state.done[l.id]?'自评能说明':'尚未勾选')).join('\n')+'\n\n方格作图\n'+DRAW_TASKS.map(d=>{const r=state.draw[d.id]||{};return d.title+'：'+(r.checked?(r.correct?'通过':'待订正'):'未核对')+'；使用提示'+(r.hints||0)+'步；看过参考图：'+(r.viewed?'是':'否');}).join('\n')+'\n\n全章练习\n'+QUIZZES.map(q=>{const r=qr(q.id);return q.text+'\n我的答案：'+(q.options?(q.options[r.answer]??'未作答'):(r.answer??'未作答'))+'；'+(r.checked?(r.correct?'通过':'待订正'):'未核对')+'；看过解析：'+(r.viewed?'是':'否');}).join('\n\n')+'\n\n疑问与收获\n'+(state.notes||'未填写');downloadBlob(s,'text/plain;charset=utf-8','图形的运动_学习记录.txt');}
document.addEventListener('visibilitychange',()=>{if(document.hidden)stop();});
render();save();

</script></body></html>
