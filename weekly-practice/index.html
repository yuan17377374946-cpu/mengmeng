<div class="wrap"><header><div><div class="eyebrow">DECIMAL DIVISION / 应用与拓展</div><h1>把题目想明白</h1><p>小数除法 · 5组练习 · 25道题，所有题目均可自由选择</p></div><div class="tools"><button onclick="printSheet(false)">打印题目</button><button onclick="printSheet(true)">打印答案</button><button onclick="exportRecords()">导出学习记录</button></div></header>

<div class="layout"><aside class="sidebar" aria-label="练习目录"><h2>选择练习</h2><div class="daylist" id="days"></div><div class="numbers" id="numbers"></div><label class="filter"><input type="checkbox" id="reviewOnly" onchange="toggleFilter(this.checked)">只看标记的再练题</label><div class="legend">绿点：数值核对通过　金框：需要再练</div></aside><main id="main"></main></div><p class="footnote">根据同步练习册题型设计的原创情景练习。记录保存在当前浏览器；更换设备不会自动同步。数值通过后，还要能说清数量关系。</p></div><div id="printarea"></div>
<script>
const QUESTIONS=[{"title":"种子称重记录","text":"科普小组称量一包种子，质量用千克记录。抄写时，小数点误向右移动了一位，记录值比正确值大24.75千克。这包种子的正确质量是多少千克？请说明思考过程。","fields":[["正确质量",2.75,"千克"]],"hints":["小数点向右移动一位，记录值是正确值的几倍？","正确值看成1份，记录值就是10份。相差的24.75千克对应几份？"],"diagram":[1,10,"正确值","记录值"],"steps":["小数点向右移动一位，相当于扩大到原来的10倍。","差对应10－1＝9份，24.75÷9＝2.75（千克）。","检验：2.75×10－2.75＝24.75（千克）。"],"trap":"24.75是两数的差，不能直接除以10。"},{"title":"两张数字卡","text":"一张卡写着原数，另一张卡写着把原数的小数点向右移动一位后的数。两个数相加是26.4。原数是多少？","fields":[["原数",2.4,""]],"hints":["先判断：26.4表示两数的和，还是两数的差？","原数1份，新数10份，两数之和共11份。"],"diagram":[1,10,"原数","新数"],"steps":["把原数看成1份，另一个数就是10份。","总份数：1＋10＝11；原数：26.4÷11＝2.4。","检验：2.4＋24＝26.4。"],"trap":"这一题给的是和，应除以11，不能照搬差倍题的除以9。"},{"title":"机器人测量记录","text":"记录机器人一段行程时，长度记录中的小数点误向左移动了一位，错误记录比实际长度小2.61米。实际长度是多少米？","fields":[["实际长度",2.9,"米"]],"hints":["向左移动一位，错误记录缩小到实际长度的十分之一。可以把较小的错误记录看成1份。","错误记录1份，实际长度10份，差2.61米对应9份。求出1份后还要做什么？"],"diagram":[1,10,"错误记录","实际长度"],"steps":["错误记录：2.61÷（10－1）＝0.29（米）。","实际长度：0.29×10＝2.9（米）。","也可列式2.61÷0.9＝2.9（米）。检验：2.9－0.29＝2.61（米）。"],"trap":"0.29米是错误记录，题目问的是实际长度，还要乘10。"},{"title":"巡护艇相遇","text":"两艘巡护艇沿一段笔直河道，从相距14.7千米的两端同时相向出发，0.7小时后相遇。甲艇的实际航行速度为9.5千米/时。乙艇的实际航行速度是多少？","fields":[["乙艇速度",11.5,"千米/时"]],"hints":["相遇前，两艇行驶的路程相加正好是多少？两艇的航行时间相同吗？","总路程÷共同时间，得到两艇的速度和，再减去甲艇速度。"],"steps":["速度和：14.7÷0.7＝21（千米/时）。","乙艇速度：21－9.5＝11.5（千米/时）。","也可先算甲艇路程9.5×0.7＝6.65千米，再算（14.7－6.65）÷0.7＝11.5（千米/时）。"],"trap":"21千米/时是两艇的速度和，不是乙艇速度。分别算路程的方法同样正确。"},{"title":"加数的小数点移错","text":"统计两个小组的活动积分时，把其中一个小组积分的小数点向右移动了一位。错误的总积分是86.5，正确的总积分是31.6。这个小组实际有多少积分？","fields":[["实际积分",6.1,"积分"]],"hints":["另一个小组的积分没变。两个总数的差，来自哪一个小组？","先算总数多了多少，这个差相当于移错的小组实际积分的9倍。"],"steps":["总数多出：86.5－31.6＝54.9。","这个小组的实际积分：54.9÷9＝6.1。","另一组为31.6－6.1＝25.5，检验61＋25.5＝86.5。"],"trap":"只有一个加数扩大了10倍，不能把总积分整体除以10。"},{"title":"壮锦书签材料包","text":"非遗体验活动准备了大、小两种壮锦书签材料包，大包价格是小包的2倍。老师买了2个大包和1个小包，共付112.5元。大包、小包每个各多少钱？","fields":[["小包单价",22.5,"元"],["大包单价",45,"元"]],"hints":["以小包的价格为1份，一个大包就是2份。","两个大包共4份，再加一个小包，总共几份？"],"diagram":[1,2,"小包价格","大包价格"],"steps":["总份数：2×2＋1＝5。","小包：112.5÷5＝22.5（元）。","大包：22.5×2＝45（元）。检验45×2＋22.5＝112.5（元）。"],"trap":"买了3个包，但每个包价格不同，不能直接除以3。"},{"title":"科普材料包","text":"科普活动有基础包和增强包，增强包价格是基础包的3倍。购买3个基础包和2个增强包，共付148.5元。两种材料包每个各多少钱？","fields":[["基础包单价",16.5,"元"],["增强包单价",49.5,"元"]],"hints":["把基础包价格看成1份，增强包每个3份。","3个基础包对应3份，2个增强包对应6份，合起来是多少份？"],"steps":["总份数：3＋2×3＝9。","基础包：148.5÷9＝16.5（元）。","增强包：16.5×3＝49.5（元）。"],"trap":"5个包不等于5份价格；数量和价格份数要分开。"},{"title":"试验田收获","text":"校园两片试验田共收获46.8千克蔬菜。甲田的收获质量比乙田的1.5倍还多2.8千克。两片田分别收获多少千克蔬菜？","fields":[["乙田收获",17.6,"千克"],["甲田收获",29.2,"千克"]],"hints":["以乙田为1份，甲田是1.5份再加额外的2.8千克。","先从总量中减去额外的2.8千克，剩下的对应1＋1.5份。"],"diagram":[1,1.5,"乙田","甲田（另加2.8千克）"],"steps":["去掉额外部分：46.8－2.8＝44（千克）。","乙田：44÷（1＋1.5）＝17.6（千克）。","甲田：17.6×1.5＋2.8＝29.2（千克）。检验17.6＋29.2＝46.8。"],"trap":"要先减去额外的2.8千克，再按份数分。不能把全部46.8千克直接分成2.5份。"},{"title":"标本长度记录","text":"抄写叶片标本的长度时，小数点误向右移动了一位，错误记录比实际长度大53.1厘米。标本实际长多少厘米？两数之差相当于实际长度的几倍？","fields":[["实际长度",5.9,"厘米"],["差是实际长度的",9,"倍"]],"hints":["把实际长度看成1份，小数点右移后的记录是10份。","两数相差10－1份。"],"steps":["错误记录是实际长度的10倍。","两数之差是实际长度的10－1＝9倍。","实际长度：53.1÷9＝5.9（厘米）。"],"trap":"移位后是10倍，两数的差才是9倍。"},{"title":"科学展用电","text":"一次科学展两天共用电68.4千瓦时。第二天的用电量比第一天的1.4倍还多3.6千瓦时。第二天用了多少千瓦时电？","fields":[["第二天用电",41.4,"千瓦时"]],"hints":["第一天1份，第二天1.4份加3.6千瓦时。","先扣除额外用电3.6千瓦时，求第一天，再求第二天。"],"steps":["第一天：（68.4－3.6）÷（1＋1.4）＝27（千瓦时）。","第二天：68.4－27＝41.4（千瓦时）。","检验：27×1.4＋3.6＝41.4（千瓦时）。"],"trap":"算出的27是第一天用电，题目问第二天。"},{"title":"志愿者遮阳帽","text":"志愿者活动原计划买48顶遮阳帽，每顶18.5元。店家优惠后，每顶14.8元，准备的钱不变。现在比原计划可以多买多少顶？","fields":[["可以多买",12,"顶"]],"hints":["准备的钱不变。先根据原单价和原数量求总预算。","用总预算除以新单价得到新数量，最后与48顶比较。"],"steps":["总预算：18.5×48＝888（元）。","新数量：888÷14.8＝60（顶）。","多买：60－48＝12（顶）。"],"trap":"60顶是现在可以买的总数，求多买要减去原来的48顶。"},{"title":"科普纪念徽章","text":"科普展原计划以每枚8.4元的价格购买60枚纪念徽章。后来每枚降到7.2元，预算不变。现在可以多买多少枚？","fields":[["可以多买",10,"枚"]],"hints":["先求原计划一共准备多少钱。","预算÷7.2得到现在可买的总数，再减60。"],"steps":["预算：8.4×60＝504（元）。","现在可买：504÷7.2＝70（枚）。","多买：70－60＝10（枚）。"],"trap":"单价的差不能直接作为数量的变化。"},{"title":"黏土改做","text":"陶艺小组原计划用黏土制作18个模型，每个用0.08千克。后来把准备的全部黏土改做小摆件，每个用0.05千克，不计材料损耗。最多能做几个完整的小摆件？","fields":[["完整小摆件",28,"个"]],"hints":["模型换成摆件，准备的黏土总质量不变。","先求总质量，再除以每个摆件用量；最后结合“完整”判断余料是否够再做一个。"],"steps":["黏土总量：0.08×18＝1.44（千克）。","1.44÷0.05＝28.8，最多能做28个完整摆件。","余料：1.44－28×0.05＝0.04（千克），不够再做1个。"],"trap":"完整作品数量用去尾法，不能把28.8四舍五入成29。"},{"title":"科学角工具盒","text":"标准工具盒的价格是简装工具盒的2倍。科学角买了3个标准工具盒和2个简装工具盒，共付196元。两种工具盒每个各多少钱？","fields":[["简装单价",24.5,"元"],["标准单价",49,"元"]],"hints":["把简装盒价格看成1份。","3个标准盒相当于6份，再加2份简装盒。"],"steps":["总份数：3×2＋2＝8。","简装：196÷8＝24.5（元）。","标准：24.5×2＝49（元）。"],"trap":"总共5个盒子，但价格相当于8份简装盒。"},{"title":"比较栽培土价格","text":"同一种栽培土有两种包装。按每千克的价格比较，哪种更划算？每千克便宜多少元？结果保留两位小数。","table":[["包装","每袋质量","每袋售价"],["A款","2.4千克","22.8元"],["B款","3.5千克","32.9元"]],"choice":["A款","B款"],"correctChoice":"B款","fields":[["每千克便宜",0.1,"元"]],"hints":["袋子大小不同，不能只比较每袋售价。","分别用售价÷质量，求每千克单价，再比较。"],"steps":["A款：22.8÷2.4＝9.50（元/千克）。","B款：32.9÷3.5＝9.40（元/千克）。","B款更划算，每千克便宜9.50－9.40＝0.10（元）。"],"trap":"B款整袋售价更高，但每千克单价更低。0.1与0.10数值相同。"},{"title":"桌垫与防滑胶条","text":"手工小组有18.6米毡布，每块桌垫需要0.8米。（1）最多能做多少块完整桌垫？（2）每块桌垫还需0.6米防滑胶条，每卷胶条5米。为这些桌垫至少需要买几卷胶条？","fields":[["完整桌垫",23,"块"],["至少买胶条",3,"卷"]],"hints":["先求能做出的完整桌垫块数，剩下的毡布不够一块就留下。","只给实际做出的桌垫配胶条。胶条按整卷买，不够一卷的部分也要买一卷。"],"steps":["18.6÷0.8＝23.25，去尾得23块。","胶条总长：23×0.6＝13.8（米）。","13.8÷5＝2.76，至少买3卷。"],"trap":"第一步做完整桌垫用去尾法；最后买够胶条用进一法。中间不能用23.25块算胶条。"},{"title":"种植体验包","text":"活动有24.5千克育苗基质，每个完整的种植体验包需要0.8千克基质，另配0.06千克陶粒。陶粒每袋0.5千克。（1）最多能配几个完整的体验包？（2）为这些体验包至少需要购买几袋陶粒？","fields":[["完整体验包",30,"个"],["至少买陶粒",4,"袋"]],"hints":["先用基质总量确定完整体验包数量。","按完整包数算陶粒总量，再算买多少整袋才够。"],"steps":["24.5÷0.8＝30.625，最多30个完整包。","陶粒总量：30×0.06＝1.8（千克）。","1.8÷0.5＝3.6，至少买4袋。"],"trap":"0.8千克是基质用量，0.06千克是陶粒用量，不要混用。"},{"title":"科普展挂灯","text":"用现有导线尽量制作完整挂灯，至少需要购买几盒固定扣？","table":[["材料或用量","数量"],["现有导线","40.8米"],["每盏挂灯用导线","1.2米"],["每盏挂灯用固定扣","0.05千克"],["每盒固定扣","0.4千克"]],"fields":[["至少买固定扣",5,"盒"]],"hints":["先读表，找出决定挂灯数量的两个条件。","挂灯数量×每盏用扣量＝固定扣总质量，再按每盒质量购买。"],"steps":["挂灯：40.8÷1.2＝34（盏），恰好整除。","固定扣：34×0.05＝1.7（千克）。","1.7÷0.4＝4.25，至少买5盒。"],"trap":"第一步整除，不用额外加1；最后4盒不够，要买5盒。"},{"title":"研学骑行","text":"两支骑行队从相距25.2千米的两端同时相向出发，1.2小时后相遇。甲队速度为9.5千米/时。乙队的速度是多少？","fields":[["乙队速度",11.5,"千米/时"]],"hints":["相向出发、同时相遇，两队用时相同。","先算速度和，也可以先分别求路程。"],"steps":["速度和：25.2÷1.2＝21（千米/时）。","乙队速度：21－9.5＝11.5（千米/时）。","另一方法：（25.2－9.5×1.2）÷1.2＝11.5（千米/时）。"],"trap":"总路程÷相遇时间得到速度和，还需要减甲队速度。"},{"title":"余数回到原单位","text":"有5.3升活动茶水，每瓶最多装0.6升。把5.3÷0.6转化为53÷6，得到整数商8、余数5。（1）装满8瓶后，实际剩下多少升茶水？（2）把全部茶水装完，至少需要几瓶？","fields":[["实际剩余",0.5,"升"],["至少需要",9,"瓶"]],"hints":["转化为53÷6时，被除数扩大到原来的10倍。余数的单位也随之变化。","也可以用原来的单位检验：总量－8瓶装的量＝实际剩余。"],"steps":["实际剩余：5.3－0.6×8＝0.5（升）。","转化后余数5，回到原来的单位要除以10，得到0.5升。","8瓶装不完，剩余还需1瓶，至少9瓶。"],"trap":"不能把转化后的余数5直接写成5升。商不变，余数要还原。"},{"title":"机器人速度显示","text":"机器人匀速完成一段轨道用了0.5分钟。它的准确速度以米/分钟为单位，是一个两位小数，四舍五入保留一位小数后显示为2.0。（1）准确速度最大、最小分别是多少？（2）这段轨道的长度最大、最小分别是多少米？","fields":[["最小速度",1.95,"米/分钟"],["最大速度",2.04,"米/分钟"],["最短轨道",0.975,"米"],["最长轨道",1.02,"米"]],"hints":["准确速度是两位小数。先试1.94、1.95、2.04、2.05分别会保留成多少。","最小值要能进位到2.0，最大值又不能进位到2.1。速度范围确定后乘同一个时间。"],"steps":["1.94保留一位是1.9，1.95保留一位是2.0，所以最小速度1.95。","2.04保留一位是2.0，2.05保留一位是2.1，所以最大速度2.04。","最短：1.95×0.5＝0.975（米）；最长：2.04×0.5＝1.02（米）。"],"trap":"两位小数这个条件很重要。显示值2.0不等于准确速度就是2.0。"},{"title":"灌装机出水量","text":"一台灌装机以固定流量工作0.8分钟。它准确的每分钟出水量以升/分钟为单位，是一个两位小数，四舍五入保留一位小数后显示为4.2。（1）准确的每分钟出水量最大、最小分别是多少？（2）这0.8分钟的总出水量最大、最小分别是多少升？","fields":[["最小流量",4.15,"升/分钟"],["最大流量",4.24,"升/分钟"],["最少出水量",3.32,"升"],["最多出水量",3.392,"升"]],"hints":["从显示值4.2往两边找，考虑百分位上的数字是否使十分位进位。","检验4.14、4.15、4.24、4.25的保留结果，再乘0.8分钟。"],"steps":["准确流量最小4.15，最大4.24（升/分钟）。","最少出水：4.15×0.8＝3.32（升）。","最多出水：4.24×0.8＝3.392（升）。"],"trap":"题目只要求显示流量保留一位小数，总出水量不要擅自再取近似值。"},{"title":"模型船行程","text":"模型船匀速航行了1.2小时。它的准确速度以千米/时为单位，是一个两位小数，四舍五入保留一位小数后显示为2.0。（1）准确速度最大、最小分别是多少？（2）路程最大、最小分别是多少千米？（3）把最大速度再增加0.01，保留一位小数后还会显示2.0吗？","fields":[["最小速度",1.95,"千米/时"],["最大速度",2.04,"千米/时"],["最短路程",2.34,"千米"],["最长路程",2.448,"千米"]],"choice":["还会显示2.0","会显示2.1"],"correctChoice":"会显示2.1","hints":["速度的范围与第21题相同，航行时间不同。","最大速度加0.01后，百分位是几？四舍五入时会发生什么？"],"steps":["最小速度1.95，最大速度2.04（千米/时）。","最短路程：1.95×1.2＝2.34；最长路程：2.04×1.2＝2.448（千米）。","2.04＋0.01＝2.05，保留一位小数是2.1，所以不会继续显示2.0。"],"trap":"范围边界依靠四舍五入判断；路程要用本题的1.2小时重新计算。"},{"title":"分装材料与封口带","text":"环保活动有21.5千克陶粒，每个完整材料包装0.8千克。每包封口需要0.3米封口带，每卷封口带4.5米。用这些陶粒尽量配出完整材料包，至少需要购买几卷封口带？","fields":[["至少买封口带",2,"卷"]],"hints":["先确定最多配出的完整材料包数量。","由完整包数求封口带总长，再判断几整卷才够。"],"steps":["21.5÷0.8＝26.875，最多26个完整包。","封口带：26×0.3＝7.8（米）。","7.8÷4.5＝1.733…，至少买2卷；也可比较1卷4.5米不够，2卷9米够。"],"trap":"材料包数先去尾，封口带卷数最后进一。"},{"title":"小数点移动两位","text":"抄写一块薄片的厚度时，小数点误向右移动了两位，记录值比实际厚度大23.76毫米。实际厚度是多少毫米？请说明记录值与实际厚度之间的倍数关系。","fields":[["实际厚度",0.24,"毫米"],["记录值是实际的",100,"倍"]],"hints":["向右移动两位，是扩大到原来的10倍，还是100倍？","实际厚度1份，记录值100份，两数之差对应99份。"],"steps":["记录值是实际厚度的100倍，差是实际厚度的100－1＝99倍。","实际厚度：23.76÷99＝0.24（毫米）。","检验：0.24×100－0.24＝24－0.24＝23.76（毫米）。"],"trap":"移动两位用差99份，不是仍然除以9。"}];
const DAYS=[['周一','小数点移动与逆推'],['周二','倍数关系与附加量'],['周三','总量不变'],['周四','多步材料与取整'],['周五','近似数范围逆推']];
const KEY='mengmeng-weekly-decimal-20261012-v1';
let records={},storageOK=true,day=-1,current=0,reviewOnly=false;
const el=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
try{const v=JSON.parse(localStorage.getItem(KEY)||'{}');if(v&&typeof v==='object'&&!Array.isArray(v))records=v;}catch(e){storageOK=false;}
function record(i){if(!records[i]||typeof records[i]!=='object')records[i]={};let r=records[i];if(!Array.isArray(r.answers))r.answers=[];return r;}
function save(){try{localStorage.setItem(KEY,JSON.stringify(records));}catch(e){storageOK=false;}if(!storageOK)el('storageNotice').textContent='当前浏览器无法保存记录，请在离开前导出学习记录。';}
function indices(){return QUESTIONS.map((q,i)=>i).filter(i=>(day<0||Math.floor(i/5)===day)&&(!reviewOnly||record(i).review));}
function status(i){let r=record(i);return r.correct?(r.hints||r.viewed?'借助提示数值通过':'数值核对通过'):(r.checked?'待订正':'未核对');}
function updateProgress(){let n=QUESTIONS.filter((q,i)=>record(i).correct).length,help=QUESTIONS.filter((q,i)=>record(i).correct&&(record(i).hints||record(i).viewed)).length,rev=QUESTIONS.filter((q,i)=>record(i).review).length;el('progressText').textContent='数值通过 '+n+' / 25';el('progress').value=n;el('stats').textContent='其中借助提示 '+help+' 题 · 标记再练 '+rev+' 题';}
function renderSidebar(){el('days').innerHTML='<button class="day '+(day===-1?'active':'')+'" onclick="chooseDay(-1)" aria-pressed="'+(day===-1)+'">全部题目<small>20道主练＋5道选做</small></button>'+DAYS.map((d,i)=>'<button class="day '+(day===i?'active':'')+'" onclick="chooseDay('+i+')" aria-pressed="'+(day===i)+'">'+d[0]+'<small>'+d[1]+'</small></button>').join('');el('numbers').innerHTML=indices().map(i=>'<button class="num '+(i===current?'active ':'')+(record(i).correct?'pass ':'')+(record(i).review?'star':'')+'" onclick="chooseQuestion('+i+')" aria-label="第'+(i+1)+'题 '+QUESTIONS[i].title+' '+status(i)+'" '+(i===current?'aria-current="true"':'')+'>'+(i+1)+'</button>').join('');el('reviewOnly').checked=reviewOnly;updateProgress();}
function chooseDay(d){day=d;let ids=indices();current=ids.length?ids[0]:-1;render();}
function chooseQuestion(i){current=i;render();}
function toggleFilter(v){reviewOnly=v;let ids=indices();if(!ids.includes(current))current=ids.length?ids[0]:-1;render();}
function move(delta){let ids=indices(),p=ids.indexOf(current);if(p+delta>=0&&p+delta<ids.length){current=ids[p+delta];render();el('main').scrollIntoView({behavior:'smooth',block:'start'});}}
function tableHTML(q){return q.table?'<div class="tablewrap"><table><thead><tr>'+q.table[0].map(x=>'<th scope="col">'+esc(x)+'</th>').join('')+'</tr></thead><tbody>'+q.table.slice(1).map(row=>'<tr>'+row.map(x=>'<td>'+esc(x)+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>':'';}
function diagram(q){if(!q.diagram)return '';let [a,b,la,lb]=q.diagram,m=Math.max(a,b),w=250/m;return '<div class="svgbox"><svg viewBox="0 0 480 128" role="img" aria-label="'+esc(la)+' '+a+'份；'+esc(lb)+' '+b+'份"><text x="2" y="35" font-size="13" fill="#405b50">'+esc(la)+'</text><text x="2" y="95" font-size="13" fill="#405b50">'+esc(lb)+'</text>'+[[a,15],[b,75]].map(([n,y])=>'<rect x="175" y="'+y+'" width="'+(n*w)+'" height="30" rx="4" fill="#d6e7d7" stroke="#205c50"/>'+Array.from({length:Math.ceil(n)-1},(_,i)=>'<line x1="'+(175+(i+1)*w)+'" x2="'+(175+(i+1)*w)+'" y1="'+y+'" y2="'+(y+30)+'" stroke="#205c50"/>').join('')+'<text x="'+(184+n*w)+'" y="'+(y+21)+'" font-size="13" fill="#205c50">'+n+'份</text>').join('')+'</svg></div>';}
function resultHTML(){const r=record(current);if(!r.checked)return '';if(r.correct)return '数值核对通过。'+(r.hints||r.viewed?'本题使用过提示或解析，请稍后独立再做一次。':'再口述一下：为什么这样列式？每一步求的是什么？');let q=QUESTIONS[current],bad=q.fields.filter((f,i)=>!same(r.answers[i],f[1])).map(f=>f[0]);if(q.choice&&r.choice!==q.correctChoice)bad.push('选项');return '请检查：'+bad.join('、')+'。可以先回看条件和单位，再试一次。';}
function render(){renderSidebar();if(current<0){el('main').innerHTML='<div class="empty"><h2>这一组还没有标记再练题</h2><p>取消“只看标记的再练题”，即可继续选择所有题目。</p></div>';return;}let q=QUESTIONS[current],r=record(current),ids=indices(),p=ids.indexOf(current),h=Math.min(Number(r.hints)||0,q.hints.length);el('main').innerHTML='<article class="card"><div class="cardtop"><span class="tag">'+DAYS[Math.floor(current/5)][0]+' · 第'+(current+1)+'题 · '+(current%5===4?'选做':'主要练习')+'</span><button class="bookmark '+(r.review?'on':'')+'" onclick="markReview()" aria-pressed="'+!!r.review+'">'+(r.review?'★ 已标记再练':'☆ 标记再练')+'</button></div><h2 id="title">'+q.title+'</h2><p class="question">'+q.text+'</p>'+tableHTML(q)+'<div class="sectionlabel"><label for="thinking">我的思路与列式</label><span class="notehint">也可以写在纸上，再填写下面的结果</span></div><textarea id="thinking" placeholder="先找条件，再想每一步求什么……" oninput="setThinking(this.value)">'+esc(r.thinking||'')+'</textarea><div class="sectionlabel">填写结果<span class="notehint">只填数值，单位已列在右侧</span></div><div class="fields">'+q.fields.map((f,i)=>'<div class="field"><label for="answer'+i+'">'+f[0]+'</label><div class="inputrow"><input id="answer'+i+'" type="text" inputmode="decimal" autocomplete="off" value="'+esc(r.answers[i]||'')+'" oninput="setAnswer('+i+',this.value)" onkeydown="if(event.key===\'Enter\')checkAnswer()"><span class="unit">'+f[2]+'</span></div></div>').join('')+'</div>'+(q.choice?'<div class="sectionlabel">选择判断</div><div class="choice">'+q.choice.map((c,i)=>'<button onclick="setChoice('+i+')" aria-pressed="'+(r.choice===c)+'">'+c+'</button>').join('')+'</div>':'')+'<div class="actions"><button class="primary" onclick="checkAnswer()">核对数值</button><button onclick="nextHint()" '+(h>=q.hints.length?'disabled':'')+'>'+(h?'下一步提示':'看一点提示')+' ('+h+'/'+q.hints.length+')</button><button onclick="showSolution()">'+(r.openSolution?'收起解析':'查看答案解析')+'</button></div><div id="result" class="result '+(r.correct?'good':'retry')+'" role="status" aria-live="polite">'+resultHTML()+'</div>'+(h?'<section class="hintbox"><h3>分步提示</h3>'+q.hints.slice(0,h).map((t,i)=>'<p>'+String(i+1)+'．'+t+'</p>').join('')+(h>=2?diagram(q):'')+'</section>':'')+(r.openSolution?'<section class="solution"><h3>答案与解析</h3><div class="answerlist">'+q.fields.map(f=>f[0]+'：'+f[1]+f[2]).join('；')+(q.correctChoice?'；'+q.correctChoice:'')+'</div><ol>'+q.steps.map(s=>'<li>'+s+'</li>').join('')+'</ol><div class="trap">容易混淆：'+q.trap+'</div></section>':'')+'</article><div class="navbottom"><button onclick="move(-1)" '+(p<=0?'disabled':'')+'>← 上一题</button><span>'+(p+1)+' / '+ids.length+'</span><button onclick="move(1)" '+(p===ids.length-1?'disabled':'')+'>下一题 →</button></div>';}
function numeric(v){let s=String(v??'').normalize('NFKC').trim();return /^[+-]?(?:\d+(?:\.\d*)?|\.\d+)$/.test(s)?Number(s):NaN;}
function same(v,n){let x=numeric(v);return Number.isFinite(x)&&Math.abs(x-n)<=1e-8*Math.max(1,Math.abs(n));}
function invalidate(){let r=record(current);r.checked=false;r.correct=false;save();el('result').textContent='';renderSidebar();}
function setAnswer(i,v){record(current).answers[i]=v;invalidate();}
function setThinking(v){record(current).thinking=v;save();}
function setChoice(i){record(current).choice=QUESTIONS[current].choice[i];invalidate();render();}
function checkAnswer(){if(current<0)return;let q=QUESTIONS[current],r=record(current);r.correct=q.fields.every((f,i)=>same(r.answers[i],f[1]))&&(!q.choice||r.choice===q.correctChoice);r.checked=true;save();render();}
function nextHint(){let r=record(current);r.hints=Math.min((Number(r.hints)||0)+1,QUESTIONS[current].hints.length);save();render();}
function showSolution(){let r=record(current);r.openSolution=!r.openSolution;if(r.openSolution)r.viewed=true;save();render();}
function markReview(){let r=record(current);r.review=!r.review;save();let ids=indices();if(!ids.includes(current))current=ids.length?ids[0]:-1;render();}
function exportRecords(){let text='小数除法应用题｜学习记录\n导出时间：'+new Date().toLocaleString('zh-CN',{timeZone:'Asia/Shanghai'})+'（北京时间）\n\n'+QUESTIONS.map((q,i)=>{let r=record(i);return '第'+(i+1)+'题 '+q.title+'\n状态：'+status(i)+(r.review?'；标记再练':'')+'\n我的思路：'+(r.thinking||'未填写')+'\n我的结果：'+q.fields.map((f,j)=>f[0]+' '+(r.answers[j]??'未填写')+f[2]).join('；')+(q.choice?'；选择：'+(r.choice||'未选择'):'')+'\n提示：'+(r.hints||0)+'步；查看过解析：'+(r.viewed?'是':'否');}).join('\n\n');let url=URL.createObjectURL(new Blob([text],{type:'text/plain;charset=utf-8'})),a=document.createElement('a');a.href=url;a.download='小数除法应用题_学习记录.txt';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);}
function printSheet(answers){el('printarea').innerHTML='<h1>小数除法 · 应用与拓展'+(answers?'｜答案解析':'')+'</h1>'+DAYS.map((d,k)=>'<section class="printday"><h2>'+d.join('｜')+'</h2>'+QUESTIONS.slice(k*5,k*5+5).map((q,j)=>'<article class="printq"><h3>'+(k*5+j+1)+'．'+q.title+(j===4?'（选做）':'')+'</h3><p>'+q.text+'</p>'+tableHTML(q)+(answers?'<p><strong>'+q.fields.map(f=>f[0]+'：'+f[1]+f[2]).join('；')+(q.correctChoice?'；'+q.correctChoice:'')+'</strong></p><ol>'+q.steps.map(t=>'<li>'+t+'</li>').join('')+'</ol><p>易混点：'+q.trap+'</p>':'<div class="workspace"></div>')+'</article>').join('')+'</section>').join('');window.print();}
render();save();
</script></body></html>
