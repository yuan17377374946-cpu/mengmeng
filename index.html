<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#5147e5">
  <meta name="description" content="梦梦的五年级小数除法应用题闯关练习">
  <title>梦梦的小数除法闯关</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%235147e5'/%3E%3Cpath d='M17 20h30v7H17zm0 17h30v7H17z' fill='white'/%3E%3Ccircle cx='32' cy='13' r='4' fill='%23ffd166'/%3E%3Ccircle cx='32' cy='51' r='4' fill='%23ffd166'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div class="background-grid" aria-hidden="true"></div>
  <header class="topbar">
    <button class="brand" id="homeBtn" type="button" aria-label="返回关卡地图">
      <span class="brand-mark">÷</span>
      <span><strong>梦梦的小数除法闯关</strong><small>五年级应用题专项</small></span>
    </button>
    <div class="header-actions">
      <div class="overall-progress" aria-label="总进度">
        <span id="overallText">0 / 50</span>
        <div class="mini-track"><i id="overallBar"></i></div>
      </div>
      <button class="ghost-btn" id="wrongBtn" type="button">错题重练 <span id="wrongCount">0</span></button>
    </div>
  </header>

  <aside style="max-width:1100px;margin:12px auto;padding:16px 22px;border:1px solid #dcd5ee;border-radius:14px;background:#faf8ff;font-family:system-ui,sans-serif;line-height:1.7"><a href="./unit3/index.html" style="color:#65539c;font-weight:600">进入新版：小数除法全章学习与闯关 →</a><br><small style="color:#716c80">28关 · 168题 · 易错查漏 · 综合测试。原专项与进度仍保留。</small></aside>
  <aside style="max-width:1100px;margin:12px auto;padding:16px 22px;border:1px solid #cbded0;border-radius:14px;background:#f1f8f0;font-family:system-ui,sans-serif;line-height:1.7"><a href="./unit5/practice.html" style="color:#18775d;font-weight:600">第五单元：用字母表示数 · 分类练习 →</a><br><small style="color:#536e5f">12类 · 59组练习 · 填写答案与过程 · 手写草稿 · 提交核对 · 老师版解析</small></aside>
  <main id="app" tabindex="-1"></main>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <template id="homeTemplate">
    <section class="home-view">
      <div class="welcome-card">
        <div>
          <span class="eyebrow">应用题训练地图</span>
          <h1>从读懂题目开始，闯过10关</h1>
          <p>10个关卡全部开放，每关5题。先列算式，再填写答案。</p>
        </div>
        <div class="welcome-score">
          <span class="star">★</span>
          <strong id="homeCorrect">0</strong>
          <small>累计答对</small>
        </div>
      </div>
      <div class="map-head">
        <div>
          <h2>关卡地图</h2>
          <p id="mapSummary">10个关卡全部开放，可以自由选择练习。</p>
        </div>
        <button class="text-btn" id="resetBtn" type="button">重新开始</button>
      </div>
      <div class="level-grid" id="levelGrid"></div>
      <div class="legend">
        <span><i class="dot ready"></i>可以挑战</span>
        <span><i class="dot done"></i>已经通关</span>
      </div>
    </section>
  </template>

  <template id="quizTemplate">
    <section class="quiz-view">
      <div class="quiz-topline">
        <button class="back-btn" id="backBtn" type="button">关卡地图</button>
        <div class="level-label" id="levelLabel"></div>
        <div class="question-count" id="questionCount"></div>
      </div>
      <div class="level-track"><i id="levelBar"></i></div>
      <article class="question-card">
        <div class="question-kicker" id="questionKicker"></div>
        <h1 id="questionTitle"></h1>
        <div class="question-body" id="questionBody"></div>
        <div class="answer-area">
          <label for="formulaInput">算式 <small>可以分步填写</small></label>
          <textarea id="formulaInput" rows="2" placeholder="例如：31.5÷6＝5.25"></textarea>
          <label for="answerInput">答案</label>
          <div class="answer-row">
            <input id="answerInput" inputmode="decimal" autocomplete="off" placeholder="填写最终答案">
            <span class="unit" id="answerUnit"></span>
            <button class="primary-btn" id="submitBtn" type="button">提交答案</button>
          </div>
          <div class="helper-row">
            <button class="hint-btn" id="hintBtn" type="button">查看提示</button>
            <span>算式不计分，但需要认真填写哦</span>
          </div>
        </div>
        <div class="feedback" id="feedback" aria-live="polite"></div>
      </article>
      <nav class="question-nav" aria-label="题目导航">
        <button id="prevBtn" type="button">上一题</button>
        <div class="question-dots" id="questionDots"></div>
        <button id="nextBtn" type="button">下一题</button>
      </nav>
    </section>
  </template>

  <script src="./questions.js"></script>
  <script src="./app.js"></script>
</body>
</html>
