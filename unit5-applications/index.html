</style></head><body><div class="wrap"><header><div><div class="eyebrow">MATH PRACTICE / 第五单元</div><h1>把数量关系写出来</h1><p>用字母表示数 · 应用题专项</p></div><div class="tools"><button onclick="go('review')">学习记录</button><button onclick="exportRecord()">导出</button></div></header><p id="notice" class="notice" role="status"></p><nav id="nav" aria-label="学习内容"></nav><main id="main"></main><p class="footer">按已上传的同步专项选题，资料题改编与原创变式分别标注。思路记录供师生讨论，不自动评分。答题记录保存在当前浏览器，不跨设备同步。</p></div><script>
const GROUPS=[{id:'warm',title:'课前热身',time:'10分钟',intro:'先确认乘法简写、平方和代入求值。'},{id:'difference',title:'和差与倍数',time:'20分钟',intro:'先确定字母表示谁，再找多出的、少掉的和几倍的量。'},{id:'remaining',title:'总量与剩余',time:'25分钟',intro:'求剩余要减去已用；求原来总量，要把已用和剩余合起来。'},{id:'shopping',title:'购物费用',time:'20分钟',intro:'分别求费用，再看问题要合计、比较，还是求剩余。'},{id:'test',title:'独立小测',time:'15分钟',intro:'不提示题型。先独立写出关系，全部提交后再看解析。'}];
const EXAMPLES={
 difference:{source:'同步专项第1页·义卖题',prompt:'小明卖出m件商品，小华比他多卖4件；小林与小明一共卖出16件。小华、小林分别卖出多少件？',steps:[['明确字母','m表示小明卖出的件数，不是三个人的总数。'],['找数量关系','小华＝小明＋多出的4件；小林＝两人总数－小明。'],['写式子并检验','小华：m+4；小林：16−m。取m=7，分别为11件、9件。小林与小明合起来仍是16件。']],trap:'同样出现“m”，求多出的量和求总数中的另一部分，运算并不相同。',lab:'difference'},
 remaining:{source:'同步专项第6页·装饺子题',prompt:'每盘装x个饺子，装了3盘，还剩8个。一共煮了多少个饺子？',steps:[['明确字母','x表示每盘装的个数；3是盘数，8是没有装进盘子的个数。'],['先求一个中间量','已经装入盘子的总数是3x个。要求原来总数，还要加上剩下的8个。'],['写式子并检验','一共3x+8个。x=10时，3×10+8=38个。若问“38个装3盘后剩多少”，则是38−3x。']],trap:'“还剩8个”是已知条件，不代表一定要减8。先看问题求的是原来总数还是剩余。',lab:'remaining'},
 shopping:{source:'同步专项第3页·苹果香蕉题',prompt:'带100元，买a千克苹果，每千克5元；再买b千克香蕉，每千克4元。两种水果都买完，还剩多少元？',steps:[['给每个字母对上数量','a、b分别表示苹果、香蕉的质量，不是单价。单价已经给出：5元/千克、4元/千克。'],['先分别求费用','苹果费用5a元，香蕉费用4b元，两项费用合计5a+4b元。'],['求剩余并解释整个式子','剩余100−(5a+4b)元，也可以写成100−5a−4b。a=2、b=3时，花22元，剩78元。']],trap:'100−5a只减去了苹果费用；求两种水果都买完后的钱，还要减去4b。',lab:'shopping'}
};
const QUESTIONS=[];
const E=(label,answer,more={})=>({label,type:'expr',answer,...more}),N=(label,answer,unit='')=>({label,type:'number',answer,unit}),C=(label,options)=>({label,type:'choice',answer:0,options});
function add(group,prompt,fields,hint,solution,source='原创变式'){QUESTIONS.push({id:'q'+String(QUESTIONS.length+1).padStart(2,'0'),group,prompt,fields,hint,solution,source});}
add('warm','把8×y按通常写法省略乘号。',[E('简写','8y',{canonical:true})],'数字在前，字母在后。','8×y=8y。');
add('warm','当a=5时，求a²的值。',[N('a²的值',25)],'平方表示自己乘自己。','a²=5×5=25。');
add('warm','当a=5时，求2a的值。',[N('2a的值',10)],'2a是2与a相乘。','2a=2×5=10，与a²的含义不同。');
add('warm','当a=4时，求3a+2的值。',[N('3a+2的值',14)],'把省略的乘号补回来。','3×4+2=12+2=14。');
add('difference','一桶奶粉连桶重a千克，奶粉重0.45千克。桶重多少千克？',[E('桶的质量','a-.45'),N('当a=1.25时，桶重',.8,'千克')],'总质量由哪两部分组成？','桶重=a−0.45；代入1.25，得1.25−0.45=0.8千克。','资料题改编·第1页');
add('difference','合唱小组女生有30人，比男生少x人。合唱小组一共有多少人？',[E('总人数','60+x'),N('当x=6时，总人数',66,'人')],'先求男生人数：谁比谁多x人？','男生30+x人，总人数30+(30+x)=60+x；x=6时共66人。','资料题改编·第1页');
add('difference','果园有苹果树x棵，桃树比苹果树的4倍少30棵。桃树有多少棵？',[E('桃树棵数','4x-30'),N('当x=20时，桃树有',50,'棵')],'先求苹果树的4倍，再考虑少掉的30棵。','4x−30；x=20时，4×20−30=50棵。实际取值须使树的棵数合理。','资料题改编·第1页');
add('difference','展板区有n张海报，阅读区比展板区多7张。两个区域一共有多少张？',[E('海报总数','2n+7'),N('当n=12时，一共有',31,'张')],'多7张的是阅读区，不是两个区域合起来只比n多7。','阅读区n+7张，合计n+(n+7)=2n+7；n=12时31张。');
add('difference','机器人社团有m人，是摄影社团人数的3倍。摄影社团比机器人社团少多少人？',[E('相差人数','m-m/3'),N('当m=24时，相差',16,'人')],'字母表示的是3份，先求摄影社团的1份。','摄影社团m÷3人，相差m−m÷3人；m=24时24−8=16人。m应为3的正整数倍。');
add('difference','一根彩带长a米，另一根比它短2米。下面哪个式子表示两根彩带的总长度？',[C('选择式子',['a+(a−2)','a−2','2a+2','a÷2'])],'先求另一根长度，再把两根加起来。','另一根a−2米，总长a+(a−2)=2a−2米；题设a>2。');
add('remaining','小丽看一本210页的书，已经看5天，平均每天看x页。还有多少页没看？',[E('未看页数','210-5x'),N('当x=32时，未看',50,'页')],'5天一共看了多少页？','已看5x页，剩210−5x页；x=32时210−160=50页。','资料题改编·第6页');
add('remaining','每盘装x个饺子，装了3盘，还剩8个。一共煮了多少个？',[E('饺子总数','3x+8'),N('当x=10时，一共有',38,'个')],'这次求原来总数。已经装盘和没装盘的都要算。','总数3x+8；x=10时30+8=38个。','资料题改编·第6页');
add('remaining','一箱荔枝每天吃x千克，吃2天后还剩7千克。原来有多少千克？',[E('原来质量','2x+7'),N('当x=1.5时，原来有',10,'千克')],'原来总量由吃掉的和剩下的组成。','两天吃2x千克，原来2x+7千克；x=1.5时3+7=10千克。','资料题改编·第6页');
add('remaining','水箱原来有a升水，每次浇花用b升，一共浇4次。还剩多少升水？',[E('剩余水量','a-4b'),N('当a=120、b=18时，还剩',48,'升')],'先求4次用水总量。','共用4b升，剩a−4b升；120−4×18=48升。用水总量应不超过原有水量。');
add('remaining','志愿者连续n天整理书籍，每天整理a本，结束后还有b本未整理。这批书原来有多少本？',[E('书籍总数','an+b'),N('当n=5、a=12、b=26时，原来有',86,'本')],'整理过的总数是多少？它与剩余数量是什么关系？','已整理an本，原来an+b本；5×12+26=86本。');
add('remaining','工厂每小时生产30个玩具，上午生产a小时，下午生产3小时。这一天共生产210个。',[E('先用a表示全天产量','30a+90'),N('再求上午生产时间a',4,'小时')],'先写正向关系，再用总产量反求上午时间。','全天30a+30×3=30a+90。30a+90=210，30a=120，a=4。代回30×4+90=210。','资料题改编·第10页');
add('shopping','买a千克苹果，每千克5元；买b千克香蕉，每千克4元。两种水果一共花多少元？',[E('合计费用','5a+4b'),N('当a=2、b=3时，共花',22,'元')],'先分别算苹果、香蕉费用。','苹果5a元，香蕉4b元，共5a+4b元；5×2+4×3=22元。','资料题改编·第3页');
add('shopping','带100元，按苹果每千克5元、香蕉每千克4元，分别购买a千克和b千克。全部买完剩多少元？',[E('剩余钱数','100-5a-4b'),N('当a=2、b=3时，还剩',78,'元')],'从100元中减去两项费用。','100−(5a+4b)=100−5a−4b；代入后100−22=78元。总费用须不超过100元。','资料题改编·第3页');
add('shopping','一本经典名著a元，一本科普书比它贵26元。买6本科普书需要多少元？',[E('总费用','6(a+26)'),N('当a=18时，共需',264,'元')],'每一本科普书都贵26元，不只是整批贵26元。','单价a+26元，总价6(a+26)=6a+156；a=18时6×44=264元。','资料题改编·第9页');
add('shopping','义卖摊的明信片每张a元，书签每张b元。买4张明信片和3张书签，一共多少元？',[E('总费用','4a+3b'),N('当a=2.5、b=1.2时，共需',13.6,'元')],'两种商品数量不同，要分别计算。','总费用4a+3b；4×2.5+3×1.2=10+3.6=13.6元。');
add('shopping','带50元，买2张每张a元的门票，另付一次寄存费b元。还剩多少元？',[E('剩余钱数','50-2a-b'),N('当a=12、b=6时，还剩',20,'元')],'寄存费只付一次，不能也乘2。','门票共2a元，总花费2a+b，剩50−2a−b；50−24−6=20元。');
add('shopping','带100元，苹果a千克、每千克5元；香蕉b千克、每千克4元。式子100−5a表示什么？',[C('选择含义',['只扣除苹果费用后的钱数','两种水果全部买完后的钱数','苹果和香蕉的总费用','只扣除香蕉费用后的钱数'])],'这一个式子实际减去了哪一笔费用？','5a是苹果费用；100−5a表示只扣除苹果费用后的钱数，还没有扣除香蕉费用。','资料题改编·第3页');
add('test','展览成人票每张a元，儿童票比成人票便宜8元。买2张成人票和3张儿童票，共需多少元？',[E('总费用','5a-24'),N('当a=20时，共需',76,'元')],'先确定儿童票单价。','儿童票a−8元，总费2a+3(a−8)=5a−24；a=20时76元。');
add('test','一本画册有a页，每天看6页，连续看n天。还有多少页没看？',[E('剩余页数','a-6n'),N('当a=80、n=7时，剩',38,'页')],'先求看过的页数。','已看6n页，剩a−6n；80−6×7=38页。看过的页数不超过总页数。');
add('test','每个手工材料包有5张彩纸，准备了n包，另有12张散装彩纸。一共有多少张？',[E('彩纸总数','5n+12'),N('当n=8时，共有',52,'张')],'成包的与散装的都属于总数。','成包共5n张，加散装12张，得到5n+12；n=8时52张。');
add('test','带80元买3个花盆，每个a元，另外买一袋b元的肥料。买完后还剩多少元？',[E('剩余钱数','80-3a-b'),N('当a=12、b=8时，还剩',36,'元')],'先分别算花盆与肥料费用。','共花3a+b，剩80−3a−b；80−36−8=36元。');
QUESTIONS.forEach((q,i)=>q.fields.forEach((f,j)=>{if(f.options){const k=(i+j)%f.options.length;f.options=f.options.slice(k).concat(f.options.slice(0,k));f.answer=(f.options.length-k)%f.options.length;}}));

const Algebra=(()=>{
 const fmt=n=>Number.isFinite(n)?String(Number(n.toFixed(8))):'—';
 function normalize(s){return String(s).trim().replace(/[０-９Ａ-Ｚａ-ｚ（）＋－．／＊]/g,c=>String.fromCharCode(c.charCodeAt(0)-65248)).replace(/\s+/g,'').replace(/[×·⋅]/g,'*').replace(/[÷]/g,'/').replace(/[−–]/g,'-').replace(/²/g,'^2').toLowerCase();}
 const clean=p=>{for(const k in p){if(!Number.isFinite(p[k])||Math.abs(p[k])>1e12)throw Error('数值过大');if(Math.abs(p[k])<1e-10)delete p[k];}if(Object.keys(p).length>100)throw Error('式子过长');return p;};
 function plus(p,r,s=1){const o={...p};for(const k in r)o[k]=(o[k]||0)+s*r[k];return clean(o);}
 function mul(p,r){const o={};for(const a in p)for(const b in r){const k=(a+b).split('').sort().join('');if(k.length>8)throw Error('次数过高');o[k]=(o[k]||0)+p[a]*r[b];}return clean(o);}
 function parse(input){
  const s=normalize(input);if(!s||s.length>160)throw Error('请填写一个简短的式子');if(/[^0-9a-z+*/^().-]/.test(s))throw Error('请只写所求式子，不带等号、单位或文字');if(/[a-z]\d/.test(s))throw Error('数字系数请写在字母前，如2a；平方写a²或a^2');
  const ts=s.match(/(?:\d+(?:\.\d+)?|\.\d+)|[a-z]|[+*/^().-]/g)||[];if(ts.join('')!==s)throw Error('式子的格式还不完整');let pos=0,depth=0;
  function atom(){if(++depth>30)throw Error('括号太多');let p,t=ts[pos++];if(t==='('){p=add();if(ts[pos++]!==')')throw Error('请把括号写完整');}else if(t&&/^[a-z]$/.test(t))p={[t]:1};else if(t&&/^(?:\d|\.)/.test(t))p={'':Number(t)};else throw Error('这里缺少数或字母');depth--;return clean(p);}
  function power(){let p=atom();if(ts[pos]==='^'){pos++;if(ts[pos++]!=='2')throw Error('本页平方请写^2或²');p=mul(p,p);}return p;}
  function unary(){if(ts[pos]==='+'){pos++;return unary();}if(ts[pos]==='-'){pos++;return mul({'':-1},unary());}return power();}
  function product(){let p=unary();while(pos<ts.length){let t=ts[pos];if(t==='*'||t==='/'){pos++;let r=unary();if(t==='*')p=mul(p,r);else{if(Object.keys(r).some(k=>k!==''))throw Error('本练习请把除数写成具体的数');const v=r['']||0;if(v===0)throw Error('0不能作除数');p=mul(p,{'':1/v});}}else if(t==='('||/^[a-z]$/.test(t||'')||/^(?:\d|\.)/.test(t||'')){p=mul(p,unary());}else break;}return p;}
  function add(){let p=product();while(ts[pos]==='+'||ts[pos]==='-'){const sign=ts[pos++]==='+'?1:-1;p=plus(p,product(),sign);}return p;}
  const p=add();if(pos!==ts.length)throw Error('请检查运算符和括号');return clean(p);
 }
 function equivalent(a,b){const p=parse(a),r=parse(b);return Object.keys({...p,...r}).every(k=>Math.abs((p[k]||0)-(r[k]||0))<1e-8);}
 function grade(item,input){
  if(item.type==='choice')return {correct:typeof input==='number'&&input===item.answer,error:input===null||input===undefined?'请先选择一项。':''};
  if(item.type==='number'){const s=normalize(input??'');if(!/^[+-]?(?:\d+(?:\.\d+)?|\.\d+)$/.test(s))return {correct:false,error:'请填写数值，单位已写在输入框旁。'};return {correct:Math.abs(Number(s)-item.answer)<1e-8};}
  try{const correct=equivalent(input,item.answer);if(correct&&item.canonical&&normalize(input)!==normalize(item.answer))return {correct:false,error:'数量关系对了。这一题还要求按通常简写格式填写：数字在前、省略乘号，平方用²或^2。'};if(correct&&item.expanded&&/[()]/.test(normalize(input)))return {correct:false,error:'数值关系对了；请按题目要求展开，填写不含括号的式子。'};return {correct};}catch(e){return {correct:false,error:e.message+'。'};}
 }
 function value(expression,values){const p=parse(expression);return Object.entries(p).reduce((s,[key,c])=>s+c*key.split('').reduce((v,k)=>v*values[k],1),0);}
 function polygon(n){const pts=Array.from({length:n},(_,i)=>{const t=-Math.PI/2+2*Math.PI*i/n;return [340+105*Math.cos(t),180+105*Math.sin(t)];});const edges=[];for(let i=0;i<n;i++)for(let j=i+1;j<n;j++)if(j-i!==1&&!(i===0&&j===n-1))edges.push([i,j]);return {pts,edges};}
 return {fmt,normalize,parse,equivalent,grade,value,polygon};
})();

const KEY='unit5-application-lesson-20261025';
const $=id=>document.getElementById(id),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let state={group:'warm',indices:{},records:{},steps:{},lab:{difference:{m:7},remaining:{x:10},shopping:{a:2,b:3}},submitted:false},storageOK=true;
try{const r=JSON.parse(localStorage.getItem(KEY)||'null');if(r&&typeof r==='object'){if(GROUPS.some(g=>g.id===r.group)||r.group==='review')state.group=r.group;for(const k of ['indices','records','steps','lab'])if(r[k]&&typeof r[k]==='object'&&!Array.isArray(r[k]))state[k]={...state[k],...r[k]};state.submitted=r.submitted===true;}}catch{storageOK=false;}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state));}catch{storageOK=false;}$('notice').textContent=storageOK?'':'当前浏览器无法保存记录，请用“导出”保留学习结果。';}
function rec(q){let r=state.records[q.id];if(!r||typeof r!=='object')r=state.records[q.id]={values:q.fields.map(f=>f.type==='choice'?null:''),checked:false,results:[],wrong:false,attempts:0,notes:['','','']};if(!Array.isArray(r.values))r.values=[];if(!Array.isArray(r.notes))r.notes=['','',''];return r;}
function qs(g=state.group){return QUESTIONS.filter(q=>q.group===g);}
function passed(q){const r=rec(q);return r.checked&&r.results.length===q.fields.length&&r.results.every(x=>x.correct);}
function go(g){state.group=g;save();render();}
function selectQ(i){state.indices[state.group]=i;save();render();}
function openQ(id){const q=QUESTIONS.find(q=>q.id===id);state.group=q.group;state.indices[q.group]=qs(q.group).indexOf(q);save();render();}
function renderNav(){$('nav').innerHTML=GROUPS.map(g=>`<button class="${state.group===g.id?'active':''}" onclick="go('${g.id}')">${g.title}</button>`).join('');}
function render(){renderNav();if(state.group==='review'){renderReview();save();return;}const g=GROUPS.find(g=>g.id===state.group),items=qs(),index=Math.max(0,Math.min(items.length-1,Number(state.indices[g.id])||0));state.indices[g.id]=index;
 const head=`<div class="card"><div class="small">${g.time} · ${items.length}题</div><h2>${g.title}</h2><p class="lead">${g.intro}</p>${g.id==='warm'?'':'<p class="optional">先说清楚：字母表示什么？先求什么？整个式子表示什么？</p>'}</div>`;
 if(g.id==='test'){$('main').innerHTML=head+items.map(q=>`<article class="card">${questionHTML(q,true)}</article>`).join('')+`<div class="card"><button class="primary" onclick="submitTest()">${state.submitted?'重新提交小测':'全部做完，提交小测'}</button>${state.submitted?`<p class="stats">本次整题答对${items.filter(passed).length}/${items.length}题。可以逐题查看解析，再独立订正。</p>`:''}</div>`;save();return;}
 $('main').innerHTML=head+(EXAMPLES[g.id]?exampleHTML(g.id):'')+`<article class="card"><div class="small">${g.id==='warm'?'先做四道基础题':'自己试一试'}</div><div class="dots">${items.map((q,i)=>`<button class="${i===index?'active':passed(q)?'pass':rec(q).wrong?'wrong':''}" onclick="selectQ(${i})">${i+1}${passed(q)?' ✓':''}</button>`).join('')}</div>${questionHTML(items[index])}<div class="pager"><button onclick="selectQ(${index-1})" ${index===0?'disabled':''}>上一题</button><button onclick="${index===items.length-1?`go('${GROUPS[GROUPS.indexOf(g)+1]?.id||'review'}')`:`selectQ(${index+1})`}" class="primary">${index===items.length-1?'下一部分':'下一题'}</button></div></article>`;
 if(EXAMPLES[g.id])updateLab();save();
}
function exampleHTML(id){const e=EXAMPLES[id],step=Math.max(0,Math.min(3,Number(state.steps[id])||0));return `<article class="card"><span class="tag">一起讲一道 · ${e.source}</span><p class="example-prompt">${e.prompt}</p><div class="steps">${e.steps.map((s,i)=>`<button onclick="reveal(${i+1})" class="${step===i+1?'active':''}">${i+1}. ${s[0]}</button>`).join('')}<button onclick="reveal(0)">收起</button></div>${step?`<div class="guide"><h3>${e.steps[step-1][0]}</h3><p>${e.steps[step-1][1]}</p></div>`:'<p class="small">先口头分析，再点开讲解。</p>'}<details><summary>调一调数字，看数量关系</summary><div class="lab"><div class="board" id="board"></div><div class="controls">${labControls(id)}</div></div><div class="readout" id="readout"></div></details><div class="trap">${e.trap}</div></article>`;}
function reveal(i){state.steps[state.group]=i;save();render();}
function labParams(id){const p=state.lab[id]||{};const defs=id==='difference'?[['m',1,15,7]]:id==='remaining'?[['x',1,20,10]]:[['a',1,8,2],['b',0,8,3]];for(const [k,min,max,v]of defs)if(!Number.isFinite(p[k])||p[k]<min||p[k]>max)p[k]=v;state.lab[id]=p;return p;}
function labControls(id){const p=labParams(id),keys=id==='difference'?['m']:id==='remaining'?['x']:['a','b'];return keys.map(k=>`<div><label for="lab-${k}">${k}=<output id="out-${k}">${p[k]}</output></label><input id="lab-${k}" type="range" min="${k==='b'?0:1}" max="${id==='difference'?15:id==='remaining'?20:8}" step="1" value="${p[k]}" oninput="setLab('${k}',this.value)"></div>`).join('');}
function setLab(k,v){labParams(state.group)[k]=Number(v);$('out-'+k).textContent=v;updateLab();save();}
function textSvg(x,y,t,size=19,color='#2e4c3f',anchor='start'){return `<text x="${x}" y="${y}" font-size="${size}" text-anchor="${anchor}" fill="${color}" font-family="system-ui,PingFang SC,Microsoft YaHei,sans-serif">${esc(t)}</text>`;}
function bar(x,y,w,fill){return `<rect x="${x}" y="${y}" width="${w}" height="28" rx="3" fill="${fill}"/>`;}
function labScene(id,p){let s='',caption='';if(id==='difference'){const m=p.m;s=textSvg(30,35,'字母变了，关系保持不变',20);[['小明',m],['小华',m+4],['小林',16-m]].forEach(([name,n],i)=>{const y=65+i*65;s+=textSvg(30,y+21,name,17)+bar(100,y,n*23,i===0?'#7da8bc':i===1?'#b9d0a7':'#e3c58f')+textSvg(112+n*23,y+21,n+'件',17);});caption=`m=${m}；小华m+4=${m+4}件；小林16−m=${16-m}件。小明与小林合计16件。`;}
 if(id==='remaining'){const x=p.x; s=textSvg(30,35,'求原来：装盘的＋没装盘的',20);for(let i=0;i<3;i++)s+=`<rect x="${35+i*135}" y="75" width="110" height="75" rx="8" fill="#e6efdd" stroke="#b9cdb1"/>`+textSvg(90+i*135,120,`${x}个`,23,'#376250','middle');s+=textSvg(485,120,'＋8个',23)+textSvg(310,210,`3×${x}+8=${3*x+8}个`,27,'#285a51','middle');caption=`总数3x+8=${3*x+8}；反过来，总数减去装盘数量：${3*x+8}−3×${x}=8。`;}
 if(id==='shopping'){const a=p.a,b=p.b,apple=5*a,banana=4*b,left=100-apple-banana;s=textSvg(30,35,'同一笔100元，分别扣去两项费用',20);[['苹果',apple,'#7da8bc'],['香蕉',banana,'#e3c58f'],['剩余',left,'#a9c59a']].forEach(([name,n,color],i)=>{const y=65+i*65;s+=textSvg(25,y+21,name,17)+bar(95,y,n*5,color)+textSvg(107+n*5,y+21,n+'元',17);});caption=`苹果5a=${apple}元，香蕉4b=${banana}元；100−(5a+4b)=${left}元。`;}
 return {svg:`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 280" role="img" aria-label="${esc(caption)}"><title>${esc(caption)}</title><rect width="650" height="280" fill="#fcfdf8"/>${s}</svg>`,caption};}
function updateLab(){const r=labScene(state.group,labParams(state.group));$('board').innerHTML=r.svg;$('readout').textContent=r.caption;}
function questionHTML(q,test=false){const r=rec(q),allowed=!test||state.submitted;return `<div class="small"><span class="tag">${q.source}</span> ${q.id.toUpperCase()}</div><p class="prompt">${q.prompt}</p>${q.fields.map((f,j)=>{const v=r.values[j],result=r.checked&&allowed?r.results[j]:null,letters=f.type==='expr'?[...new Set(f.answer.match(/[a-z]/g)||[])]:[];return `<div class="field"><label for="input-${q.id}-${j}">${f.label}</label>${f.type==='choice'?`<div class="options">${f.options.map((o,i)=>`<button class="option ${v===i?'selected':''}" aria-pressed="${v===i}" onclick="choose('${q.id}',${j},${i})">${String.fromCharCode(65+i)}. ${o}</button>`).join('')}</div>`:`<div class="entry"><input id="input-${q.id}-${j}" type="text" inputmode="${f.type==='number'?'decimal':'text'}" autocomplete="off" maxlength="160" value="${esc(v??'')}" placeholder="${f.type==='expr'?'填写含字母的式子':'填写数值'}" oninput="edit('${q.id}',${j},this.value)"><small>${f.unit||''}</small></div>${f.type==='expr'?`<div class="keypad">${[...letters,'+','−','×','÷','(',')','²'].map(t=>`<button onclick="insert('${q.id}',${j},'${t}')" aria-label="插入${t}">${t}</button>`).join('')}</div><div class="small">只填式子，不写等号和单位。支持等价写法、括号与平方。</div>`:''}`}${result?`<div id="feedback-${q.id}-${j}" class="feedback ${result.correct?'good':'retry'}" role="status">${result.correct?'✓ 这一项答对了。':esc(result.error||'这一项还需调整。重新看已知量、所求量和运算顺序。')}</div>`:''}</div>`;}).join('')}${q.group!=='warm'?`<details><summary>记下思路（可选，供课堂讨论）</summary>${['字母表示什么？','先求什么量？','整个式子表示什么？'].map((t,i)=>`<label for="note-${q.id}-${i}">${t}</label><input id="note-${q.id}-${i}" type="text" maxlength="500" value="${esc(r.notes[i]||'')}" oninput="note('${q.id}',${i},this.value)">`).join('')}<p class="small">这些文字不自动判分，需要讲给老师听。</p></details>`:''}<div class="actions">${!test?`<button class="primary" onclick="check('${q.id}')">检查本题</button><button onclick="toggle('${q.id}','hint')">${r.hint?'收起提示':'一点提示'}</button>`:''}${allowed?`<button onclick="toggle('${q.id}','show')">${r.show?'收起解析':'查看解析'}</button>`:''}</div>${allowed&&r.hint?`<p class="hint">提示：${q.hint}</p>`:''}${allowed&&r.show?`<div class="solution">${q.solution}<p class="small">看过解析会单独记录；遮住后再独立做一次。</p></div>`:''}`;}
function getQ(id){return QUESTIONS.find(q=>q.id===id);}
function invalidate(q){const r=rec(q);r.checked=false;r.results=[];if(q.group==='test')state.submitted=false;}
function edit(id,j,v){const q=getQ(id);rec(q).values[j]=v;invalidate(q);save();q.fields.forEach((f,i)=>{const el=$('feedback-'+id+'-'+i);if(el)el.remove();});if(q.group==='test')document.querySelectorAll('.solution,.feedback').forEach(el=>el.remove());}
function choose(id,j,v){const q=getQ(id);rec(q).values[j]=v;invalidate(q);save();render();}
function insert(id,j,t){const el=$('input-'+id+'-'+j);if(!el)return;const a=el.selectionStart??el.value.length,b=el.selectionEnd??a,v=el.value.slice(0,a)+t+el.value.slice(b);if(v.length>160)return;el.value=v;edit(id,j,v);el.focus();el.setSelectionRange(a+t.length,a+t.length);}
function note(id,j,v){rec(getQ(id)).notes[j]=v;save();}
function gradeQ(q){const r=rec(q);r.results=q.fields.map((f,j)=>Algebra.grade(f,r.values[j]));r.checked=true;r.wrong=!r.results.every(x=>x.correct);r.attempts=(Number(r.attempts)||0)+1;}
function check(id){gradeQ(getQ(id));save();render();}
function toggle(id,k){const r=rec(getQ(id));r[k]=!r[k];if(k==='show'&&r[k])r.viewed=true;if(k==='hint'&&r[k])r.hinted=true;save();render();}
function submitTest(){qs('test').forEach(gradeQ);state.submitted=true;save();render();}
function renderReview(){const good=QUESTIONS.filter(passed),bad=QUESTIONS.filter(q=>rec(q).wrong);$('main').innerHTML=`<article class="card"><h2>学习记录</h2><div class="summary"><span>整题答对 ${good.length}/${QUESTIONS.length}</span><span>待订正 ${bad.length}</span><span>看过解析 ${QUESTIONS.filter(q=>rec(q).viewed).length}</span></div><p class="small">整题答对表示该题的列式、计算等各项均已通过最近一次检查；不代表思路表达已自动评分。</p>${bad.length?bad.map(q=>`<div class="record"><div>${q.prompt}<br><span class="small">${q.id} · ${q.source}${rec(q).viewed?' · 看过解析':''}</span></div><button onclick="openQ('${q.id}')">再做一次</button></div>`).join(''):'<p>目前没有待订正题。可以回到各部分继续练习。</p>'}<div class="actions"><button onclick="go('warm')">回到热身</button><button onclick="exportRecord()">导出记录</button></div></article>`;}
function exportRecord(){const lines=['第五单元｜应用题专项','导出时间：'+new Date().toLocaleString('zh-CN'),''];for(const q of QUESTIONS){const r=rec(q);if(!r.attempts&&!r.viewed&&!r.hinted&&!r.values.some(v=>v!==null&&v!==''&&v!==undefined)&&!r.notes.some(Boolean))continue;lines.push(q.id+' '+q.prompt,q.source);q.fields.forEach((f,j)=>lines.push(f.label+'：'+(f.type==='choice'?(f.options[r.values[j]]||'未选'):(r.values[j]??'未填'))+(f.unit||'')));lines.push('状态：'+(passed(q)?'整题答对':r.wrong?'待订正':'未检查')+'；检查'+(r.attempts||0)+'次'+(r.viewed?'；看过解析':'')+(r.hinted?'；用过提示':''));r.notes.forEach((v,i)=>{if(v)lines.push(['字母含义','先求什么','式子的意思'][i]+'：'+v);});lines.push('解析：'+q.solution,'');}const u=URL.createObjectURL(new Blob([lines.join('\n')],{type:'text/plain;charset=utf-8'})),a=document.createElement('a');a.href=u;a.download='应用题专项_学习记录.txt';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),1000);}
render();
