<script>
const DATA={"topics":[["平均分与每份量","总量分成几份，每份有多少？"],["求数量与份数","知道总量和每份量，能分成几份？"],["求倍数","先找作为标准的量，再判断除法顺序。"],["单位量推算与比较","先统一成每小时、每千米、每千克的量。"],["总量不变","找出没有直接给出的总钱数或总材料。"],["实际取整","完整制作、全部装下，分别怎样处理余量？"],["倍数关系与逆推","用一份表示原量，把总和或差对应到份数。"],["多步材料配套","先算实际做出的数量，再配套购买材料。"],["拓展：近似数范围","从近似值找边界，再反推原来的量。"],["拓展：循环规律","分清前缀与循环节，用余数确定位置。"]],"questions":[{"id":"O01-original","topic":0,"pair":"O01","kind":"original","title":"矿泉水单价","source":"第29页 第1题（应用部分）","text":"妈妈花8.4元买了7瓶矿泉水，每瓶矿泉水多少元？","fields":[{"label":"每瓶价格","value":1.2,"unit":"元","kind":"number"}],"hints":["求的是总价还是每瓶价格？","8.4元平均分给7瓶。"],"steps":["8.4÷7＝1.2（元）。","答：每瓶矿泉水1.2元。"],"trap":"每瓶单价的单位是元，也可以说元/瓶。","change":""},{"id":"O01-variant","topic":0,"pair":"O01","kind":"variant","title":"整箱购买，求每瓶价格","source":"对应原题：第29页 第1题（应用部分）","text":"活动买了2箱相同的饮用水，每箱24瓶，共付67.2元。每瓶水平均多少钱？","fields":[{"label":"每瓶价格","value":1.4,"unit":"元","kind":"number"}],"hints":["总瓶数没有直接写出，先求一共有几瓶。","2箱对应48瓶，再平均分总价。"],"steps":["总瓶数：24×2＝48（瓶）。","单价：67.2÷48＝1.4（元）。"],"trap":"不能把总价直接除以24，67.2元买的是两箱。","change":"增加整箱数量，需要先求总份数。"},{"id":"O02-original","topic":0,"pair":"O02","kind":"original","title":"平均用绳","source":"第29页 第3题（2）","text":"李阿姨有一捆9.6米的彩绳，要编6个中国结，平均每个中国结用多少米彩绳？","fields":[{"label":"平均每个用绳","value":1.6,"unit":"米","kind":"number"}],"hints":["把总长度平均分成6份。","总长度÷个数＝平均每个用绳长度。"],"steps":["9.6÷6＝1.6（米）。"],"trap":"9.6÷6的商是1.6，不是16或0.16。","change":"","choice":["1.6米","16米","0.16米","1.06米"],"correctChoice":"1.6米"},{"id":"O02-variant","topic":0,"pair":"O02","kind":"variant","title":"先求每个用量，再求能做几个","source":"对应原题：第29页 第3题（2）","text":"编4个相同挂饰用了3.6米绳。现在还剩10.8米同样的绳，照这样的用量，还可以编几个挂饰？","fields":[{"label":"还可编","value":12,"unit":"个","kind":"number"}],"hints":["先求每个挂饰平均用绳多少米。","剩余总绳长除以每个用量。"],"steps":["每个用绳：3.6÷4＝0.9（米）。","还可编：10.8÷0.9＝12（个）。"],"trap":"10.8÷3.6得到的是4个挂饰用量的倍数，还不是挂饰个数。","change":"从求每份量转为先求每份量、再求新份数。"},{"id":"O03-original","topic":0,"pair":"O03","kind":"original","title":"三家超市牛奶价格","source":"第30页 第6题","text":"三个超市销售同品牌、同规格牛奶。求各超市每盒价格，帮助小明判断在哪个超市购买更实惠。","fields":[{"label":"A超市每盒","value":4.5,"unit":"元","kind":"number"},{"label":"B超市每盒","value":4.4,"unit":"元","kind":"number"},{"label":"C超市每盒","value":4.3,"unit":"元","kind":"number"}],"hints":["各家销售的盒数不同，先统一为每盒价格。","总价÷盒数＝单价。"],"steps":["A：4.5÷1＝4.5（元）。","B：13.2÷3＝4.4（元）；C：21.5÷5＝4.3（元）。","4.3＜4.4＜4.5，C超市更实惠。"],"trap":"不能只选总价最低的一组。","change":"","choice":["A超市","B超市","C超市"],"correctChoice":"C超市","table":[["超市","盒数","总价"],["A","1盒","4.5元"],["B","3盒","13.2元"],["C","5盒","21.5元"]]},{"id":"O03-variant","topic":0,"pair":"O03","kind":"variant","title":"赠品也要计入实际数量","source":"对应原题：第30页 第6题","text":"三家店销售相同的收纳盒，价格如下。把赠送的盒子也算进去，哪家实际每个最便宜？","fields":[{"label":"甲店每个","value":3.5,"unit":"元","kind":"number"},{"label":"乙店每个","value":3.3,"unit":"元","kind":"number"},{"label":"丙店每个","value":2.9,"unit":"元","kind":"number"}],"hints":["丙店实际能拿到几个盒子？","用实际支付的钱，除以实际拿到的总个数。"],"steps":["甲：21÷6＝3.5（元）；乙：13.2÷4＝3.3（元）。","丙：买5送1，实际6个，17.4÷6＝2.9（元）。","丙店单价最低。"],"trap":"赠送的1个也属于实际得到的数量。","change":"加入买赠信息，比较实际每份价格。","choice":["甲店","乙店","丙店"],"correctChoice":"丙店","table":[["店铺","购买方案","实付款"],["甲店","6个","21元"],["乙店","4个","13.2元"],["丙店","买5个送1个","17.4元"]]},{"id":"O04-original","topic":0,"pair":"O04","kind":"original","title":"羽毛球单价与循环商","source":"第33页 第1题（应用及观察）","text":"爸爸花14元买了一筒羽毛球，一筒6个。一个羽毛球大约多少钱？先用循环小数准确表示14÷6的商，再观察继续除时重复的余数和商。","fields":[{"label":"14÷6的商","value":"2.(3)","unit":"","kind":"cycle"},{"label":"重复出现的余数","value":2,"unit":"","kind":"number"},{"label":"重复出现的商的数字","value":3,"unit":"","kind":"number"}],"hints":["除到整数商2后，还余多少？添0再除。","后面反复出现20÷6，观察余数和商。"],"steps":["14÷6＝2.333…＝2.(3)，即2.（3）循环。","整数商2后余2；添0成20，商3又余2，此后反复。","原题没有指定单价保留几位；这里核对的是循环商，不强行指定金额近似值。"],"trap":"有限小数2.33不等于准确的循环商2.333…；题目未指定近似位数。","change":""},{"id":"O04-variant","topic":0,"pair":"O04","kind":"variant","title":"准确值与近似值分开写","source":"对应原题：第33页 第1题（应用及观察）","text":"8个相同零件共重18.6千克。平均每个零件准确重多少千克？把结果保留两位小数又是多少千克？","fields":[{"label":"准确质量","value":2.325,"unit":"千克","kind":"number"},{"label":"保留两位小数","value":2.33,"unit":"千克","kind":"number"}],"hints":["先求准确商，检查能否除尽。","保留两位小数，看千分位。"],"steps":["18.6÷8＝2.325（千克），这是有限小数。","千分位是5，保留两位小数得2.33千克。"],"trap":"准确值用等号，近似值用约等号，不要把二者混为一谈。","change":"与原题对照有限商和循环商，并分别填写准确值、近似值。"},{"id":"O05-original","topic":1,"pair":"O05","kind":"original","title":"买营养土与竖式含义","source":"第29页 第3题（1）","text":"小丽买营养土种花，一共用去13.5元，每千克营养土3元。买了多少千克？竖式13.5÷3＝4.5中，最后一次减去的“15”表示什么？","fields":[{"label":"营养土质量","value":4.5,"unit":"千克","kind":"number"}],"hints":["总价÷每千克价格，得到质量。","竖式最后求的是0.5千克对应的钱数，15的单位是角。"],"steps":["13.5÷3＝4.5（千克）。","最后减去的15表示买0.5千克营养土需要15角。"],"trap":"不能把竖式中的15直接理解为15元。","change":"","choice":["买3千克需要15角","买0.5千克需要15角","买0.5千克需要15元","买4.5千克需要15元"],"correctChoice":"买0.5千克需要15角"},{"id":"O05-variant","topic":1,"pair":"O05","kind":"variant","title":"先求袋数，再算总质量","source":"对应原题：第29页 第3题（1）","text":"每袋营养土0.5千克，售价2.1元。花12.6元买这种营养土，买了几袋？总质量是多少千克？","fields":[{"label":"袋数","value":6,"unit":"袋","kind":"number"},{"label":"总质量","value":3,"unit":"千克","kind":"number"}],"hints":["先用钱数除以每袋售价，算式的结果是什么单位？","求出袋数后，再用每袋质量乘袋数。"],"steps":["袋数：12.6÷2.1＝6（袋）。","总质量：0.5×6＝3（千克）。"],"trap":"售价与每袋质量是两种信息，12.6÷0.5不能求袋数。","change":"加入包装质量，先求数量，再求总质量。"},{"id":"O06-original","topic":1,"pair":"O06","kind":"original","title":"废纸回收","source":"第35页 第1题（应用部分）","text":"废纸回收站按每千克0.75元回收废纸。五（3）班共收入6.75元，一共回收多少千克废纸？先估一估，再计算。","fields":[{"label":"废纸质量","value":9,"unit":"千克","kind":"number"}],"hints":["收入对应总价，每千克价格对应单价。","把6.75元和0.75元同时换成分，商会改变吗？"],"steps":["6.75÷0.75＝675÷75＝9（千克）。","也可用9×0.75＝6.75检验。"],"trap":"被除数和除数的小数点必须同向移动相同位数。","change":""},{"id":"O06-variant","topic":1,"pair":"O06","kind":"variant","title":"剔除奖励，再求回收单价","source":"对应原题：第35页 第1题（应用部分）","text":"科普小组交回12.8千克废纸，共收到10.84元，其中0.6元是额外环保奖励。废纸实际按每千克多少元回收？","fields":[{"label":"每千克回收价格","value":0.8,"unit":"元","kind":"number"}],"hints":["总收入中有一部分不是废纸价款。","先扣奖励，剩下的价款再除以质量。"],"steps":["废纸价款：10.84－0.6＝10.24（元）。","单价：10.24÷12.8＝0.8（元/千克）。"],"trap":"额外奖励不能算入废纸的单价。","change":"把所求量改成单价，并加入需先扣除的额外收入。"},{"id":"O07-original","topic":1,"pair":"O07","kind":"origina 张叔叔行驶127千米用了1.5小时。谁开车速度快？除不尽的用循环小数表示商。","fields":[{"label":"李叔叔速度","value":"85.8(3)","unit":"千米/时","kind":"cycle"},{"label":"张叔叔速度","value":"84.(6)","unit":"千米/时","kind":"cycle"}],"hints":["路程和用时都不同，先统一求每小时行驶多少千米。","路程÷时间＝速度，再逐位比较。"],"steps":["李：103÷1.2＝85.833…＝85.8(3)（千米/时）。","张：127÷1.5＝84.666…＝84.(6)（千米/时）。","85.833…＞84.666…，李叔叔更快。"],"trap":"不能只根据127千米大于103千米就判张叔叔更快。","change":"","choice":["李叔叔","张叔叔"],"correctChoice":"李叔叔"},{"id":"O12-variant","topic":3,"pair":"O12","kind":"variant","title":"比较速度后继续推算","source":"对应原题：第34页 第7题","text":"甲同学0.75小时读36页，乙同学0.8小时读40页。两人各自保持原来的阅读速度。（1）谁读得快？（2）乙同学读完75页需要多少小时？","fields":[{"label":"乙读75页用时","value":1.5,"unit":"小时","kind":"number"}],"hints":["先分别算每小时读几页。","比较后，用75页除以乙的阅读速度。"],"steps":["甲：36÷0.75＝48（页/小时）。","乙：40÷0.8＝50（页/小时），乙更快。","乙读75页需75÷50＝1.5（小时）。"],"trap":"0.8小时比0.75小时长，不代表阅读速度更慢。","change":"增加比较后的反向推算：由任务量求时间。","choice":["甲同学","乙同学"],"correctChoice":"乙同学"},{"id":"O13-original","topic":3,"pair":"O13","kind":"original","title":"每千米耗电量","source":"第41页 易错例题3","text":"一辆电动汽车行驶100千米耗电12千瓦时。求每行驶1千米耗电量。书中错误示例列为100÷12≈8.33千瓦时，请订正。","fields":[{"label":"每千米耗电","value":0.12,"unit":"千瓦时","kind":"number"}],"hints":["把12千瓦时平均分给100千米。","看清“每千米耗多少电”，不是“每千瓦时能行驶多少千米”。"],"steps":["12÷100＝0.12（千瓦时）。","100÷12求的是每千瓦时能行驶的路程，不是本问。"],"trap":"这是教材印刷的错误示例，不是学生个人错误记录。","change":""},{"id":"O13-variant","topic":3,"pair":"O13","kind":"variant","title":"剩余电量能行驶多远","source":"对应原题：第41页 易错例题3","text":"一辆电动巡逻车行驶18千米耗电2.7千瓦时。照这样的耗电情况，剩余8.1千瓦时电量可以行驶多少千米？","fields":[{"label":"可行驶路程","value":54,"unit":"千米","kind":"number"}],"hints":["先求每行驶1千米耗电多少。","剩余电量÷每千米耗电量＝可行驶路程。"],"steps":["每千米耗电：2.7÷18＝0.15（千瓦时）。","可行驶：8.1÷0.15＝54（千米）。","也可用8.1÷2.7×18＝54。"],"trap":"8.1÷2.7得到的是原路程的倍数3，还要乘18千米。","change":"由求单位耗电转为根据剩余电量求路程，保留等价解法。"},{"id":"O14-original","topic":3,"pair":"O14","kind":"original","title":"花生油单位价格","source":"第43页 应用题2","text":"同一种花生油有A、B两种规格。买一桶，哪款比较划算？","fields":[],"hints":["两桶质量不同，应比较每千克的价格。","每桶售价除以每桶质量，再比较。"],"steps":["A：51.87÷2.24＝23.15625（元/千克）。","B： function record(i){let id=QUESTIONS[i].id;if(!records[id]||typeof records[id]!=='object')records[id]={};const r=records[id];if(!Array.isArray(r.answers))r.answers=[];return r;}
function save(){try{localStorage.setItem(KEY,JSON.stringify({records,ui:{topic,kind,reviewOnly,current:QUESTIONS[current]?.id}}));}catch(e){storageOK=false;}if(!storageOK)el('storageNotice').textContent='当前浏览器无法保存记录，离开前请导出学习记录。';}
function indices(){return QUESTIONS.map((q,i)=>i).filter(i=>(topic<0||QUESTIONS[i].topic===topic)&&(kind==='all'||QUESTIONS[i].kind===kind)&&(!reviewOnly||record(i).review));}
function status(i){let r=record(i);return r.correct?(r.hints||r.viewed?'借助提示核对通过':'答案核对通过'):(r.checked?'待订正':'未核对');}
function typeName(q){return q.kind==='original'?'练习册原题':'举一反三·变式题';}
function short(q){return(q.kind==='original'?'原':'变')+q.pair.slice(1);}
function display(f){return f.kind==='cycle'?f.value.replace(/\((\d+)\)/,'（$1）循环'):f.value;}
function updateStats(){const passed=QUESTIONS.filter((q,i)=>record(i).correct).length,assisted=QUESTIONS.filter((q,i)=>record(i).correct&&(record(i).hints||record(i).viewed)).length,marked=QUESTIONS.filter((q,i)=>record(i).review).length;el('progressText').textContent='已通过核对 '+passed+' / '+QUESTIONS.length;el('progress').value=passed;el('stats').textContent='其中借助提示 '+assisted+' 题 · 标记再练 '+marked+' 题';}
function selectValid(){const ids=indices();if(!ids.includes(current))current=ids.length?ids[0]:-1;}
function renderSidebar(){const total=indices().length;el('topics').innerHTML='<button class="day '+(topic===-1?'active':'')+'" onclick="chooseTopic(-1)" aria-pressed="'+(topic===-1)+'">全部类型<span class="topiccount">62题</span><small>原题与对应变式成对排列</small></button>'+TOPICS.map((t,k)=>{const n=QUESTIONS.filter(q=>q.topic===k).length;return '<button class="day '+(topic===k?'active':'')+'" onclick="chooseTopic('+k+')" aria-pressed="'+(topic===k)+'">'+String(k+1).padStart(2,'0')+' '+t[0]+'<span class="topiccount">'+n+'题</span><small>'+n/2+'原题＋'+n/2+'变式</small></button>';}).join('');el('numbers').innerHTML=indices().map(i=>'<button class="num '+(i===current?'active ':'')+(record(i).correct?'pass ':'')+(record(i).review?'star':'')+'" onclick="chooseQuestion('+i+')" aria-label="'+typeName(QUESTIONS[i])+' '+QUESTIONS[i].title+' '+status(i)+'" '+(i===current?'aria-current="true"':'')+'>'+short(QUESTIONS[i])+'</button>').join('');el('groupCount').textContent='（'+total+'题）';el('reviewOnly').checked=reviewOnly;el('kinds').innerHTML=[['all','全部'],['original','只看原题'],['variant','只看变式']].map(([v,label])=>'<button class="'+(kind===v?'selected':'')+'" onclick="chooseKind(\''+v+'\')" aria-pressed="'+(kind===v)+'">'+label+'</button>').join('');updateStats();}
function chooseTopic(t){topic=t;const ids=indices();current=ids.length?ids[0]:-1;render();save();}
function chooseKind(k){kind=k;selectValid();render();save();}
function chooseQuestion(i){current=i;render();save();}
function toggleReviewFilter(v){reviewOnly=v;selectValid();render();save();}
function move(d){const ids=indices(),p=ids.indexOf(current);if(ids[p+d]!==undefined){current=ids[p+d];render();save();el('main').scrollIntoView({behavior:'smooth',block:'start'});}}
function jumpPair(){const q=QUESTIONS[current],i=QUESTIONS.findIndex(x=>x.pair===q.pair&&x.kind!==q.kind);if(i<0)return;topic=QUESTIONS[i].topic;if(kind!=='all')kind=QUESTIONS[i].kind;if(reviewOnly&&!record(i).review)reviewOnly=false;current=i;render();save();}
function tableHTML(q){return q.table?'<div class="tablewrap"><table><thead><tr>'+q.table[0].map(x=>'<th scope="col">'+esc(x)+'</th>').join('')+'</tr></thead><tbody>'+q.table.slice(1).map(row=>'<tr>'+row.map(x=>'<td>'+esc(x)+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>':'';}
function diagram(q){if(q.topic===7)return '<div class="flow"><span>可用主材料</span><b>→</b><span>实际完整数量</span><b>→</b><span>配套材料总量</span><b>→</b><span>购买整卷数量</span></div>';if(!q.diagram)return '';const[a,b,la,lb]=q.diagram,w=250/Math.max(a,b);return '<div class="svgbox"><svg viewBox="0 0 480 128" role="img" aria-label="'+esc(la)+' '+a+'份；'+esc(lb)+' '+b+'份"><text x="2" y="35" font-size="13" fill="#405b50">'+esc(la)+'</text><text x="2" y="95" font-size="13" fill="#405b50">'+esc(lb)+'</text>'+[[a,15],[b,75]].map(([n,y])=>'<rect x="175" y="'+y+'" width="'+(n*w)+'" height="30" rx="4" fill="#d6e7d7" stroke="#205c50"/>'+Array.from({length:Math.ceil(n)-1},(_,i)=>'<line x1="'+(175+(i+1)*w)+'" x2="'+(175+(i+1)*w)+'" y1="'+y+'" y2="'+(y+30)+'" stroke="#205c50"/>').join('')+'<text x="'+(184+n*w)+'" y="'+(y+21)+'" font-size="13" fill="#205c50">'+n+'份</text>').join('')+'</svg></div>';}
function clean(v){return String(v??'').normalize('NFKC').trim().replace(/\s/g,'').replace(/循环/g,'');}
function numeric(v){const s=clean(v);return /^[+-]?(?:\d+(?:\.\d*)?|\.\d+)$/.test(s)?Number(s):NaN;}
function fraction(s){s=clean(s);let m=/^(\d+)\.(\d*)\((\d+)\)$/.exec(s);if(m){const p=10n**BigInt(m[2].length),r=10n**BigInt(m[3].length)-1n;return [(BigInt(m[1])*p+BigInt(m[2]||'0'))*r+BigInt(m[3]),p*r];}m=/^(\d+)\/(\d+)$/.exec(s);if(m&&BigInt(m[2])!==0n)return[BigInt(m[1]),BigInt(m[2])];m=/^(\d+)(?:\.(\d+))?$/.exec(s);if(m){const p=10n**BigInt((m[2]||'').length);return[BigInt(m[1])*p+BigInt(m[2]||'0'),p];}return null;}
function sameCycle(v,expected){const target=fraction(expected);if(!target)return false;const eq=x=>x&&x[0]*target[1]===target[0]*x[1];let s=clean(v);if(s.length>200)return false;if(eq(fraction(s)))return true;s=s.replace(/…+/g,'...');const m=/^(\d+)\.(\d+)\.{3,}$/.exec(s);if(!m)return false;const digits=m[2];for(let p=0;p<digits.length;p++)for(let len=1;len*2<=digits.length-p;len++){const cyc=digits.slice(p,p+len),tail=digits.slice(p);if([...tail].every((c,i)=>c===cyc[i%len])&&eq(fraction(m[1]+'.'+digits.slice(0,p)+'('+cyc+')')))return true;}return false;}
function fieldCorrect(f,v){if(f.kind==='cycle')return sameCycle(v,f.value);const n=numeric(v);return Number.isFinite(n)&&Math.abs(n-f.value)<=1e-8*Math.max(1,Math.abs(f.value));}
function resultHTML(){const q=QUESTIONS[current],r=record(current);if(!r.checked)return '';if(r.correct)return '答案核对通过。'+(r.hints||r.viewed?'本题用过提示或解析，请之后独立再做一次。':'请再讲清：每一步求什么，为什么这样列式？');const bad=q.fields.filter((f,i)=>!fieldCorrect(f,r.answers[i])).map(f=>f.label);if(q.choice&&r.choice!==q.correctChoice)bad.push('选择判断');return '再检查：'+esc(bad.join('、'))+'。'+(q.fields.some(f=>f.kind==='cycle')?'循环小数请按提示格式填写，有限近似值不能代替准确循环商。':'先看看条件、单位和题目最后问的量，再试一次。');}
function render(){selectValid();renderSidebar();if(current<0){el('main').innerHTML='<div class="empty"><h2>当前筛选没有题目</h2><p>可以切换题型，或取消再练筛选。</p><button onclick="showAll()">查看全部62题</button></div>';return;}const q=QUESTIONS[current],r=record(current),h=Math.min(Number(r.hints)||0,q.hints.length),ids=indices(),p=ids.indexOf(current);el('main').innerHTML='<article class="card"><div class="cardtop"><span class="tag '+(q.kind==='original'?'original-tag':'variant-tag')+'">'+typeName(q)+' · '+short(q)+'</span><button class="bookmark '+(r.review?'on':'')+'" onclick="markReview()" aria-pressed="'+!!r.review+'">'+(r.review?'★ 已标记再练':'☆ 标记再练')+'</button></div><p class="source">'+esc(q.source)+(q.kind==='original'?' · 文字整理':'')+'</p><h2 id="title">'+esc(q.title)+'</h2><p class="question">'+esc(q.text)+'</p>'+tableHTML(q)+'<div class="sectionlabel"><label for="thinking">我的列式与理由</label><span class="notehint">可以在纸上做，也可以在这里记下每一步的意思</span></div><textarea id="thinking" placeholder="已知什么？求什么？先算什么？为什么这样算？" oninput="setThinking(this.value)">'+esc(r.thinking||'')+'</textarea>'+(q.fields.length?'<div class="sectionlabel">填写结果<span class="notehint">数值题只填数值，单位已列出</span></div><div class="fields">'+q.fields.map((f,i)=>'<div class="field"><label for="answer'+i+'">'+esc(f.label)+'</label><div class="inputrow"><input id="answer'+i+'" type="text" inputmode="'+(f.kind==='cycle'?'text':'decimal')+'" autocomplete="off" value="'+esc(r.answers[i]??'')+'" oninput="setAnswer('+i+',this.value)" onkeydown="if(event.key===\'Enter\')checkAnswer()"><span class="unit">'+esc(f.unit)+'</span></div></div>').join('')+'</div>':'')+(q.fields.some(f=>f.kind==='cycle')?'<p class="answerhelp">循环小数写法示例：2.(3) 或 2.（3）循环；8.12(45) 表示8.124545…。</p>':'')+(q.choice?'<div class="sectionlabel">选择判断</div><div class="choice">'+q.choice.map((c,i)=>'<button onclick="setChoice('+i+')" aria-pressed="'+(r.choice===c)+'">'+esc(c)+'</button>').join('')+'</div>':'')+'<div class="actions"><button class="primary" onclick="checkAnswer()">核对答案</button><button onclick="nextHint()" '+(h>=q.hints.length?'disabled':'')+'>'+(h?'下一步提示':'看一点提示')+' ('+h+'/'+q.hints.length+')</button><button onclick="showSolution()">'+(r.openSolution?'收起解析':'查看答案解析')+'</button></div><div id="result" class="result '+(r.correct?'good':'retry')+'" role="status" aria-live="polite">'+resultHTML()+'</div>'+(h?'<section class="hintbox"><h3>分步提示</h3>'+q.hints.slice(0,h).map((s,i)=>'<p>'+(i+1)+'．'+esc(s)+'</p>').join('')+(h>=2?diagram(q):'')+'</section>':'')+(r.openSolution?'<section class="solution"><h3>答案与解析</h3><div class="answerlist">'+q.fields.map(f=>esc(f.label)+'：'+esc(display(f))+esc(f.unit)).join('；')+(q.correctChoice?(q.fields.length?'；':'')+esc(q.correctChoice):'')+'</div><ol>'+q.steps.map(s=>'<li>'+esc(s)+'</li>').join('')+'</ol>'+(q.change?'<div class="change"><strong>这道变式改变了什么？</strong><br>'+esc(q.change)+'</div>':'')+'<div class="trap">容易混淆：'+esc(q.trap)+'</div></section>':'')+'<div class="counterpart"><span>同一组 · '+(q.kind==='original'?'学完原题，换个条件再试一次。':'回看原题，比较哪里变了、哪里没变。')+'</span><button onclick="jumpPair()">'+(q.kind==='original'?'做对应变式 →':'← 看对应原题')+'</button></div></article><div class="navbottom"><button onclick="move(-1)" '+(p<=0?'disabled':'')+'>← 上一题</button><span>当前题组 '+(p+1)+' / '+ids.length+'</span><button onclick="move(1)" '+(p===ids.length-1?'disabled':'')+'>下一题 →</button></div>';}
function showAll(){topic=-1;kind='all';reviewOnly=false;current=0;render();save();}
function invalidate(){const r=record(current);r.checked=false;r.correct=false;save();el('result').textContent='';renderSidebar();}
function setAnswer(i,v){record(current).answers[i]=v;invalidate();}
function setThinking(v){record(current).thinking=v;save();}
function setChoice(i){record(current).choice=QUESTIONS[current].choice[i];invalidate();render();}
function checkAnswer(){if(current<0)return;const q=QUESTIONS[current],r=record(current);r.correct=q.fields.every((f,i)=>fieldCorrect(f,r.answers[i]))&&(!q.choice||r.choice===q.correctChoice);r.checked=true;save();render();}
function nextHint(){if(current<0)return;const r=record(current);r.hints=Math.min((Number(r.hints)||0)+1,QUESTIONS[current].hints.length);save();render();}
function showSolution(){if(current<0)return;const r=record(current);r.openSolution=!r.openSolution;if(r.openSolution)r.viewed=true;save();render();}
function markReview(){const r=record(current);r.review=!r.review;save();render();save();}
function printSheet(answers){const ids=indices();el('printarea').innerHTML='<h1>小数除法｜'+(topic<0?'全部类型':esc(TOPICS[topic][0]))+(answers?'｜答案解析':'')+'</h1><p>当前筛选共'+ids.length+'题；原题与变式按标签区分。</p>'+ids.map(i=>{const q=QUESTIONS[i];return '<article class="printq"><h3>'+short(q)+'｜'+esc(q.title)+'【'+typeName(q)+'】</h3><p class="print-source">'+esc(q.source)+'</p><p>'+esc(q.text).replace(/\n/g,'<br>')+'</p>'+tableHTML(q)+(q.choice?'<p>选项：'+q.choice.map((c,i)=>String.fromCharCode(65+i)+'．'+esc(c)).join('　')+'</p>':'')+(answers?'<p class="print-answers"><strong>'+q.fields.map(f=>esc(f.label)+'：'+esc(display(f))+esc(f.unit)).join('；')+(q.correctChoice?'；'+esc(q.correctChoice):'')+'</strong></p><ol>'+q.steps.map(s=>'<li>'+esc(s)+'</li>').join('')+'</ol>'+(q.change?'<p>变式变化：'+esc(q.change)+'</p>':'')+'<p>易混点：'+esc(q.trap)+'</p>':'<div class="workspace"></div>')+'</article>';}).join('');window.print();}
function exportRecords(){const text='小数除法分类练习｜学习记录\n导出时间：'+new Date().toLocaleString('zh-CN',{timeZone:'Asia/Shanghai'})+'（北京时间）\n\n'+QUESTIONS.map((q,i)=>{const r=record(i);return short(q)+' '+q.title+'【'+typeName(q)+'】\n来源：'+q.source+'\n状态：'+status(i)+(r.review?'；标记再练':'')+'\n列式与理由：'+(r.thinking||'未填写')+'\n我的结果：'+q.fields.map((f,j)=>f.label+' '+(r.answers[j]??'未填写')+f.unit).join('；')+(q.choice?'；选择：'+(r.choice||'未选择'):'')+'\n提示：'+(r.hints||0)+'步；看过解析：'+(r.viewed?'是':'否');}).join('\n\n');const url=URL.createObjectURL(new Blob([text],{type:'text/plain;charset=utf-8'})),a=document.createElement('a');a.href=url;a.download='分类应用题_学习记录.txt';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);}
render();save();
</script></body></html>
