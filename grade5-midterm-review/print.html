<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>期中原卷</title>
<style>
  body{margin:0;background:#e7edf0;color:#142633;font:16px system-ui,sans-serif}
  header{display:flex;justify-content:center;align-items:center;gap:18px;padding:12px}
  h1{font-size:17px;margin:0}
  button{font:inherit;color:white;background:#17645d;border:0;border-radius:6px;padding:7px 12px;cursor:pointer}
  .page{position:relative;width:min(100%,210mm);margin:0 auto 12px;background:white}
  .page img{display:block;width:100%;height:auto}
  .page .exam-marks{position:absolute;inset:0;height:100%;pointer-events:none}
  @page{size:A4;margin:0}
  @media print{
    header{display:none}
    body{background:white}
    .page{width:210mm;height:296.8mm;margin:0;break-after:page}
    .page img{height:100%;object-fit:fill}
    .page:last-child{break-after:auto}
  }
</style>
</head>
<body>
<header><h1 id="name"></h1><button id="print" type="button" disabled>打印 / 保存为 PDF</button></header>
<main id="pages"></main>
<script src="lessons.js"></script>
<script>
  const subject = new URLSearchParams(location.search).get('subject') === 'math' ? 'math' : 'en';
  const course = courses[subject];
  const marked = subject === 'math';
  const edition = course.edition + (marked ? ' · 易错题标注版' : '');
  document.title = edition;
  document.querySelector('#name').textContent = course.name + ' · ' + edition;
  const pages = document.querySelector('#pages');
  const print = document.querySelector('#print');
  const images = [];
  for (let number = 1; number <= course.pages; number++) {
    const page = document.createElement('div');
    page.className = 'page';
    const image = new Image(1547, 2190);
    image.alt = course.name + '原卷第' + number + '页';
    image.src = 'assets/' + subject + '-' + number + '.webp';
    page.append(image);
    images.push(image.decode());
    if (marked) {
      const marks = new Image();
      marks.alt = '';
      marks.className = 'exam-marks';
      marks.src = 'assets/math-marks-' + number + '.svg';
      page.append(marks);
      images.push(marks.decode());
    }
    pages.append(page);
  }
  Promise.all(images).then(() => {
    print.disabled = false;
  }).catch(() => {
    print.textContent = '请刷新重试';
  });
  print.addEventListener('click', () => window.print());
</script>
</body>
</html>
